function MarketingView({ site, updateSite }){
  const cleMessage = `maci-promo-message-${site.id}`;
  const cleSelection = `maci-promo-selection-${site.id}`;

  const [message, setMessage] = useState(() => {
    try { return localStorage.getItem(cleMessage) || ''; } catch(e){ return ''; }
  });
  const [pourcentage, setPourcentage] = useState('20');
  const [cible, setCible] = useState('dormants'); // 'dormants' | 'tous' | 'selection'
  const [selectionIds, setSelectionIds] = useState(() => {
    try { const raw = localStorage.getItem(cleSelection); return raw ? JSON.parse(raw) : []; } catch(e){ return []; }
  });
  const [rechercheClient, setRechercheClient] = useState('');
  const [envoyes, setEnvoyes] = useState({});

  useEffect(() => { try { localStorage.setItem(cleMessage, message); } catch(e){} }, [message]);
  useEffect(() => { try { localStorage.setItem(cleSelection, JSON.stringify(selectionIds)); } catch(e){} }, [selectionIds]);

  const clientsDormants = useMemo(() => {
    const sixMoisAvant = new Date();
    sixMoisAvant.setMonth(sixMoisAvant.getMonth() - 6);
    return site.clients.filter(cl => {
      const commandesClient = site.commandes.filter(c => c.clientId === cl.id);
      if(commandesClient.length === 0) return true;
      const derniereDate = commandesClient.reduce((max,c) => c.dateCreation > max ? c.dateCreation : max, commandesClient[0].dateCreation);
      return new Date(derniereDate) < sixMoisAvant;
    });
  }, [site]);

  function genererMessage(){
    const pct = Number(pourcentage) || 0;
    setMessage(`🎉 Promo spéciale chez ${site.nom} ! Profitez de -${pct}% sur nos services cette semaine seulement. Revenez vite en profiter — à bientôt !`);
  }

  function toggleSelection(clientId){
    setSelectionIds(prev => prev.includes(clientId) ? prev.filter(id=>id!==clientId) : [...prev, clientId]);
  }

  const clientsPourSelection = useMemo(() => {
    if(!rechercheClient.trim()) return site.clients;
    const q = rechercheClient.toLowerCase();
    return site.clients.filter(c => c.nom.toLowerCase().includes(q) || (c.tel||'').includes(q));
  }, [site.clients, rechercheClient]);

  const destinataires = cible === 'dormants' ? clientsDormants
    : cible === 'tous' ? site.clients
    : site.clients.filter(c => selectionIds.includes(c.id));
  const destinatairesAvecTel = destinataires.filter(c => c.tel);

  function envoyerA(client){
    const texte = message.trim();
    if(!texte || !client.tel) return;
    const tel = client.tel.replace(/\D/g,'');
    window.open(`https://wa.me/${tel}?text=${encodeURIComponent(texte)}`, '_blank');
    const notif = { id: uid('notif_'), clientId: client.id, message: texte, canal: 'WhatsApp', date: new Date().toISOString() };
    updateSite({ ...site, notifications: [notif, ...site.notifications].slice(0,300) });
    setEnvoyes(prev => ({ ...prev, [client.id]: true }));
  }

  const [envoiEnCours, setEnvoiEnCours] = useState(false);
  const [progressEnvoi, setProgressEnvoi] = useState(null);

  async function envoyerATous(){
    const texte = message.trim();
    if(!texte) return;
    const liste = destinatairesAvecTel.filter(c => !envoyes[c.id]);
    if(liste.length === 0) return;
    setEnvoiEnCours(true);
    setProgressEnvoi({ done: 0, total: liste.length });
    const notifsAAjouter = [];
    for(let i=0; i<liste.length; i++){
      const client = liste[i];
      const tel = client.tel.replace(/\D/g,'');
      window.open(`https://wa.me/${tel}?text=${encodeURIComponent(texte)}`, '_blank');
      notifsAAjouter.push({ id: uid('notif_'), clientId: client.id, message: texte, canal: 'WhatsApp', date: new Date().toISOString() });
      setEnvoyes(prev => ({ ...prev, [client.id]: true }));
      setProgressEnvoi({ done: i+1, total: liste.length });
      if(i < liste.length - 1) await new Promise(r => setTimeout(r, 1200));
    }
    updateSite({ ...site, notifications: [...notifsAAjouter, ...site.notifications].slice(0,300) });
    setEnvoiEnCours(false);
  }

  return (
    <div>
      <PageHeader title="Promos & Relances" subtitle="Envoyer un message WhatsApp pour une promotion, ou relancer les clients inactifs" />

      <div className="card" style={{padding:'1.5rem', marginBottom:20}}>
        <h3 style={{margin:'0 0 10px', fontSize:15}}>Générer un message de promo</h3>
        <div style={{display:'flex', gap:10, alignItems:'flex-end', flexWrap:'wrap', marginBottom:12}}>
          <div style={{maxWidth:140}}>
            <label>Réduction (%)</label>
            <input type="number" value={pourcentage} onChange={e=>setPourcentage(e.target.value)} min={0} max={100} />
          </div>
          <button className="btn btn-sm" onClick={genererMessage}>Générer le message</button>
        </div>

        <label>Message à envoyer</label>
        <textarea value={message} onChange={e=>setMessage(e.target.value)} rows={4}
          placeholder="🎉 Promo spéciale chez Maci Pressing ! -20% sur tous les nettoyages cette semaine. À bientôt !"
          style={{width:'100%', padding:'9px 12px', borderRadius:8, border:'1.5px solid var(--line)', fontFamily:'inherit', fontSize:14, resize:'vertical'}} />

        <label style={{marginTop:14}}>Destinataires</label>
        <div style={{display:'flex', gap:10, flexWrap:'wrap'}}>
          <button className="btn btn-sm" onClick={()=>setCible('dormants')}
            style={{background: cible==='dormants'?'var(--pine)':'transparent', color:cible==='dormants'?'var(--white)':'var(--ink)', borderColor:cible==='dormants'?'var(--pine)':'var(--line-strong)'}}>
            😴 Clients dormants ({clientsDormants.length})
          </button>
          <button className="btn btn-sm" onClick={()=>setCible('tous')}
            style={{background: cible==='tous'?'var(--pine)':'transparent', color:cible==='tous'?'var(--white)':'var(--ink)', borderColor:cible==='tous'?'var(--pine)':'var(--line-strong)'}}>
            👥 Tous les clients ({site.clients.length})
          </button>
          <button className="btn btn-sm" onClick={()=>setCible('selection')}
            style={{background: cible==='selection'?'var(--pine)':'transparent', color:cible==='selection'?'var(--white)':'var(--ink)', borderColor:cible==='selection'?'var(--pine)':'var(--line-strong)'}}>
            ✅ Choisir des clients ({selectionIds.length})
          </button>
        </div>

        {cible === 'selection' && (
          <div style={{marginTop:14, background:'var(--paper-2)', borderRadius:8, padding:'12px'}}>
            <input type="text" placeholder="Rechercher un client…" value={rechercheClient} onChange={e=>setRechercheClient(e.target.value)} style={{marginBottom:8}} />
            <div style={{display:'flex', gap:8, marginBottom:8}}>
              <button className="btn btn-ghost btn-sm" onClick={()=>setSelectionIds(clientsPourSelection.map(c=>c.id))}>Tout sélectionner</button>
              <button className="btn btn-ghost btn-sm" onClick={()=>setSelectionIds([])}>Tout désélectionner</button>
            </div>
            <div style={{maxHeight:220, overflowY:'auto'}}>
              {clientsPourSelection.map(cl => (
                <label key={cl.id} style={{display:'flex', alignItems:'center', gap:8, padding:'5px 0', fontSize:13.5, cursor:'pointer'}}>
                  <input type="checkbox" checked={selectionIds.includes(cl.id)} onChange={()=>toggleSelection(cl.id)} style={{width:'auto'}} />
                  <span>{cl.nom}</span>
                  <span style={{color:'var(--steam)', fontSize:12}}>{cl.tel || 'sans téléphone'}</span>
                </label>
              ))}
              {clientsPourSelection.length === 0 && <p style={{fontSize:13, color:'var(--steam)'}}>Aucun client trouvé.</p>}
            </div>
          </div>
        )}

        <p style={{fontSize:12, color:'var(--steam)', margin:'14px 0 0', lineHeight:1.5}}>
          « Clients dormants » = aucune commande depuis plus de 6 mois (ou jamais commandé). WhatsApp ne permet pas d'envoi automatique en masse — cliquez sur « Envoyer » pour chaque client ci-dessous, WhatsApp s'ouvre avec le message déjà prêt à envoyer.
        </p>
      </div>

      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10, marginBottom:14}}>
        <h2 style={{fontSize:16, color:'var(--pine)', margin:0}}>
          Destinataires ({destinatairesAvecTel.length} avec numéro sur {destinataires.length})
        </h2>
        {destinatairesAvecTel.length > 0 && (
          <button className="btn btn-rust btn-sm" disabled={!message.trim() || envoiEnCours} onClick={envoyerATous}>
            {envoiEnCours ? `Envoi… ${progressEnvoi.done}/${progressEnvoi.total}` : `🚀 Envoyer à tous (${destinatairesAvecTel.filter(c=>!envoyes[c.id]).length})`}
          </button>
        )}
      </div>
      {destinatairesAvecTel.length > 0 && (
        <p style={{fontSize:11.5, color:'var(--steam)', margin:'-8px 0 14px', lineHeight:1.5}}>
          ⚠️ Ce bouton ouvre chaque conversation WhatsApp l'une après l'autre, message déjà écrit. Il faudra quand même appuyer sur « Envoyer » dans chaque fenêtre WhatsApp (WhatsApp l'exige, aucune app ne peut l'automatiser). Si votre navigateur bloque les fenêtres après la première, autorisez les pop-ups pour ce site.
        </p>
      )}
      {destinatairesAvecTel.length === 0 ? (
        <div className="card" style={{padding:'2rem', textAlign:'center', color:'var(--steam)'}}>Aucun client avec numéro dans cette liste.</div>
      ) : (
        <div style={{display:'grid', gap:8}}>
          {destinatairesAvecTel.map(cl => (
            <div key={cl.id} className="card" style={{padding:'0.9rem 1.25rem', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10}}>
              <div>
                <div style={{fontWeight:600, fontSize:14}}>{cl.nom}</div>
                <div style={{fontSize:12.5, color:'var(--steam)'}}>{cl.tel}</div>
              </div>
              <button className="btn btn-sm"
                style={{background: envoyes[cl.id] ? 'var(--ok-light)' : '#25D366', color: envoyes[cl.id] ? 'var(--ok)' : 'white', borderColor: envoyes[cl.id] ? 'var(--ok)' : '#25D366'}}
                disabled={!message.trim()}
                onClick={()=>envoyerA(cl)}>
                {envoyes[cl.id] ? '✓ Envoyé' : '📱 Envoyer'}
              </button>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

function ClientsView({ site, updateSite, db }){
  const [search, setSearch] = useState('');
  const [selected, setSelected] = useState(null);
  const [showNew, setShowNew] = useState(false);
  const [editClient, setEditClient] = useState(null);
  const [confirmClient, setConfirmClient] = useState(null);

  const filtered = useMemo(() => {
    if(!search.trim()) return site.clients;
    const q = search.toLowerCase();
    return site.clients.filter(c => c.nom.toLowerCase().includes(q) || (c.tel||'').includes(q));
  }, [site.clients, search]);

  function clientStats(clientId){
    const cmds = site.commandes.filter(c => c.clientId === clientId);
    const total = cmds.reduce((s,c)=>s+calcCommandeTotal(c, site.services), 0);
    const impaye = cmds.filter(c=>c.paiement==='impaye').reduce((s,c)=>s+calcCommandeTotal(c, site.services), 0);
    return { count: cmds.length, total, impaye };
  }

  function saveEditClient(updated){
    updateSite({ ...site, clients: site.clients.map(c => c.id===updated.id ? updated : c) });
    setEditClient(null);
  }

  function removeClient(id){
    const client = site.clients.find(c => c.id===id);
    const entry = { id: uid('trash_'), type:'client', label: client ? `Client : ${client.nom}` : 'Client', data: client, dateSuppression: new Date().toISOString() };
    updateSite({ ...site, clients: site.clients.filter(c => c.id!==id), corbeille: [entry, ...(site.corbeille||[])] });
  }

  return (
    <div>
      <PageHeader title="Clients" subtitle={`${site.clients.length} fiche(s) client`}
        right={<button className="btn btn-rust" onClick={()=>setShowNew(true)}><Icon name="plus" size={15}/> Nouveau client</button>} />

      <div style={{position:'relative', maxWidth:320, marginBottom:18}}>
        <input type="text" placeholder="Rechercher…" value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:34}}/>
        <Icon name="search" size={15} style={{position:'absolute', left:11, top:11, color:'var(--steam)'}}/>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:14}}>
        {filtered.map(c => {
          const st = clientStats(c.id);
          return (
            <div key={c.id} className="card" style={{padding:'1.1rem 1.25rem'}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
                <div style={{cursor:'pointer', flex:1}} onClick={()=>setSelected(c)}>
                  <div style={{fontWeight:600, fontSize:15}}>{c.nom}</div>
                  <div style={{fontSize:12.5, color:'var(--steam)'}}>{c.tel || 'Pas de téléphone'}</div>
                </div>
                <div style={{display:'flex', gap:4}}>
                  {st.impaye > 0 && <span className="tag tag-impaye">{fmtGNF(st.impaye)}</span>}
                  <button className="btn btn-ghost btn-sm" style={{padding:'4px 7px'}} onClick={()=>setEditClient(c)} title="Modifier">
                    <Icon name="edit" size={13}/>
                  </button>
                  <button className="btn btn-ghost btn-sm" style={{padding:'4px 7px', color:'var(--danger)'}} onClick={()=>setConfirmClient(c)} title="Supprimer">
                    <Icon name="trash" size={13}/>
                  </button>
                </div>
              </div>
              <div style={{display:'flex', gap:14, marginTop:12, fontSize:12.5, color:'var(--steam)', cursor:'pointer'}} onClick={()=>setSelected(c)}>
                <span>{st.count} commande(s)</span>
                <span className="mono">{fmtGNF(st.total)} cumulé</span>
              </div>
            </div>
          );
        })}
        {filtered.length === 0 && <p style={{color:'var(--steam)'}}>Aucun client trouvé.</p>}
      </div>

      {showNew && <NewClientModal site={site} updateSite={updateSite} onClose={()=>setShowNew(false)} />}
      {selected && <ClientDetailModal client={selected} site={site} onClose={()=>setSelected(null)} onEdit={(c)=>{ setSelected(null); setEditClient(c); }} />}
      {editClient && <EditClientModal client={editClient} onSave={saveEditClient} onClose={()=>setEditClient(null)} />}
      {confirmClient && (() => {
        const st = clientStats(confirmClient.id);
        const avertissement = st.count > 0 ? ` Ce client a ${st.count} commande(s) enregistrée(s) — elles resteront dans l'historique mais afficheront « Client inconnu » à la place de son nom.` : '';
        return (
          <ConfirmDelete db={db}
            message={`Supprimer définitivement le client « ${confirmClient.nom} » ?${avertissement}`}
            onConfirm={()=>{ removeClient(confirmClient.id); setConfirmClient(null); }}
            onCancel={()=>setConfirmClient(null)}
          />
        );
      })()}
    </div>
  );
}

function NewClientModal({ site, updateSite, onClose }){
  const [nom, setNom] = useState('');
  const [indicatif, setIndicatif] = useState('+224');
  const [tel, setTel] = useState('');
  const [email, setEmail] = useState('');
  const [canalPref, setCanalPref] = useState('SMS');

  function submit(){
    if(!nom.trim()) return;
    const client = { id: uid('cli_'), nom: capitalizeNom(nom), tel: tel.trim() ? `${indicatif} ${tel.trim()}` : '', email: email.trim(), canalPref, dateInscription: todayISO() };
    updateSite({ ...site, clients: [...site.clients, client] });
    onClose();
  }

  return (
    <ModalShell title="Nouveau client" onClose={onClose} width={420}>
      <div style={{display:'grid', gap:14}}>
        <div><label>Nom complet</label><input type="text" value={nom} onChange={e=>setNom(e.target.value)} autoFocus/></div>
        <div>
          <label>Téléphone</label>
          <div style={{display:'flex', gap:8, alignItems:'center'}}>
            <CountryCodeSelect value={indicatif} onChange={setIndicatif} />
            <input type="tel" placeholder="6XX XX XX XX" value={tel} onChange={e=>setTel(e.target.value)} style={{flex:1}} />
          </div>
        </div>
        <div><label>Email (optionnel)</label><input type="email" value={email} onChange={e=>setEmail(e.target.value)} /></div>
        <div>
          <label>Canal de notification préféré</label>
          <select value={canalPref} onChange={e=>setCanalPref(e.target.value)}>
            <option value="SMS">SMS</option>
            <option value="Email">Email</option>
          </select>
        </div>
        <div style={{display:'flex', justifyContent:'flex-end', gap:10}}>
          <button className="btn" onClick={onClose}>Annuler</button>
          <button className="btn btn-rust" disabled={!nom.trim()} onClick={submit}>Créer</button>
        </div>
      </div>
    </ModalShell>
  );
}

function ClientDetailModal({ client, site, onClose, onEdit }){
  const cmds = site.commandes.filter(c => c.clientId === client.id).sort((a,b)=>new Date(b.dateCreation)-new Date(a.dateCreation));
  const total = cmds.reduce((s,c)=>s+calcCommandeTotal(c, site.services), 0);
  return (
    <ModalShell title={client.nom} onClose={onClose} width={560}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:18}}>
        <div style={{display:'flex', gap:20, fontSize:13.5, color:'var(--steam)', flexWrap:'wrap'}}>
          {client.tel && <span><Icon name="phone" size={13} style={{verticalAlign:-2, marginRight:4}}/>{client.tel}</span>}
          {client.email && <span><Icon name="mail" size={13} style={{verticalAlign:-2, marginRight:4}}/>{client.email}</span>}
          <span>Client depuis {fmtDate(client.dateInscription)}</span>
        </div>
        <button className="btn btn-sm" onClick={()=>onEdit(client)} style={{flexShrink:0, marginLeft:12}}>
          <Icon name="edit" size={13}/> Modifier
        </button>
      </div>
      <div style={{display:'flex', gap:14, marginBottom:18}}>
        <StatMini label="Commandes" value={cmds.length} />
        <StatMini label="Total dépensé" value={fmtGNF(total)} />
      </div>
      <h3 style={{fontSize:14, margin:'0 0 10px'}}>Historique</h3>
      <div style={{maxHeight:280, overflowY:'auto'}}>
        {cmds.length === 0 && <p style={{fontSize:13, color:'var(--steam)'}}>Aucune commande pour ce client.</p>}
        {cmds.map(c => (
          <div key={c.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 0', borderBottom:'1px solid var(--line)', fontSize:13}}>
            <div>
              <span className="mono" style={{fontWeight:600}}>{c.numero}</span>
              <span style={{color:'var(--steam)', marginLeft:8}}>{fmtDate(c.dateCreation.slice(0,10))}</span>
            </div>
            <div style={{display:'flex', gap:8, alignItems:'center'}}>
              <span className={`tag ${STATUT_TAG_CLASS[c.statut]}`}>{c.statut}</span>
              <span className="mono">{fmtGNF(calcCommandeTotal(c, site.services))}</span>
            </div>
          </div>
        ))}
      </div>
    </ModalShell>
  );
}

function EditClientModal({ client, onSave, onClose }){
  const parsedTel = splitTel(client.tel);
  const [nom, setNom] = useState(client.nom || '');
  const [indicatif, setIndicatif] = useState(parsedTel.indicatif);
  const [tel, setTel] = useState(parsedTel.numero);
  const [email, setEmail] = useState(client.email || '');
  const [canalPref, setCanalPref] = useState(client.canalPref || 'SMS');

  function submit(){
    if(!nom.trim()) return;

    const item = site.stock.find(s => s.id === id);

const CATEGORIES_DEPENSES = ['Salaires', 'Électricité', 'Loyer', 'Fournitures', 'Autres'];
const CATEGORIES_DEPENSES_AFFICHAGE = ['Salaires', 'Électricité', 'Loyer', 'Paiement repasseur', 'Livraison', 'Fournitures', 'Autres'];

// Résout la catégorie réellement affichée pour une dépense — corrige l'étiquette des anciennes
// dépenses de repassage encore enregistrées sous 'Livraison' ou 'Prestations' (avant la séparation
// Paiement/Livraison), en retrouvant le type réel via la prestation liée (remunerations).
function categorieAffichee(d, remunerations){
  if(d.categorie === 'Prestations' || d.categorie === 'Livraison'){
    if(d.autoPrestationId){
      const rem = (remunerations||[]).find(r => r.id === d.autoPrestationId);
      if(rem && rem.type === 'repassage') return 'Paiement repasseur';
    }
    return 'Livraison';
  }
  return d.categorie;
}

function DepensesView({ site, updateSite, db, employeId }){
  const [showNew, setShowNew] = useState(false);
  const [showPrestation, setShowPrestation] = useState(false);
  const [typePeriode, setTypePeriode] = useState('jour'); // 'jour' | 'semaine' | 'mois' | 'annee'
  const [filterJour, setFilterJour] = useState(todayISO());
  const [filterMois, setFilterMois] = useState(todayISO().slice(0,7));
  const [filterAnnee, setFilterAnnee] = useState(todayISO().slice(0,4));
  const [confirmDep, setConfirmDep] = useState(null);
  const [editDep, setEditDep] = useState(null);
  const [triColonne, setTriColonne] = useState('date');
  const [triSens, setTriSens] = useState('desc'); // 'asc' | 'desc'
  const [filtreCategorie, setFiltreCategorie] = useState('toutes');
  const [moisOuvertDepenses, setMoisOuvertDepenses] = useState(null);
  const [filtreMode, setFiltreMode] = useState('tous');
  const [filtreSaisiPar, setFiltreSaisiPar] = useState('tous');

  const depenses = (site.depenses || []);
  const remunerations = (site.remunerations || []);

  const getWeekDates = (jourReference) => {
    const d = new Date(jourReference + 'T00:00:00');
    const day = d.getDay() || 7;
    const monday = new Date(d); monday.setDate(d.getDate() - day + 1);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    const toISO = (dt) => dt.toISOString().slice(0,10);
    return { start: toISO(monday), end: toISO(sunday) };
  };
  const semaineActuelle = getWeekDates(filterJour);

  function estDansPeriode(dateStr){
    const d = (dateStr||'').slice(0,10);
    if(typePeriode === 'jour') return d === filterJour;
    if(typePeriode === 'semaine') return d >= semaineActuelle.start && d <= semaineActuelle.end;
    if(typePeriode === 'mois') return d.slice(0,7) === filterMois;
    return d.slice(0,4) === filterAnnee;
  }

  const filtered = useMemo(() => {
    return [...depenses].filter(d => estDansPeriode(d.date) && (!employeId || d.saisiPar === employeId)).sort((a,b) => new Date(b.date) - new Date(a.date));
  }, [depenses, typePeriode, filterJour, filterMois, filterAnnee, employeId]);

  // Repassages/livraisons enregistrés AVANT la création automatique de dépenses (données historiques),
  // à inclure quand même dans la charge réelle de l'entreprise pour ne rien sous-estimer
  const remunerationsOrphelines = useMemo(() => {
    const idsAvecDepense = new Set(depenses.filter(d=>d.autoPrestationId).map(d=>d.autoPrestationId));
    return remunerations.filter(r => (r.type==='repassage' || r.type==='livraison') && !idsAvecDepense.has(r.id) && estDansPeriode(r.date) && (!employeId || r.employeId === employeId));
  }, [remunerations, depenses, typePeriode, filterJour, filterMois, filterAnnee, employeId]);
  const totalOrphelines = remunerationsOrphelines.reduce((s,r)=>s+Number(r.montant),0);

  // Dépenses entreprise saisies manuellement par chaque employé dans Détail mensuel (mois avant septembre 2026),
  // à inclure comme lignes individuelles ici pour ne pas les laisser invisibles dans Dépenses
  const depensesEntrepriseHistoriques = useMemo(() => {
    const liste = [];
    const manuel = site.detailMensuelManuel || {};
    Object.entries(manuel).forEach(([anneeStr, moisData]) => {
      const anneeNum = Number(anneeStr);
      Object.entries(moisData||{}).forEach(([moisStr, valeurMois]) => {
        const moisNum = Number(moisStr);
        const avantSeuil = anneeNum < 2026 || (anneeNum === 2026 && moisNum < 9);
        if(!avantSeuil) return;
        const parEmploye = normaliserMoisManuel(valeurMois) || {};
        Object.entries(parEmploye).forEach(([empId, v]) => {
          const montantDep = Number(v.depenses)||0;
          if(montantDep <= 0 || empId === '_legacy') return;
          if(employeId && empId !== employeId) return;
          const emp = site.employes.find(e => e.id === empId);
          const dernierJour = new Date(anneeNum, moisNum, 0).getDate();
          const dateEntree = `${anneeNum}-${String(moisNum).padStart(2,'0')}-${String(dernierJour).padStart(2,'0')}`;
          if(!estDansPeriode(dateEntree)) return;
          liste.push({
            id: `dm_ent_${anneeNum}_${moisNum}_${empId}`,
            date: dateEntree,
            description: `Dépenses entreprise — ${emp ? emp.nom : 'Employé supprimé'} (${new Date(anneeNum, moisNum-1, 1).toLocaleDateString('fr-FR',{month:'long', year:'numeric'})})`,
            montant: montantDep,
            saisiPar: empId,
          });
        });
      });
    });
    return liste;
  }, [site.detailMensuelManuel, site.employes, typePeriode, filterJour, filterMois, filterAnnee, employeId]);
  const totalDepensesEntrepriseHistoriques = depensesEntrepriseHistoriques.reduce((s,d)=>s+d.montant,0);

  const totalMois = filtered.reduce((s,d) => s + Number(d.montant), 0) + totalOrphelines + totalDepensesEntrepriseHistoriques;

  const parCategorie = useMemo(() => {
    const acc = {};
    filtered.forEach(d => {
      acc[categorieAffichee(d, remunerations)] = (acc[categorieAffichee(d, remunerations)]||0) + Number(d.montant);
    });
    remunerationsOrphelines.forEach(r => {
      const cat = r.type === 'repassage' ? 'Paiement repasseur' : 'Livraison';
      acc[cat] = (acc[cat]||0) + Number(r.montant);
    });
    if(totalDepensesEntrepriseHistoriques > 0) acc['Autres'] = (acc['Autres']||0) + totalDepensesEntrepriseHistoriques;
    return acc;
  }, [filtered, remunerationsOrphelines, remunerations, totalDepensesEntrepriseHistoriques]);

  const parMode = useMemo(() => {
    const acc = {};
    filtered.forEach(d => {
      const mode = d.modePaiement || 'Espèces';
      acc[mode] = (acc[mode]||0) + Number(d.montant);
    });
    return acc;
  }, [filtered]);

  function removeDepense(id){
    const dep = depenses.find(d=>d.id===id);
    const entry = { id: uid('trash_'), type:'depense', label: dep ? `Dépense : ${dep.description}` : 'Dépense', data: dep, dateSuppression: new Date().toISOString() };
    updateSite({ ...site, depenses: depenses.filter(d=>d.id!==id), corbeille: [entry, ...(site.corbeille||[])] });
  }

  function saveEditDepense(updated){
    updateSite({ ...site, depenses: depenses.map(d => d.id===updated.id ? updated : d) });
    setEditDep(null);
  }

  // Listes disponibles pour chaque type de période
  const moisDisponibles = useMemo(() => {
    const mois = new Set(depenses.map(d=>d.date.slice(0,7)));
    mois.add(todayISO().slice(0,7));
    return [...mois].sort().reverse();
  }, [depenses]);

  const anneesDisponibles = useMemo(() => {
    const annees = new Set(depenses.map(d=>d.date.slice(0,4)));
    const currentYear = Number(todayISO().slice(0,4));
    for(let y = currentYear; y >= ANNEE_DEBUT_APP - 10; y--) annees.add(String(y));
    return [...annees].sort().reverse();
  }, [depenses]);

  const labelPeriode = typePeriode === 'jour' ? fmtDate(filterJour)
    : typePeriode === 'semaine' ? `semaine du ${fmtDate(semaineActuelle.start)} au ${fmtDate(semaineActuelle.end)}`
    : typePeriode === 'annee' ? filterAnnee
    : formatMoisAnnee(filterMois);

  return (
    <div>
      <PageHeader title="Dépenses" subtitle={`Total ${labelPeriode} : ${fmtGNF(totalMois)}`}
        right={
          <div style={{display:'flex', gap:8}}>
            <button className="btn btn-sm" onClick={()=>setShowPrestation(true)}><Icon name="shirt" size={15}/> Livraison (par zone)</button>
            <button className="btn btn-rust" onClick={()=>setShowNew(true)}><Icon name="plus" size={15}/> Nouvelle dépense</button>
          </div>
        } />

      {employeId && (
        <p style={{fontSize:12.5, color:'var(--steam)', margin:'-8px 0 14px'}}>Vous ne voyez que les dépenses que vous avez vous-même saisies — pas celles des autres employés ni du gérant.</p>
      )}

      {/* Filtre par période */}
      <div style={{display:'flex', gap:10, marginBottom:18, alignItems:'center', flexWrap:'wrap'}}>
        {[{key:'jour', label:'Jour'}, {key:'semaine', label:'Semaine'}, {key:'mois', label:'Mois'}, {key:'annee', label:'Année'}].map(opt => (
          <button key={opt.key} className="btn btn-sm" onClick={()=>setTypePeriode(opt.key)}
            style={{background: typePeriode===opt.key ? 'var(--pine)' : 'transparent', color: typePeriode===opt.key ? 'var(--white)' : 'var(--ink)', borderColor: typePeriode===opt.key ? 'var(--pine)' : 'var(--line-strong)'}}>
            {opt.label}
          </button>
        ))}
        {typePeriode === 'jour' && (
          <input type="date" value={filterJour} onChange={e=>setFilterJour(e.target.value)} style={{width:'auto'}} />
        )}
        {typePeriode === 'semaine' && (
          <div style={{display:'flex', alignItems:'center', gap:8}}>
            <input type="date" value={filterJour} onChange={e=>setFilterJour(e.target.value)} style={{width:'auto'}} />
            <span style={{fontSize:12.5, color:'var(--steam)'}}>Semaine du {fmtDate(semaineActuelle.start)} au {fmtDate(semaineActuelle.end)}</span>
          </div>
        )}
        {typePeriode === 'mois' && (
          <select value={filterMois} onChange={e=>setFilterMois(e.target.value)} style={{width:'auto', minWidth:160}}>
            {moisDisponibles.map(m => (
              <option key={m} value={m}>{new Date(m + '-15T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</option>
            ))}
          </select>
        )}
        {typePeriode === 'annee' && (
          <select value={filterAnnee} onChange={e=>setFilterAnnee(e.target.value)} style={{width:'auto', minWidth:120}}>
            {anneesDisponibles.map(a => <option key={a} value={a}>{a}</option>)}
          </select>
        )}
      </div>

      {/* Total dépenses (cumul de toutes les catégories) */}
      {(filtered.length > 0 || totalOrphelines > 0 || totalDepensesEntrepriseHistoriques > 0) && (
        <div style={{marginBottom:14}}>
          <StatCard label={`Total dépenses — ${labelPeriode}`} value={fmtGNF(CATEGORIES_DEPENSES_AFFICHAGE.reduce((s,cat)=>s+(parCategorie[cat]||0),0))} icon="euro" tone="danger" />
          {totalOrphelines > 0 && (
            <p style={{fontSize:11.5, color:'var(--steam)', margin:'4px 0 0'}}>Inclut {fmtGNF(totalOrphelines)} de repassage/livraison historique (enregistré avant la création automatique de dépenses).</p>
          )}
          {totalDepensesEntrepriseHistoriques > 0 && (
            <p style={{fontSize:11.5, color:'var(--steam)', margin:'4px 0 0'}}>Inclut {fmtGNF(totalDepensesEntrepriseHistoriques)} de dépenses entreprise saisies dans Détail mensuel (mois antérieurs à septembre 2026), classées sous « Autres ».</p>
          )}
        </div>
      )}

      {/* Résumé par catégorie */}
      {filtered.length > 0 && (
        <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(110px, 1fr))', gap:10, marginBottom:14}}>
          {CATEGORIES_DEPENSES_AFFICHAGE.map(cat => (
            <div key={cat} className="card" style={{padding:'0.9rem 1rem'}}>
              <div style={{fontSize:11.5, color:'var(--steam)', fontWeight:600, textTransform:'uppercase'}}>{cat}</div>
              <div className="mono" style={{fontSize:15, fontWeight:700, color:'var(--pine)', marginTop:4}}>{fmtGNF(parCategorie[cat]||0)}</div>
            </div>
          ))}
        </div>
      )}

      {/* Résumé par mode de paiement */}
      {filtered.length > 0 && (
        <div style={{display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:10, marginBottom:20}}>
          {['Espèces','Orange Money'].map(mode => (
            <div key={mode} className="card" style={{padding:'0.9rem 1rem'}}>
              <div style={{fontSize:11.5, color:'var(--steam)', fontWeight:600, textTransform:'uppercase'}}>{mode}</div>
              <div className="mono" style={{fontSize:15, fontWeight:700, color:'var(--rust)', marginTop:4}}>{fmtGNF(parMode[mode]||0)}</div>
            </div>
          ))}
        </div>
      )}

      {/* Liste des dépenses */}
      {(() => {
        function statutConfirmation(rem){
          if(!rem) return null;
          if(rem.type === 'livraison') return null;
          if(rem.statutPaiement !== 'paye') return { label: 'Non payé', color: 'var(--steam)', bg: 'var(--paper-2)' };
          return rem.valideParRepasseur
            ? { label: '✓ Confirmé', color: 'var(--pine)', bg: 'var(--pine-light)' }
            : { label: 'Non confirmé', color: 'var(--warn)', bg: 'var(--warn-light)' };
        }

        const lignesBrutes = [
          ...filtered.map(d => {
            const remLiee = d.autoPrestationId ? remunerations.find(r => r.id === d.autoPrestationId) : null;
            return {
              id: d.id, date: d.date, description: d.description,
              categorie: categorieAffichee(d, remunerations), mode: d.modePaiement || 'Espèces',
              saisiParNom: d.saisiPar ? ((site.employes.find(e=>e.id===d.saisiPar)||{}).nom || 'Employé supprimé') : 'Gérant',
              montant: Number(d.montant), original: d, isOrphan: false,
              confirmation: statutConfirmation(remLiee), remLieeId: remLiee ? remLiee.id : null,
            };
          }),
          ...remunerationsOrphelines.map(r => {
            const empNom = (site.employes.find(e=>e.id===r.employeId)||{}).nom || 'Employé';
            const description = r.commandeId
              ? `Prestation ${r.type === 'repassage' ? 'repassage' : 'livraison'} — ${r.clientNom} (#${r.ticketSuffix}) — ${empNom}`
              : `Prestation ${r.type === 'repassage' ? 'repassage' : 'livraison'} — ${empNom}`;
            return {
              id: r.id, date: r.date, description,
              categorie: r.type === 'repassage' ? 'Paiement repasseur' : 'Livraison', mode: r.modePaiementRepasseur || 'Espèces',
              saisiParNom: '—', montant: Number(r.montant), original: r, isOrphan: true,
              confirmation: statutConfirmation(r), remLieeId: r.id,
            };
          }),
          ...depensesEntrepriseHistoriques.map(d => ({
            id: d.id, date: d.date, description: d.description,
            categorie: 'Autres', mode: 'Espèces',
            saisiParNom: (site.employes.find(e=>e.id===d.saisiPar)||{}).nom || 'Employé supprimé',
            montant: d.montant, original: d, isOrphan: true,
            confirmation: null, remLieeId: null,
          })),
        ];
        const categoriesDispo = [...new Set(lignesBrutes.map(l=>l.categorie))].sort();
        const saisiParDispo = [...new Set(lignesBrutes.map(l=>l.saisiParNom))].sort();
        const lignesFiltrees = lignesBrutes.filter(l =>
          (filtreCategorie === 'toutes' || l.categorie === filtreCategorie) &&
          (filtreMode === 'tous' || l.mode === filtreMode) &&
          (filtreSaisiPar === 'tous' || l.saisiParNom === filtreSaisiPar)
        );

        // Regroupe les Salaires (même jour + même mode) et les Paiements de repassage
        // (même jour + même repasseur + même mode) en une seule ligne avec le montant total
        function extraireNomRepasseur(description){
          const parts = description.split(' — ');
          return parts.length > 1 ? parts[parts.length-1].trim() : description;
        }
        const groupes = {};
        const nonGroupees = [];
        lignesFiltrees.forEach(l => {
          if(l.categorie === 'Salaires'){
            const key = `sal|${l.date.slice(0,10)}|${l.mode}`;
            if(!groupes[key]) groupes[key] = { ...l, id: key, description: '', montant: 0, count: 0, isGrouped: true, isOrphan: true };
            groupes[key].montant += l.montant;
            groupes[key].count += 1;
          } else if(l.categorie === 'Paiement repasseur'){
            const nomRepasseur = extraireNomRepasseur(l.description);
            const key = `pai|${l.date.slice(0,10)}|${nomRepasseur}|${l.mode}`;
            if(!groupes[key]) groupes[key] = { ...l, id: key, description: '', nomRepasseur, montant: 0, count: 0, confirmesCount: 0, isGrouped: true, isOrphan: true };
            groupes[key].montant += l.montant;
            groupes[key].count += 1;
            if(l.confirmation && l.confirmation.label.includes('Confirmé')) groupes[key].confirmesCount += 1;
          } else {
            nonGroupees.push(l);
          }
        });
        Object.values(groupes).forEach(g => {
          if(g.nomRepasseur){
            g.description = `Paiements repassage — ${g.nomRepasseur} (${g.count} paiement${g.count>1?'s':''} du jour)`;
            g.confirmation = { label: `${g.confirmesCount}/${g.count} confirmé(s)`, color: g.confirmesCount===g.count ? 'var(--pine)' : 'var(--warn)', bg: g.confirmesCount===g.count ? 'var(--pine-light)' : 'var(--warn-light)' };
          } else {
            g.description = `Salaires du jour (${g.count} versement${g.count>1?'s':''})`;
            g.confirmation = null;
          }
        });
        const lignesGroupees = [...nonGroupees, ...Object.values(groupes)];

        const collator = new Intl.Collator('fr');
        const lignesTableau = [...lignesGroupees].sort((a,b) => {
          let cmp = 0;
          if(triColonne === 'date') cmp = new Date(a.date) - new Date(b.date);
          else if(triColonne === 'montant') cmp = a.montant - b.montant;
          else cmp = collator.compare(String(a[triColonne]||''), String(b[triColonne]||''));
          return triSens === 'asc' ? cmp : -cmp;
        });
        function trierPar(col){
          if(triColonne === col) setTriSens(s => s === 'asc' ? 'desc' : 'asc');
          else { setTriColonne(col); setTriSens(col==='date' ? 'desc' : 'asc'); }
        }
        const flecheTri = (col) => triColonne === col ? (triSens === 'asc' ? ' ▲' : ' ▼') : '';
        const thTriable = (col, label) => (
          <th style={{...th, cursor:'pointer', userSelect:'none'}} onClick={()=>trierPar(col)}>{label}{flecheTri(col)}</th>
        );

        // Regroupe les lignes par mois — un clic sur le mois révèle le détail de ses dépenses
        const moisGroupesMap = {};
        lignesTableau.forEach(l => {
          const moisKey = (l.date||'').slice(0,7);
          if(!moisGroupesMap[moisKey]) moisGroupesMap[moisKey] = { moisKey, lignes: [], total: 0 };
          moisGroupesMap[moisKey].lignes.push(l);
          moisGroupesMap[moisKey].total += l.montant;
        });
        const moisGroupes = Object.values(moisGroupesMap).sort((a,b) => b.moisKey.localeCompare(a.moisKey));
        const EXPORT_HEADERS = ['Date','Description', ...CATEGORIES_DEPENSES_AFFICHAGE, 'Saisi par','Confirmation','Espèces','Orange Money','Montant'];
        const exportRows = lignesTableau.map(l => [
          fmtDate(l.date), l.description,
          ...CATEGORIES_DEPENSES_AFFICHAGE.map(cat => cat === l.categorie ? Math.round(l.montant) : ''),
          l.saisiParNom, l.confirmation ? l.confirmation.label.replace('✓ ','') : '',
          l.mode === 'Orange Money' ? Math.round(l.montant) : '', l.mode !== 'Orange Money' ? Math.round(l.montant) : '',
          Math.round(l.montant)
        ]);

        return (
        <>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10, marginBottom:10}}>
          <div style={{display:'flex', gap:8, flexWrap:'wrap', alignItems:'center'}}>
            <select value={filtreCategorie} onChange={e=>setFiltreCategorie(e.target.value)} style={{width:'auto', fontSize:12.5, padding:'6px 8px'}}>
              <option value="toutes">Toutes catégories</option>
              {categoriesDispo.map(c => <option key={c} value={c}>{c}</option>)}
            </select>
            <select value={filtreMode} onChange={e=>setFiltreMode(e.target.value)} style={{width:'auto', fontSize:12.5, padding:'6px 8px'}}>
              <option value="tous">Tous modes</option>
              <option value="Espèces">Espèces</option>
              <option value="Orange Money">Orange Money</option>
            </select>
            <select value={filtreSaisiPar} onChange={e=>setFiltreSaisiPar(e.target.value)} style={{width:'auto', fontSize:12.5, padding:'6px 8px'}}>
              <option value="tous">Tous — saisi par</option>
              {saisiParDispo.map(n => <option key={n} value={n}>{n}</option>)}
            </select>
            {(filtreCategorie!=='toutes'||filtreMode!=='tous'||filtreSaisiPar!=='tous') && (
              <button className="btn btn-ghost btn-sm" onClick={()=>{ setFiltreCategorie('toutes'); setFiltreMode('tous'); setFiltreSaisiPar('tous'); }}>✕ Réinitialiser</button>
            )}
          </div>
          <ExportButtons
            onCSV={()=>exportTableToCSV(`depenses-${labelPeriode}`, EXPORT_HEADERS, exportRows)}
            onPDF={()=>exportTableToPDF({ filename:`depenses-${labelPeriode}`, title:'Dépenses', subtitle:`Maci Pressing — ${labelPeriode}`, headers:EXPORT_HEADERS, rows:exportRows })}
          />
        </div>
        <div className="card" style={{overflow:'auto'}}>
        <table style={{width:'100%', borderCollapse:'collapse', fontSize:13}}>
          <thead>
            <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
              {thTriable('date', 'Date')}
              {thTriable('description', 'Description')}
              {CATEGORIES_DEPENSES_AFFICHAGE.map(cat => <th key={cat} style={{...th, whiteSpace:'nowrap'}}>{cat}</th>)}
              {thTriable('saisiParNom', 'Saisi par')}
              <th style={th}>Confirmation</th>
              <th style={th}>Espèces</th>
              <th style={th}>Orange Money</th>
              {thTriable('montant', 'Total')}
              <th style={th}></th>
            </tr>
          </thead>
          <tbody>
            {lignesTableau.length === 0 && (
              <tr><td colSpan={7+CATEGORIES_DEPENSES_AFFICHAGE.length} style={{...td, textAlign:'center', color:'var(--steam)', padding:'2rem'}}>Aucune dépense enregistrée pour ce mois.</td></tr>
            )}
            {moisGroupes.map(g => {
              const estOuvert = moisOuvertDepenses === g.moisKey;
              return (
                <React.Fragment key={g.moisKey}>
                  <tr style={{borderTop:'2px solid var(--line-strong)', background:'var(--paper-2)', cursor:'pointer'}} onClick={()=>setMoisOuvertDepenses(estOuvert ? null : g.moisKey)}>
                    <td colSpan={2} style={{...td, fontWeight:700}}>
                      <span style={{marginRight:6}}>{estOuvert ? '▾' : '▸'}</span>
                      {formatMoisAnnee(g.moisKey)} <span style={{fontWeight:400, color:'var(--steam)', fontSize:12.5}}>({g.lignes.length} dépense{g.lignes.length>1?'s':''})</span>
                    </td>
                    {CATEGORIES_DEPENSES_AFFICHAGE.map(cat => (
                      <td key={cat} style={{...td, fontWeight:700}} className="mono">{fmtGNF(g.lignes.filter(l=>l.categorie===cat).reduce((s,l)=>s+l.montant,0))}</td>
                    ))}
                    <td colSpan={2}></td>
                    <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(g.lignes.filter(l=>l.mode!=='Orange Money').reduce((s,l)=>s+l.montant,0))}</td>
                    <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(g.lignes.filter(l=>l.mode==='Orange Money').reduce((s,l)=>s+l.montant,0))}</td>
                    <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(g.total)}</td>
                    <td></td>
                  </tr>
                  {estOuvert && g.lignes.map(l => (
                    <tr key={l.id} style={{borderTop:'1px solid var(--line)', background:'var(--paper)'}}>
                      <td style={{...td, whiteSpace:'nowrap', paddingLeft:28}}>{fmtDate(l.date)}</td>
                      <td style={td}>
                        {l.description}
                        {l.isOrphan && !l.isGrouped && <span className="tag" style={{marginLeft:6, fontSize:9.5, background:'var(--warn-light)', color:'var(--warn)'}}>Historique</span>}
                        {l.isGrouped && <span className="tag" style={{marginLeft:6, fontSize:9.5, background:'var(--pine-light)', color:'var(--pine)'}}>Groupé</span>}
                      </td>
                      {CATEGORIES_DEPENSES_AFFICHAGE.map(cat => (
                        <td key={cat} style={{...td, color: cat===l.categorie ? 'var(--danger)' : 'var(--line)', fontWeight: cat===l.categorie ? 600 : 400}} className="mono">
                          {cat === l.categorie ? fmtGNF(l.montant) : '—'}
                        </td>
                      ))}
                      <td style={{...td, color:'var(--steam)'}}>{l.saisiParNom}</td>
                      <td style={td}>
                        {l.confirmation && (
                          <span className="tag" style={{background:l.confirmation.bg, color:l.confirmation.color}}>{l.confirmation.label}</span>
                        )}
                      </td>
                      <td style={{...td, color: l.mode!=='Orange Money' ? 'var(--pine)' : 'var(--line)'}} className="mono">{l.mode!=='Orange Money' ? fmtGNF(l.montant) : '—'}</td>
                      <td style={{...td, color: l.mode==='Orange Money' ? 'var(--pine)' : 'var(--line)'}} className="mono">{l.mode==='Orange Money' ? fmtGNF(l.montant) : '—'}</td>
                      <td style={{...td, color:'var(--danger)', fontWeight:600}} className="mono">{fmtGNF(l.montant)}</td>
                      <td style={{...td, textAlign:'right'}}>
                        {!l.isOrphan && (
                          <div style={{display:'flex', gap:6, justifyContent:'flex-end'}} onClick={e=>e.stopPropagation()}>
                            <button className="btn btn-ghost btn-sm" style={{color:'var(--pine)'}} onClick={()=>setEditDep({...l.original, categorie: categorieAffichee(l.original, remunerations)})}>
                              <Icon name="edit" size={14}/>
                            </button>
                            <button className="btn btn-ghost btn-sm" style={{color:'var(--danger)'}} onClick={()=>setConfirmDep(l.original)}>
                              <Icon name="trash" size={14}/>
                            </button>
                          </div>
                        )}
                      </td>
                    </tr>
                  ))}
                </React.Fragment>
              );
            })}
            {lignesTableau.length > 0 && (
              <tr style={{borderTop:'2px solid var(--line-strong)', background:'var(--paper-2)'}}>
                <td colSpan={2} style={{...td, fontWeight:700}}>Total {(filtreCategorie!=='toutes'||filtreMode!=='tous'||filtreSaisiPar!=='tous') ? '(filtré)' : labelPeriode}</td>
                {CATEGORIES_DEPENSES_AFFICHAGE.map(cat => (
                  <td key={cat} style={{...td, fontWeight:700}} className="mono">{fmtGNF(lignesTableau.filter(l=>l.categorie===cat).reduce((s,l)=>s+l.montant,0))}</td>
                ))}
                <td colSpan={2}></td>
                <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(lignesTableau.filter(l=>l.mode!=='Orange Money').reduce((s,l)=>s+l.montant,0))}</td>
                <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(lignesTableau.filter(l=>l.mode==='Orange Money').reduce((s,l)=>s+l.montant,0))}</td>
                <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(lignesTableau.reduce((s,l)=>s+l.montant,0))}</td>
                <td></td>
              </tr>
            )}
          </tbody>
        </table>
        </div>
        </>
        );
      })()}

      {showNew && <NewDepenseModal site={site} updateSite={updateSite} onClose={()=>setShowNew(false)} employeId={employeId} />}
      {showPrestation && <NewPrestationModal site={site} updateSite={updateSite} onClose={()=>setShowPrestation(false)} caissierId={employeId} />}
      {confirmDep && <ConfirmDelete db={db} message={`Supprimer la dépense « ${confirmDep.description} » (${fmtGNF(confirmDep.montant)}) ?`}
        onConfirm={()=>{ removeDepense(confirmDep.id); setConfirmDep(null); }}
        onCancel={()=>setConfirmDep(null)} />}
      {editDep && (
        <ModalShell title="Modifier la dépense" onClose={()=>setEditDep(null)} width={420}>
          <div style={{display:'grid', gap:14}}>
            <div><label>Date</label><input type="date" value={editDep.date} onChange={e=>setEditDep({...editDep, date:e.target.value})} /></div>
            <div>
              <label>Catégorie</label>
              <select value={editDep.categorie} onChange={e=>setEditDep({...editDep, categorie:e.target.value})}>
                {CATEGORIES_DEPENSES_AFFICHAGE.map(c => <option key={c}>{c}</option>)}
              </select>
            </div>
            <div><label>Description</label><input type="text" value={editDep.description} onChange={e=>setEditDep({...editDep, description:e.target.value})} /></div>
            <div><label>Montant (GNF)</label><input type="number" value={editDep.montant} onChange={e=>setEditDep({...editDep, montant:Number(e.target.value)})} /></div>
            <div>
              <label>Mode de paiement</label>
              <select value={editDep.modePaiement||'Espèces'} onChange={e=>setEditDep({...editDep, modePaiement:e.target.value})}>
                <option>Espèces</option>
                <option>Orange Money</option>
              </select>
            </div>
            <div style={{display:'flex', justifyContent:'flex-end', gap:10}}>
              <button className="btn" onClick={()=>setEditDep(null)}>Annuler</button>
              <button className="btn btn-rust" onClick={()=>saveEditDepense(editDep)} disabled={!editDep.description||!editDep.montant}>Enregistrer</button>
            </div>
          </div>
        </ModalShell>
      )}
    </div>
  );
}

function NewPrestationModal({ site, updateSite, onClose, caissierId }){
  const [type, setType] = useState('livraison');
  const [date, setDate] = useState(todayISO());
  const [employeId, setEmployeId] = useState('');
  const [selectedArticles, setSelectedArticles] = useState([]);
  const [zoneId, setZoneId] = useState('');
  const [modePaiementLivraison, setModePaiementLivraison] = useState('Espèces');

  const config = site.configRemuneration || { tarifsRepassage: [], zones: [] };
  const tarifsRepassage = config.tarifsRepassage || [];
  const remunerations = site.remunerations || [];

  function addArticle(tarifId){
    setSelectedArticles(prev => {
      const exist = prev.find(a=>a.tarifId===tarifId);
      if(exist) return prev.map(a=>a.tarifId===tarifId ? {...a, qte:a.qte+1} : a);
      return [...prev, {tarifId, qte:1}];
    });
  }
  function setArticleQte(tarifId, qte){
    setSelectedArticles(prev => prev.map(a=>a.tarifId===tarifId ? {...a, qte:Math.max(0,qte)} : a).filter(a=>a.qte>0));
  }

  const montantRepassage = selectedArticles.reduce((s,a) => {
    const tarif = tarifsRepassage.find(t=>t.id===a.tarifId);
    return s + (tarif ? tarif.prix * a.qte : 0);
  }, 0);

  function calculerMontant(){
    if(type === 'repassage') return montantRepassage;
    const zone = config.zones?.find(z=>z.id===zoneId);
    return zone ? Number(zone.montant) : 0;
  }
  const montantPreview = calculerMontant();

  function enregistrer(){
    const montant = calculerMontant();
    if(montant <= 0 || !date || !employeId) return;
    const zone = type === 'livraison' ? config.zones?.find(z=>z.id===zoneId) : null;
    const detailRepassage = selectedArticles.map(a => {
      const t = tarifsRepassage.find(t=>t.id===a.tarifId);
      return t ? `${a.qte}x ${t.nom} (${fmtGNF(t.prix)})` : '';
    }).filter(Boolean).join(', ');

    const rem = {
      id: uid('rem_'),
      date,
      type,
      montant,
      detail: type === 'repassage' ? detailRepassage : `Livraison — ${zone?.nom || ''}`,
      employeId,
      statutPaiement: type === 'livraison' ? 'paye' : undefined,
      modePaiementRepasseur: type === 'livraison' ? modePaiementLivraison : undefined,
      datePaiement: type === 'livraison' ? new Date().toISOString() : undefined,
    };
    const empNom = (site.employes.find(e=>e.id===employeId)||{}).nom || 'Employé';
    const dep = {
      id: uid('dep_'),
      date,
      description: `Prestation ${type === 'repassage' ? 'repassage' : 'livraison'} — ${empNom} (${rem.detail})`,
      montant,
      categorie: type === 'repassage' ? 'Paiement repasseur' : 'Livraison',
      modePaiement: type === 'livraison' ? modePaiementLivraison : 'Espèces',
      autoPrestationId: rem.id,
      saisiPar: caissierId || null,
    };
    updateSite({ ...site, remunerations: [rem, ...remunerations], depenses: [dep, ...(site.depenses||[])] });
    onClose();
  }

  return (
    <ModalShell title="Livraison (par zone)" onClose={onClose} width={480}>
      <div style={{display:'grid', gap:14}}>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
          <div>
            <label>Date</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} max={todayISO()} />
          </div>
          <div>
            <label>Employé</label>
            <select value={employeId} onChange={e=>setEmployeId(e.target.value)}>
              <option value="">Choisir un employé…</option>
              {site.employes.map(e => <option key={e.id} value={e.id}>{e.nom}</option>)}
            </select>
          </div>
        </div>

        {type === 'repassage' ? (
          <div>
            <label>Articles repassés</label>
            {tarifsRepassage.length > 0 ? (
              <>
                <div style={{display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:6, marginBottom:8}}>
                  {tarifsRepassage.map(t => (
                    <button key={t.id} className="btn btn-sm"
                      style={{justifyContent:'space-between', display:'flex', background: selectedArticles.find(a=>a.tarifId===t.id) ? 'var(--pine-light)' : 'transparent', borderColor: selectedArticles.find(a=>a.tarifId===t.id) ? 'var(--pine)' : 'var(--line-strong)'}}
                      onClick={()=>addArticle(t.id)}>
                      <span>{t.nom}</span><span className="mono" style={{color:'var(--steam)'}}>{fmtGNF(t.prix)}</span>
                    </button>
                  ))}
                </div>
                {selectedArticles.length > 0 && (
                  <div style={{background:'var(--paper-2)', borderRadius:8, padding:'10px 12px'}}>
                    {selectedArticles.map(a => {
                      const t = tarifsRepassage.find(x=>x.id===a.tarifId);
                      if(!t) return null;
                      return (
                        <div key={a.tarifId} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'4px 0'}}>
                          <span style={{fontSize:13}}>{t.nom}</span>
                          <div style={{display:'flex', alignItems:'center', gap:6}}>
                            <button className="btn btn-sm" style={{padding:'1px 7px'}} onClick={()=>setArticleQte(a.tarifId, a.qte-1)}>−</button>
                            <span className="mono" style={{fontSize:13}}>{a.qte}</span>
                            <button className="btn btn-sm" style={{padding:'1px 7px'}} onClick={()=>setArticleQte(a.tarifId, a.qte+1)}>+</button>
                            <span className="mono" style={{fontSize:12, color:'var(--pine)', minWidth:70, textAlign:'right'}}>{fmtGNF(t.prix*a.qte)}</span>
                          </div>
                        </div>
                      );
                    })}
                  </div>
                )}
              </>
            ) : (
              <div style={{padding:'9px 12px', background:'var(--warn-light)', borderRadius:8, fontSize:13, color:'var(--warn)'}}>
                ⚠️ Configure d'abord les tarifs de repassage dans Paramètres.
              </div>
            )}
          </div>
        ) : (
          <div>
            <label>Zone de livraison</label>
            {config.zones?.length > 0 ? (
              <select value={zoneId} onChange={e=>setZoneId(e.target.value)}>
                <option value="">Choisir une zone…</option>
                {config.zones.map(z => (
                  <option key={z.id} value={z.id}>{z.nom} — {fmtGNF(z.montant)}</option>
                ))}
              </select>
            ) : (
              <div style={{padding:'9px 12px', background:'var(--warn-light)', borderRadius:8, fontSize:13, color:'var(--warn)'}}>
                ⚠️ Configure d'abord les zones de livraison dans Paramètres.
              </div>
            )}
            <div style={{marginTop:12}}>
              <label>Payé par</label>
              <div style={{display:'flex', gap:8}}>
                <button type="button" className="btn btn-sm" onClick={()=>setModePaiementLivraison('Espèces')}
                  style={{background: modePaiementLivraison==='Espèces'?'var(--pine)':'transparent', color: modePaiementLivraison==='Espèces'?'var(--white)':'var(--ink)', borderColor: modePaiementLivraison==='Espèces'?'var(--pine)':'var(--line-strong)'}}>
                  Espèces
                </button>
                <button type="button" className="btn btn-sm" onClick={()=>setModePaiementLivraison('Orange Money')}
                  style={{background: modePaiementLivraison==='Orange Money'?'var(--pine)':'transparent', color: modePaiementLivraison==='Orange Money'?'var(--white)':'var(--ink)', borderColor: modePaiementLivraison==='Orange Money'?'var(--pine)':'var(--line-strong)'}}>
                  Orange Money
                </button>
              </div>
            </div>
          </div>
        )}

        {montantPreview > 0 && (
          <div style={{fontSize:13, color:'var(--pine)', fontWeight:600}}>
            💰 Total : {fmtGNF(montantPreview)}
          </div>
        )}
        <button className="btn btn-rust" style={{width:'100%'}}
          disabled={montantPreview <= 0 || !employeId}
          onClick={enregistrer}>
          Enregistrer
        </button>
      </div>
    </ModalShell>
  );
}

function NewDepenseModal({ site, updateSite, onClose, employeId }){
  const [date, setDate] = useState(todayISO());
  const [description, setDescription] = useState('');
  const [montant, setMontant] = useState('');
  const [categorie, setCategorie] = useState('Salaires');
  const [modePaiement, setModePaiement] = useState('Espèces');

  function submit(){
    if(!description.trim() || !montant || !date) return;
    const dep = {
      id: uid('dep_'),
      date,
      description: description.trim(),
      montant: Number(montant),
      categorie,
      modePaiement,
      saisiPar: employeId || null,
    };
    updateSite({ ...site, depenses: [dep, ...(site.depenses||[])] });
    onClose();
  }

  return (
    <ModalShell title="Nouvelle dépense" onClose={onClose} width={420}>
      <div style={{display:'grid', gap:14}}>
        <div><label>Date</label><input type="date" value={date} onChange={e=>setDate(e.target.value)} max={todayISO()} /></div>
        <div>
          <label>Catégorie</label>
          <select value={categorie} onChange={e=>setCategorie(e.target.value)}>
            {CATEGORIES_DEPENSES.map(c => <option key={c}>{c}</option>)}
          </select>
        </div>
        <div><label>Description</label><input type="text" placeholder="Ex : Salaire Mamadou Alpha, Facture électricité…" value={description} onChange={e=>setDescription(e.target.value)} autoFocus/></div>
        <div><label>Montant (GNF)</label><input type="number" placeholder="0" value={montant} onChange={e=>setMontant(e.target.value)} /></div>
        <div>
          <label>Mode de paiement</label>
          <select value={modePaiement} onChange={e=>setModePaiement(e.target.value)}>
            <option>Espèces</option>
            <option>Orange Money</option>
          </select>
        </div>
        <div style={{display:'flex', justifyContent:'flex-end', gap:10}}>
          <button className="btn" onClick={onClose}>Annuler</button>
          <button className="btn btn-rust" disabled={!description.trim()||!montant||!date} onClick={submit}>Enregistrer</button>
        </div>
      </div>
    </ModalShell>
  );
}
