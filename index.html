          </div>
          {sourceSiteId && (
            <div style={{marginTop:12}}>
              <div style={{fontSize:12, color:'var(--pine)', fontWeight:600, marginBottom:6}}>Services qui seront copiés :</div>
              <div style={{display:'flex', flexWrap:'wrap', gap:6, marginBottom:10}}>
                {db.sites.find(s=>s.id===sourceSiteId)?.services.map(svc => (
                  <span key={svc.id} style={{fontSize:12, background:'var(--white)', padding:'3px 10px', borderRadius:100, border:'1px solid var(--pine)'}}>
                    {svc.nom} — {fmtGNF(svc.prix)}

              </div>
              {(() => {
                const srcConfig = db.sites.find(s=>s.id===sourceSiteId)?.configRemuneration;
                const tarifs = srcConfig?.tarifsRepassage || [];
                const zones = srcConfig?.zones || [];
                if(tarifs.length === 0 && zones.length === 0) return null;
                return (
                  <div>

                        <div style={{fontSize:12, color:'var(--pine)', fontWeight:600, marginBottom:6}}>👔 Tarifs repassage :</div>

                          {tarifs.map(t => (
                            <span key={t.id} style={{fontSize:12, background:'var(--white)', padding:'3px 10px', borderRadius:100, border:'1px solid var(--pine)'}}>

                      <>
                        <div style={{fontSize:12, color:'var(--pine)', fontWeight:600, marginBottom:6}}>🚗 Zones de livraison :</div>
                        <div style={{display:'flex', flexWrap:'wrap', gap:6}}>

                            <span key={z.id} style={{fontSize:12, background:'var(--white)', padding:'3px 10px', borderRadius:100, border:'1px solid var(--pine)'}}>

      <div style={{display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:14}}>
        {db.sites.map(s => (
          <div key={s.id} className="card" style={{padding:'1.25rem 1.4rem'}}>

              <div>

              </div>
              <span className="mono" style={{fontSize:11, color:'var(--steam)'}}>{s.code}</span>
            </div>
            <div style={{fontSize:12, color:'var(--steam)', marginTop:8}}>{s.services.length} service(s) · {s.clients.length} client(s)</div>

      {(db.corbeilleSites||[]).length > 0 && (
        <div className="card" style={{padding:'1.25rem', marginTop:18, borderColor:'var(--danger)'}}>
          <h3 style={{margin:'0 0 10px', fontSize:15, color:'var(--danger)', display:'flex', alignItems:'center', gap:8}}>
            <Icon name="trash" size={15}/> Pressings supprimés — conservés 30 jours
          </h3>
          <div style={{display:'grid', gap:8}}>
            {db.corbeilleSites.map(entry => {
              const joursRestants = Math.max(0, 30 - Math.floor((Date.now() - new Date(entry.dateSuppression).getTime())/(24*60*60*1000)));
              return (
                <div key={entry.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 0', borderBottom:'1px solid var(--line)', flexWrap:'wrap', gap:8}}>
                  <div>
                    <div style={{fontWeight:600, fontSize:13.5}}>{entry.label}</div>
                    <div style={{fontSize:11.5, color:'var(--steam)'}}>Supprimé le {fmtDateTime(entry.dateSuppression)} · {joursRestants} jour(s) restant(s)</div>
                  </div>
                  <div style={{display:'flex', gap:6}}>
                    <button className="btn btn-sm" onClick={()=>setDb({ ...db, sites: [...db.sites, entry.data], corbeilleSites: db.corbeilleSites.filter(e=>e.id!==entry.id) })}>↩️ Restaurer</button>
                    <button className="btn btn-ghost btn-sm" style={{color:'var(--danger)'}} onClick={()=>setDb({ ...db, corbeilleSites: db.corbeilleSites.filter(e=>e.id!==entry.id) })}>Supprimer définitivement</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {showNew && <NewSiteModal onClose={()=>setShowNew(false)} onCreate={(nom,adresse,tel)=>{ addSite(nom,adresse,tel); setShowNew(false); }} />}

        message={`Supprimer définitivement « ${confirmSite.nom} » et TOUTES ses données (commandes, clients, stock) ? Cette action est irréversible.`}
        onConfirm={()=>{ removeSite(confirmSite.id); setConfirmSite(null); }}
        onCancel={()=>setConfirmSite(null)}
      />}
    </div>
  );
}

/* ===================== CORBEILLE PAR SITE ===================== */

const CORBEILLE_TYPE_LABELS = {
  commande: '🎫 Commande',
  commandes_reset: '🗓️ Réinitialisation de commandes',
  depenses_reset: '🗓️ Réinitialisation de dépenses',
  remunerations_reset: '🗓️ Réinitialisation de rémunérations',
  stock: '📦 Article de stock',
  service: '🧺 Service',
  employe: '👤 Employé',
  client: '🧾 Client',
  depense: '💸 Dépense',
};

function CorbeilleView({ site, updateSite }){
  const corbeille = site.corbeille || [];
  const sorted = [...corbeille].sort((a,b)=>new Date(b.dateSuppression)-new Date(a.dateSuppression));

  function daysLeft(dateSuppression){
    const elapsed = Date.now() - new Date(dateSuppression).getTime();
    return Math.max(0, 30 - Math.floor(elapsed / (24*60*60*1000)));
  }

  function restore(entry){
    let nextSite = { ...site, corbeille: corbeille.filter(e=>e.id!==entry.id) };
    if(!entry.data){ updateSite(nextSite); return; }
    if(entry.type === 'commande'){
      nextSite.commandes = [entry.data, ...nextSite.commandes];
    } else if(entry.type === 'commandes_reset' && Array.isArray(entry.data)){
      nextSite.commandes = [...entry.data, ...nextSite.commandes];
    } else if(entry.type === 'depenses_reset' && Array.isArray(entry.data)){
      nextSite.depenses = [...entry.data, ...(nextSite.depenses||[])];
    } else if(entry.type === 'remunerations_reset' && Array.isArray(entry.data)){
      nextSite.remunerations = [...entry.data, ...(nextSite.remunerations||[])];
    } else if(entry.type === 'stock'){
      nextSite.stock = [...nextSite.stock, entry.data];
    } else if(entry.type === 'service'){
      nextSite.services = [...nextSite.services, entry.data];
    } else if(entry.type === 'employe'){
      nextSite.employes = [...nextSite.employes, entry.data];
    } else if(entry.type === 'client'){
      nextSite.clients = [...nextSite.clients, entry.data];
    } else if(entry.type === 'depense'){
      nextSite.depenses = [entry.data, ...nextSite.depenses];
    }
    updateSite(nextSite);
  }

  function purgeOne(entryId){
    updateSite({ ...site, corbeille: corbeille.filter(e=>e.id!==entryId) });
  }

  return (
    <div>
      <PageHeader title="Corbeille" subtitle="Éléments supprimés — conservés 30 jours avant suppression définitive automatique" />
      {sorted.length === 0 ? (
        <div className="card" style={{padding:'2rem', textAlign:'center', color:'var(--steam)'}}>La corbeille est vide.</div>
      ) : (
        <div style={{display:'grid', gap:10}}>
          {sorted.map(entry => (
            <div key={entry.id} className="card" style={{padding:'1rem 1.25rem', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10}}>
              <div>
                <div style={{fontWeight:600, fontSize:14}}>{CORBEILLE_TYPE_LABELS[entry.type] || entry.type} — {entry.label}</div>
                <div style={{fontSize:12, color:'var(--steam)', marginTop:2}}>
                  Supprimé le {fmtDateTime(entry.dateSuppression)} · <strong>{daysLeft(entry.dateSuppression)} jour(s)</strong> restant(s) avant suppression définitive
                </div>
              </div>
              <div style={{display:'flex', gap:8}}>
                <button className="btn btn-sm" onClick={()=>restore(entry)}>↩️ Restaurer</button>
                <button className="btn btn-ghost btn-sm" style={{color:'var(--danger)'}} onClick={()=>purgeOne(entry.id)}>Supprimer définitivement</button>
              </div>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

/* ===================== AGENDA DU JOUR ===================== */

function AgendaView({ site }){
  const today = todayISO();

  const items = (site.commandes||[])
    .filter(c => c.statut !== 'Récupéré' && c.dateRdvRecuperation && c.dateRdvRecuperation <= today)
    .sort((a,b) => {
      const da = new Date(a.dateRdvRecuperation + 'T' + (a.heureRdvRecuperation || '00:00'));
      const db = new Date(b.dateRdvRecuperation + 'T' + (b.heureRdvRecuperation || '00:00'));
      return da - db;
    });

  function urgencyLevel(cmd){
    const dt = new Date(cmd.dateRdvRecuperation + 'T' + (cmd.heureRdvRecuperation ? cmd.heureRdvRecuperation+':00' : '23:59:00'));
    const diffHours = (dt.getTime() - Date.now()) / 3600000;
    if(diffHours < 0) return 'depasse';
    if(cmd.statut !== 'Prêt' && diffHours <= 8) return 'critique';
    if(diffHours <= 24) return 'urgent';
    return 'normal';
  }

  const BADGE = {
    depasse:  { style:{background:'var(--danger)', color:'var(--white)'}, label:'⏰ En retard' },
    critique: { style:{background:'var(--danger-light)', color:'var(--danger)'}, label:'🔥 Très urgent' },
    urgent:   { style:{background:'var(--warn-light)', color:'var(--warn)'}, label:'⚠️ Urgent' },
    normal:   { style:{background:'var(--pine-light)', color:'var(--pine)'}, label:"🕐 Aujourd'hui" },
  };

  return (
    <div>
      <PageHeader title="Agenda du jour" subtitle={`${items.length} commande(s) à traiter en priorité — triées par rendez-vous de récupération`} />
      {items.length === 0 ? (
        <div className="card" style={{padding:'2rem', textAlign:'center', color:'var(--steam)'}}>
          Aucun rendez-vous de récupération aujourd'hui ou en retard. 👍
        </div>
      ) : (
        <div style={{display:'grid', gap:10}}>
          {items.map(cmd => {
            const client = site.clients.find(c=>c.id===cmd.clientId);
            const niveau = urgencyLevel(cmd);
            const badge = BADGE[niveau];
            return (
              <div key={cmd.id} className="card" style={{padding:'1rem 1.25rem', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10}}>
                <div>
                  <div style={{display:'flex', alignItems:'center', gap:8, flexWrap:'wrap'}}>
                    <span className="mono" style={{fontWeight:700}}>{cmd.numero}</span>
                    <span style={{fontWeight:600, color:'var(--pine)'}}>{client ? client.nom : 'Client inconnu'}</span>
                    {cmd.express && <span className="tag" style={{background:'var(--rust-light)', color:'var(--rust)'}}>⚡ Express</span>}
                    <span className={`tag ${STATUT_TAG_CLASS[cmd.statut]}`}>{cmd.statut}</span>
                  </div>
                  <div style={{fontSize:12.5, color:'var(--steam)', marginTop:4}}>
                    RDV : {fmtDate(cmd.dateRdvRecuperation)}{cmd.heureRdvRecuperation ? ` à ${cmd.heureRdvRecuperation}` : ''}
                    {cmd.lignes && ` · ${cmd.lignes.reduce((s,l)=>s+l.qte,0)} article(s)`}
                  </div>
                </div>
                <span className="tag" style={badge.style}>{badge.label}</span>
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

function Dashboard({ site, updateSite }){
  const today = todayISO();
  const stats = useMemo(() => {
    const cmds = site.commandes;
    const cmdsToday = cmds.filter(c => c.dateCreation.slice(0,10) === today);
    const cmdsMonth = cmds.filter(c => c.dateCreation.slice(0,7) === today.slice(0,7));
    const caJour = cmdsToday.reduce((s,c)=>s+calcCommandeTotal(c, site.services),0);
    const caMois = cmdsMonth.reduce((s,c)=>s+calcCommandeTotal(c, site.services),0);
    const impayes = cmds.filter(c => c.paiement === 'impaye');
    const montantImpaye = impayes.reduce((s,c)=>s+calcCommandeTotal(c, site.services),0);
    const enCours = cmds.filter(c => c.statut === 'En cours' || c.statut === 'Reçu').length;
    const pretsNonRecuperes = cmds.filter(c => c.statut === 'Prêt').length;

    const serviceCount = {};
    cmds.forEach(c => c.lignes.forEach(l => { serviceCount[l.serviceId] = (serviceCount[l.serviceId]||0) + l.qte; }));
    const topServices = Object.entries(serviceCount)
      .map(([id, qte]) => ({ svc: site.services.find(s=>s.id===id), qte }))
      .filter(x=>x.svc).sort((a,b)=>b.qte-a.qte).slice(0,5);

    const last7 = Array.from({length:7}, (_,i)=>{
      const d = new Date(); d.setDate(d.getDate()-(6-i));
      const iso = d.toISOString().slice(0,10);
      const ca = cmds.filter(c=>c.dateCreation.slice(0,10)===iso).reduce((s,c)=>s+calcCommandeTotal(c,site.services),0);
      return { iso, ca, label: d.toLocaleDateString('fr-FR',{weekday:'short'}) };
    });
    const maxCa = Math.max(...last7.map(d=>d.ca), 1);

    const depenses = (site.depenses||[]);
    const depensesJour = depenses.filter(d=>d.date===today).reduce((s,d)=>s+Number(d.montant),0);
    const depensesMois = depenses.filter(d=>d.date.slice(0,7)===today.slice(0,7)).reduce((s,d)=>s+Number(d.montant),0);
    const beneficeMois = caMois - depensesMois;

    return { caJour, caMois, montantImpaye, impayesCount: impayes.length, enCours, pretsNonRecuperes, topServices, last7, maxCa, totalClients: site.clients.length, depensesJour, depensesMois, beneficeMois };
  }, [site, today]);

  const lowStock = site.stock.filter(s => s.quantite <= s.seuil);

  return (
    <div>
      <PageHeader title={site.nom} subtitle={`Aujourd'hui, ${fmtDate(today)}`} />

      <div style={{display:'grid', gridTemplateColumns:'repeat(4, 1fr)', gap:14, marginBottom:14}}>
        <StatCard label="CA aujourd'hui" value={fmtGNF(stats.caJour)} icon="euro" />
        <StatCard label="CA ce mois" value={fmtGNF(stats.caMois)} icon="chart" />
        <StatCard label="Impayés" value={fmtGNF(stats.montantImpaye)} sub={`${stats.impayesCount} commande(s)`} icon="alert" tone={stats.impayesCount>0 ? 'danger':'default'} />
        <StatCard label="Clients" value={stats.totalClients} icon="users" />
      </div>
      <div style={{display:'grid', gridTemplateColumns:'repeat(3, 1fr)', gap:14, marginBottom:24}}>
        <StatCard label="Dépenses aujourd'hui" value={fmtGNF(stats.depensesJour)} icon="trash" tone="danger" />
        <StatCard label="Dépenses ce mois" value={fmtGNF(stats.depensesMois)} icon="trash" tone="danger" />
        <StatCard label="Bénéfice net ce mois" value={fmtGNF(stats.beneficeMois)} icon="chart" tone={stats.beneficeMois>=0?'default':'danger'} sub="CA − Dépenses" />
      </div>

      <div style={{display:'grid', gridTemplateColumns:'1.4fr 1fr', gap:16, marginBottom:24}}>
        <div className="card" style={{padding:'1.5rem'}}>
          <h3 style={{margin:'0 0 16px', fontSize:15}}>Chiffre d'affaires — 7 derniers jours</h3>
          <div style={{display:'flex', alignItems:'flex-end', gap:10, height:140}}>
            {stats.last7.map(d => (
              <div key={d.iso} style={{flex:1, display:'flex', flexDirection:'column', alignItems:'center', gap:6}}>
                <div style={{fontSize:10.5, color:'var(--steam)'}} className="mono">{d.ca>0 ? Math.round(d.ca/1000)+'k' : ''}</div>
                <div style={{
                  width:'100%', background:'var(--rust)', borderRadius:'4px 4px 0 0',
                  height: Math.max(4, (d.ca/stats.maxCa)*90), opacity: d.iso===today?1:0.55
                }}/>
                <div style={{fontSize:11.5, color:'var(--pine)', textTransform:'capitalize'}}>{d.label}</div>
              </div>
            ))}
          </div>
        </div>

        <div className="card" style={{padding:'1.5rem'}}>
          <h3 style={{margin:'0 0 16px', fontSize:15}}>Services les plus demandés</h3>
          {stats.topServices.length === 0 && <p style={{fontSize:13, color:'var(--steam)'}}>Pas encore de données.</p>}
          {stats.topServices.map((t,i) => (
            <div key={t.svc.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'7px 0', borderBottom: i<stats.topServices.length-1 ? '1px solid var(--line)' : 'none'}}>
              <span style={{fontSize:13.5}}>{t.svc.nom}</span>
              <span className="mono" style={{fontSize:13, color:'var(--steam)'}}>{t.qte}x</span>
            </div>
          ))}
        </div>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:16}}>
        <div className="card" style={{padding:'1.5rem'}}>
          <h3 style={{margin:'0 0 12px', fontSize:15}}>À traiter</h3>
          <div style={{display:'flex', gap:16}}>
            <div>
              <div style={{fontSize:22, fontWeight:700, color:'var(--rust)'}}>{stats.enCours}</div>
              <div style={{fontSize:12.5, color:'var(--steam)'}}>en cours / reçues</div>
            </div>
            <div>
              <div style={{fontSize:22, fontWeight:700, color:'var(--ok)'}}>{stats.pretsNonRecuperes}</div>
              <div style={{fontSize:12.5, color:'var(--steam)'}}>prêtes, à récupérer</div>
            </div>
          </div>
        </div>

        <div className="card" style={{padding:'1.5rem'}}>
          <h3 style={{margin:'0 0 12px', fontSize:15, display:'flex', alignItems:'center', gap:8}}>
            <Icon name="alert" size={15} style={{color: lowStock.length ? 'var(--danger)':'var(--steam)'}}/> Stock à surveiller
          </h3>
          {lowStock.length === 0 && <p style={{fontSize:13, color:'var(--steam)'}}>Tous les stocks sont au-dessus du seuil.</p>}
          {lowStock.map(s => (
            <div key={s.id} style={{display:'flex', justifyContent:'space-between', fontSize:13.5, padding:'5px 0'}}>
              <span>{s.nom}</span>
              <span className="mono" style={{color:'var(--danger)'}}>{s.quantite} {s.unite}</span>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

function StatCard({ label, value, sub, icon, tone='default' }){
  const toneColor = tone === 'danger' ? 'var(--danger)' : 'var(--pine)';
  return (
    <div className="card" style={{padding:'1.1rem 1.25rem'}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start'}}>
        <div>
          <div style={{fontSize:12, color:'var(--steam)', textTransform:'uppercase', letterSpacing:'0.04em', fontWeight:600}}>{label}</div>
          <div style={{fontSize:22, fontWeight:700, color:toneColor, marginTop:4}}>{value}</div>
          {sub && <div style={{fontSize:12, color:'var(--steam)', marginTop:2}}>{sub}</div>}
        </div>
        <Icon name={icon} size={18} style={{color:'var(--steam)', marginTop:2}} />
      </div>
    </div>
  );
}

/* ===================== COMMANDES ===================== */

function SortableTh({ label, field, sortBy, sortDir, onSort }){
  const active = sortBy === field;
  return (
    <button onClick={()=>onSort(field)} style={{background:'none', border:'none', padding:0, cursor:'pointer', font:'inherit', fontWeight:'inherit', color: active ? 'var(--rust)' : 'inherit', display:'flex', alignItems:'center', gap:4}}>
      {label} {active && (sortDir==='asc' ? '▲' : '▼')}
    </button>
  );
}

function CommandesView({ site, updateSite, editable, employeId, db }){
  const [filter, setFilter] = useState('Toutes');
  const [search, setSearch] = useState('');
  const [showNew, setShowNew] = useState(false);
  const [openTicket, setOpenTicket] = useState(null);
  const [editCmd, setEditCmd] = useState(null);
  const [confirmDeleteCmd, setConfirmDeleteCmd] = useState(null);
  const [encaisserCmd, setEncaisserCmd] = useState(null);
  const [showNewClient, setShowNewClient] = useState(false);
  const [sortBy, setSortBy] = useState(null); // 'ticket'|'client'|'total'|'statut'|'paiement'|'depot'|'rdv'
  const [sortDir, setSortDir] = useState('asc');

  function toggleSort(field){
    if(sortBy === field) setSortDir(d => d === 'asc' ? 'desc' : 'asc');
    else { setSortBy(field); setSortDir('asc'); }
  }

  function isRdvUrgent(cmd){
    if(!cmd.dateRdvRecuperation || cmd.statut === 'Récupéré') return false;
    const dt = new Date(cmd.dateRdvRecuperation + 'T' + (cmd.heureRdvRecuperation ? cmd.heureRdvRecuperation + ':00' : '23:59:00'));
    const diffHours = (dt.getTime() - Date.now()) / 3600000;
    return diffHours <= 24;
  }

  function isRdvCritical(cmd){
    if(!cmd.dateRdvRecuperation || cmd.statut === 'Récupéré' || cmd.statut === 'Prêt') return false;
    const dt = new Date(cmd.dateRdvRecuperation + 'T' + (cmd.heureRdvRecuperation ? cmd.heureRdvRecuperation + ':00' : '23:59:00'));
    const diffHours = (dt.getTime() - Date.now()) / 3600000;
    return diffHours <= 8;
  }

  const monProfil = employeId ? site.employes.find(e=>e.id===employeId) : null;
  const isRepasseur = monProfil && monProfil.role === 'Repasseur';
  const isCaissier = !monProfil || monProfil.role !== 'Repasseur'; // gérant ou caissier

  function deleteCommande(id){
    const cmd = site.commandes.find(c=>c.id===id);
    const entry = { id: uid('trash_'), type:'commande', label: cmd ? `Commande ${cmd.numero}` : 'Commande', data: cmd, dateSuppression: new Date().toISOString() };
    updateSite({ ...site, commandes: site.commandes.filter(c=>c.id!==id), corbeille: [entry, ...(site.corbeille||[])] });
  }

  const filtered = useMemo(() => {
    let list = [...site.commandes].sort((a,b)=> new Date(b.dateCreation) - new Date(a.dateCreation));
    if(filter !== 'Toutes') list = list.filter(c => c.statut === filter);
    if(search.trim()){
      const q = search.toLowerCase();
      list = list.filter(c => {
        const client = site.clients.find(cl => cl.id === c.clientId);
        return c.numero.toLowerCase().includes(q) || (client && client.nom.toLowerCase().includes(q)) || (client && client.tel && client.tel.toLowerCase().includes(q));
      });
    }
    if(sortBy){
      const dir = sortDir === 'asc' ? 1 : -1;
      list = [...list].sort((a,b) => {
        if(sortBy === 'rdv'){
          const aHas = !!a.dateRdvRecuperation, bHas = !!b.dateRdvRecuperation;
          if(aHas !== bHas) return aHas ? -1 : 1;
          if(!aHas && !bHas) return 0;
          const va = new Date(a.dateRdvRecuperation + 'T' + (a.heureRdvRecuperation||'00:00')).getTime();
          const vb = new Date(b.dateRdvRecuperation + 'T' + (b.heureRdvRecuperation||'00:00')).getTime();
          return dir * (va - vb);
        }
        const getVal = (c) => {
          switch(sortBy){
            case 'ticket': return c.numero;
            case 'client': {
              const cl = site.clients.find(cl2 => cl2.id === c.clientId);
              return cl ? cl.nom.toLowerCase() : '';
            }
            case 'articles': return c.lignes.reduce((s,l)=>s+l.qte,0);
            case 'total': return calcCommandeTotal(c, site.services);
            case 'statut': return STATUTS.indexOf(c.statut);
            case 'paiement': return c.paiement === 'paye' ? 2 : (Number(c.acompte)>0 ? 1 : 0);
            case 'depot': return new Date(c.dateCreation).getTime();
            case 'employe': {
              const e = site.employes.find(emp => emp.id === c.caissierEmpId);
              return e ? e.nom.toLowerCase() : '';
            }
            default: return 0;
          }
        };
        const va = getVal(a), vb = getVal(b);
        if(va < vb) return -1*dir;
        if(va > vb) return 1*dir;
        return 0;
      });
    }
    return list;
  }, [site.commandes, site.clients, filter, search, sortBy, sortDir]);

  function updateCommande(updated){
    updateSite({ ...site, commandes: site.commandes.map(c => c.id === updated.id ? updated : c) });
  }

  function advanceStatut(cmd){
    const updated = { ...cmd, statut: nextStatut(cmd.statut) };
    const client = site.clients.find(c => c.id === cmd.clientId);
    const total = calcCommandeTotal(cmd, site.services);
    const acompte = Number(cmd.acompte) || 0;
    const solde = total - acompte;
    const nextSite = { ...site, commandes: site.commandes.map(c => c.id === updated.id ? updated : c) };

    // CALCUL AUTOMATIQUE REPASSEUR quand statut -> Prêt
    if(updated.statut === 'Prêt'){
      const config = site.configRemuneration || {};
      const tarifsRepassage = config.tarifsRepassage || [];
      if(tarifsRepassage.length > 0){
        const articlesRepasses = [];
        cmd.lignes.forEach(l => {
          const svc = site.services.find(s=>s.id===l.serviceId);
          if(!svc) return;
          const tarif = tarifsRepassage.find(t =>
            svc.nom.toLowerCase().includes(t.nom.toLowerCase()) ||
            t.nom.toLowerCase().includes(svc.nom.toLowerCase())
          );
          if(tarif) articlesRepasses.push({ nom: tarif.nom, prix: tarif.prix, qte: l.qte });
        });
        if(articlesRepasses.length > 0){
          const montantRepasseur = articlesRepasses.reduce((s,a)=>s+(a.prix*a.qte),0);
          const detailRepasseur = articlesRepasses.map(a=>`${a.qte}x ${a.nom} (${fmtGNF(a.prix)})`).join(', ');
          const clientNomRem = client ? client.nom : 'Client inconnu';
          const ticketSuffixRem = cmd.numero.slice(-4);
          const rem = {
            id: uid('rem_'),
            date: todayISO(),
            type: 'repassage',
            montant: montantRepasseur,
            detail: detailRepasseur,
            commandeId: cmd.id,
            commandeNumero: cmd.numero,
            clientNom: clientNomRem,
            ticketSuffix: ticketSuffixRem,
            employeId: employeId || null,
            auto: true,
          };
          const empNomRem = (site.employes.find(e=>e.id===employeId)||{}).nom || 'Employé';
          const depRem = {
            id: uid('dep_'),
            date: rem.date,
            description: `Prestation repassage — ${clientNomRem} (#${ticketSuffixRem}) — ${empNomRem}`,
            montant: montantRepasseur,
            categorie: 'Paiement repasseur',
            modePaiement: 'Espèces',
            autoPrestationId: rem.id,
            saisiPar: employeId || null,
          };
          nextSite.remunerations = [rem, ...(nextSite.remunerations||[])];
          nextSite.depenses = [depRem, ...(nextSite.depenses||[])];
        }
      }
    }

    if(client){
      let msg = '';
      if(updated.statut === 'Récupéré'){
        const lignesDetail = cmd.lignes.map(l => {
          const svc = site.services.find(s=>s.id===l.serviceId);
          return svc ? `${l.qte}x ${svc.nom}` : '';
        }).filter(Boolean).join(', ');
        msg = `✅ Reçu — ${site.nom}\nCommande : ${cmd.numero}\nArticles : ${lignesDetail}${cmd.rabais>0?`\nRabais : -${fmtGNF(cmd.rabais)}`:''}${acompte>0?`\nAcompte versé : ${fmtGNF(acompte)}`:''}\nTotal payé : ${fmtGNF(total - (solde > 0 ? solde : 0))}\n${solde > 0 ? `⚠️ Reste dû : ${fmtGNF(solde)}` : '✔️ Compte soldé'}\nMerci pour votre confiance !`;
      }
      if(msg){
        const notif = { id: uid('notif_'), clientId: client.id, message: msg, canal: client.canalPref || 'SMS', date: new Date().toISOString() };
        nextSite.notifications = [notif, ...nextSite.notifications].slice(0,300);
        if(client.tel && updated.statut === 'Récupéré'){
          const tel = client.tel.replace(/\D/g,'');
          setTimeout(() => window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msg)}`, '_blank'), 300);
        }
      }
    }
    updateSite(nextSite);
  }
  function togglePaiement(cmd){
    updateCommande({ ...cmd, paiement: cmd.paiement === 'paye' ? 'impaye' : 'paye' });
  }
  function enregistrerPaiement(cmd, montant, mode){
    const total = calcCommandeTotal(cmd, site.services);
    const nouvelAcompte = Math.min((Number(cmd.acompte)||0) + Number(montant), total);
    const nouveauPaiement = { id: uid('pmt_'), montant: Number(montant), mode, date: new Date().toISOString(), employeId: employeId || null };
    const updated = { ...cmd, acompte: nouvelAcompte, paiement: nouvelAcompte >= total ? 'paye' : 'impaye', modePaiement: mode, paiements: [...(cmd.paiements||[]), nouveauPaiement] };
    updateSite({ ...site, commandes: site.commandes.map(c => c.id === updated.id ? updated : c) });
  }

  return (
    <div>
      <PageHeader
        title="Commandes"
        subtitle={`${site.commandes.length} commande(s) au total`}
        right={editable ? (
          <div style={{display:'flex', gap:10}}>
            <button className="btn" onClick={()=>setShowNewClient(true)}><Icon name="plus" size={15}/> Nouveau client</button>
            <button className="btn btn-rust" onClick={()=>setShowNew(true)}><Icon name="plus" size={15}/> Nouvelle commande</button>
          </div>
        ) : null}
      />

      <div style={{display:'flex', gap:10, marginBottom:18, flexWrap:'wrap', alignItems:'center'}}>
        <div style={{position:'relative', flex:'1 1 240px', maxWidth:320}}>
          <input type="text" placeholder="Rechercher (n° ticket, client, téléphone)…" value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:34}}/>
          <Icon name="search" size={15} style={{position:'absolute', left:11, top:11, color:'var(--steam)'}}/>
        </div>
        {['Toutes', ...STATUTS].map(s => (
          <button key={s} onClick={()=>setFilter(s)} className="btn btn-sm" style={{
            background: filter===s ? 'var(--pine)' : 'transparent',
            color: filter===s ? 'var(--white)' : 'var(--ink)',
            borderColor: filter===s ? 'var(--pine)' : 'var(--line-strong)'
          }}>{s}</button>
        ))}
      </div>

      <div className="card" style={{overflow:'hidden'}}>
        <table style={{width:'100%', borderCollapse:'collapse', fontSize:13.5}}>
          <thead>
            <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
              <th style={th}><SortableTh label="Ticket" field="ticket" sortBy={sortBy} sortDir={sortDir} onSort={toggleSort} /></th>
              <th style={th}><SortableTh label="Client" field="client" sortBy={sortBy} sortDir={sortDir} onSort={toggleSort} /></th>
              <th style={th}><SortableTh label="Articles" field="articles" sortBy={sortBy} sortDir={sortDir} onSort={toggleSort} /></th>
              <th style={th}><SortableTh label="Total" field="total" sortBy={sortBy} sortDir={sortDir} onSort={toggleSort} /></th>
              <th style={th}><SortableTh label="Statut" field="statut" sortBy={sortBy} sortDir={sortDir} onSort={toggleSort} /></th>
              <th style={th}><SortableTh label="Paiement" field="paiement" sortBy={sortBy} sortDir={sortDir} onSort={toggleSort} /></th>
              <th style={th}><SortableTh label="Employé" field="employe" sortBy={sortBy} sortDir={sortDir} onSort={toggleSort} /></th>
              <th style={th}><SortableTh label="Dépôt" field="depot" sortBy={sortBy} sortDir={sortDir} onSort={toggleSort} /></th>
              <th style={th}><SortableTh label="RDV récupération" field="rdv" sortBy={sortBy} sortDir={sortDir} onSort={toggleSort} /></th>
              <th style={th}></th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan={10} style={{...td, textAlign:'center', color:'var(--steam)', padding:'2rem'}}>Aucune commande ne correspond.</td></tr>
            )}
            {filtered.map(cmd => {
              const client = site.clients.find(c => c.id === cmd.clientId);
              const total = calcCommandeTotal(cmd, site.services);
              return (
                <tr key={cmd.id} className={isRdvCritical(cmd) ? 'blink-urgent' : undefined} style={{borderTop:'1px solid var(--line)', background: isRdvCritical(cmd) ? undefined : (isRdvUrgent(cmd) ? (cmd.statut === 'Prêt' ? 'var(--ok-light)' : 'var(--danger-light)') : undefined)}}>
                  <td style={{...td}}>
                    <span className="mono" style={{fontWeight:600}}>{cmd.numero}</span>
                    {cmd.express && <span className="tag" style={{background:'var(--rust-light)', color:'var(--rust)', marginLeft:6}}>⚡ Express</span>}
                  </td>
                  <td style={td}>{client ? client.nom : '—'}</td>
                  <td style={td}>{cmd.lignes.reduce((s,l)=>s+l.qte,0)} article(s)</td>
                  <td style={td}>
                    <div className="mono">{fmtGNF(total)}</div>
                    {Number(cmd.acompte) > 0 && total > Number(cmd.acompte) && (
                      <div style={{fontSize:11.5, color:'var(--danger)'}}>Solde: {fmtGNF(total - Number(cmd.acompte))}</div>
                    )}
                  </td>
                  <td style={td}><span className={`tag ${STATUT_TAG_CLASS[cmd.statut]}`}>{cmd.statut}</span></td>
                  <td style={td}>
                    <span className={`tag ${cmd.paiement==='paye'?'tag-paye':'tag-impaye'}`}>{cmd.paiement==='paye'?'Payé':Number(cmd.acompte)>0?'Partiel':'Impayé'}</span>
                    {cmd.modePaiement && <div style={{fontSize:11, color:'var(--steam)', marginTop:3}}>{cmd.modePaiement}</div>}
                  </td>
                  <td style={{...td, color:'var(--steam)'}}>{cmd.caissierEmpId ? ((site.employes.find(e=>e.id===cmd.caissierEmpId)||{}).nom || 'Employé supprimé') : 'Gérant'}</td>
                  <td style={td}>{fmtDate(cmd.dateCreation.slice(0,10))}</td>
                  <td style={td}>
                    {cmd.dateRdvRecuperation ? (
                      <span style={{color: isRdvUrgent(cmd) ? 'var(--danger)' : 'var(--ink)', fontWeight: isRdvUrgent(cmd) ? 700 : 400}}>
                        {fmtDate(cmd.dateRdvRecuperation)}{cmd.heureRdvRecuperation ? ` ${cmd.heureRdvRecuperation}` : ''}
                      </span>
                    ) : <span style={{color:'var(--steam)'}}>—</span>}
                  </td>
                  <td style={{...td, textAlign:'right'}}>
                    <div style={{display:'flex', gap:6, justifyContent:'flex-end', flexWrap:'nowrap', whiteSpace:'nowrap'}}>
                      <button className="btn btn-ghost btn-sm" onClick={()=>setOpenTicket(cmd)}>Voir</button>
                      {editable && cmd.statut === 'Reçu' && (
                        <button className="btn btn-ghost btn-sm" style={{color:'var(--pine)'}} onClick={()=>setEditCmd(cmd)}><Icon name="edit" size={13}/></button>
                      )}
                      {editable && (
                        <button className="btn btn-ghost btn-sm" style={{color:'var(--danger)'}} onClick={()=>setConfirmDeleteCmd(cmd)}><Icon name="trash" size={13}/></button>
                      )}
                      {editable && client && client.tel && (
                        <button className="btn btn-sm" style={{background:'#25D366', color:'white', borderColor:'#25D366', padding:'6px 10px'}}
                          onClick={()=>{
                            const tel = client.tel.replace(/\D/g,'');
                            const solde = total - (Number(cmd.acompte)||0);
                            const msg = encodeURIComponent(`Bonjour ${client.nom}, votre commande ${cmd.numero} chez ${site.nom} est prete.${solde>0?` Solde a regler : ${fmtGNF(solde)}.`:' Entierement payee.'} Merci !`);
                            window.open(`https://wa.me/${tel}?text=${msg}`, '_blank');
                          }}>📱</button>
                      )}
                      {editable && cmd.statut !== 'Récupéré' && (
                        // Le caissier ne peut PAS marquer "Prêt" — seul le repasseur peut
                        nextStatut(cmd.statut) !== 'Prêt' ? (
                          <button className="btn btn-sm" onClick={()=>advanceStatut(cmd)}>→ {nextStatut(cmd.statut)}</button>
                        ) : (
                          !employeId && <button className="btn btn-sm" onClick={()=>advanceStatut(cmd)}>→ Prêt</button>
                        )
                      )}
                      {editable && cmd.paiement === 'paye' && (
                        <button className="btn btn-sm" onClick={()=>togglePaiement(cmd)}>Marquer impayé</button>
                      )}
                      {editable && total > (Number(cmd.acompte)||0) && (
                        <button className="btn btn-sm" style={{color:'var(--ok)', borderColor:'var(--ok)'}} onClick={()=>setEncaisserCmd(cmd)}>💰 Encaisser</button>
                      )}
                    </div>
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>

      {showNew && <NewCommandeModal site={site} updateSite={updateSite} employeId={employeId} onClose={()=>setShowNew(false)} />}
      {openTicket && <TicketModal cmd={openTicket} site={site} onClose={()=>setOpenTicket(null)} />}
      {editCmd && <EditCommandeModal cmd={editCmd} site={site} updateSite={updateSite} onClose={()=>setEditCmd(null)} />}
      {confirmDeleteCmd && <ConfirmDelete db={db} message={`Supprimer définitivement la commande ${confirmDeleteCmd.numero} ? Cette action est irréversible.`}
        onConfirm={()=>{ deleteCommande(confirmDeleteCmd.id); setConfirmDeleteCmd(null); }}
        onCancel={()=>setConfirmDeleteCmd(null)} />}
      {showNewClient && <NewClientModal site={site} updateSite={updateSite} onClose={()=>setShowNewClient(false)} />}
      {encaisserCmd && <EncaisserModal cmd={encaisserCmd} site={site} onClose={()=>setEncaisserCmd(null)} onSave={(montant, mode)=>enregistrerPaiement(encaisserCmd, montant, mode)} />}
    </div>
  );
}

function EncaisserModal({ cmd, site, onClose, onSave }){
  const total = calcCommandeTotal(cmd, site.services);
  const soldeActuel = total - (Number(cmd.acompte)||0);
  const [montant, setMontant] = useState(String(soldeActuel > 0 ? soldeActuel : 0));
  const [mode, setMode] = useState(cmd.modePaiement || 'Espèces');

  return (
    <ModalShell title={`Encaisser — ${cmd.numero}`} onClose={onClose} width={380}>
      <div style={{display:'grid', gap:14}}>
        <div style={{background:'var(--paper-2)', borderRadius:8, padding:'10px 14px', fontSize:13}}>
          <div style={{display:'flex', justifyContent:'space-between'}}>
            <span>Total commande</span><span className="mono">{fmtGNF(total)}</span>
          </div>
          <div style={{display:'flex', justifyContent:'space-between'}}>
            <span>Déjà payé</span><span className="mono">{fmtGNF(Number(cmd.acompte)||0)}</span>
          </div>
          <div style={{display:'flex', justifyContent:'space-between', fontWeight:700, color: soldeActuel>0 ? 'var(--danger)' : 'var(--ok)', borderTop:'1px dashed var(--line-strong)', marginTop:6, paddingTop:6}}>
            <span>Solde restant</span><span className="mono">{fmtGNF(soldeActuel)}</span>
          </div>
        </div>
        <div>
          <label>Montant que le client paie maintenant</label>
          <input type="number" value={montant} onChange={e=>setMontant(e.target.value)} min={0} max={soldeActuel} autoFocus />
          <p style={{fontSize:12, color:'var(--steam)', margin:'6px 0 0', lineHeight:1.4}}>
            Si le client récupère ses articles sans tout régler, entrez ici seulement ce qu'il paie réellement — le reste restera enregistré comme solde dû.
          </p>
        </div>
        <div>
          <label>Mode de paiement</label>
          <select value={mode} onChange={e=>setMode(e.target.value)}>
            <option>Espèces</option>
            <option>Orange Money</option>
          </select>
        </div>
        <div style={{display:'flex', justifyContent:'flex-end', gap:10}}>
          <button className="btn" onClick={onClose}>Annuler</button>
          <button className="btn btn-rust" disabled={!montant || Number(montant)<=0} onClick={()=>{ onSave(Number(montant), mode); onClose(); }}>Enregistrer le paiement</button>
        </div>
      </div>
    </ModalShell>
  );
}

const th = { padding:'10px 14px', fontSize:12, fontWeight:700, color:'var(--pine)', textTransform:'uppercase', letterSpacing:'0.03em' };
const td = { padding:'10px 14px' };

function NewCommandeModal({ site, updateSite, onClose, employeId }){
  const [clientId, setClientId] = useState('');
  const [clientSearch, setClientSearch] = useState('');
  const [newClientMode, setNewClientMode] = useState(false);
  const [newClientNom, setNewClientNom] = useState('');
  const [newClientIndicatif, setNewClientIndicatif] = useState('+224');
  const [newClientTel, setNewClientTel] = useState('');
  const [lignes, setLignes] = useState([]);
  const [dateDepot, setDateDepot] = useState(todayISO());
  const [dateRetrait, setDateRetrait] = useState('');
  const [notes, setNotes] = useState('');
  const [dateRdv, setDateRdv] = useState('');
  const [heureRdv, setHeureRdv] = useState('');
  const [acompte, setAcompte] = useState('');
  const [acompteMode, setAcompteMode] = useState('none');
  const [modePaiementDepot, setModePaiementDepot] = useState('Espèces');
  const [rabaisMode, setRabaisMode] = useState('none'); // 'none' | 'pourcent' | 'fixe'
  const [rabais, setRabais] = useState('');
  const [showAddService, setShowAddService] = useState(false);
  const [newServiceNom, setNewServiceNom] = useState('');
  const [newServicePrix, setNewServicePrix] = useState('');
  const [newServiceCat, setNewServiceCat] = useState('Nettoyage');
  const [editServiceId, setEditServiceId] = useState(null);
  const [creating, setCreating] = useState(false);

  const clientMatches = useMemo(() => {
    if(!clientSearch.trim()) return site.clients.slice(0,5);
    const q = clientSearch.toLowerCase();
    return site.clients.filter(c => c.nom.toLowerCase().includes(q) || (c.tel||'').includes(q)).slice(0,5);
  }, [clientSearch, site.clients]);

  function addLigne(serviceId){
    setLignes(prev => {
      const exist = prev.find(l => l.serviceId === serviceId);
      if(exist) return prev.map(l => l.serviceId===serviceId ? {...l, qte:l.qte+1} : l);
      return [...prev, { serviceId, qte:1 }];
    });
  }
  function setQte(serviceId, qte){
    setLignes(prev => prev.map(l => l.serviceId===serviceId ? {...l, qte: Math.max(0,qte)} : l).filter(l=>l.qte>0));
  }

  const [express, setExpress] = useState(false);
  const [expressMajoration, setExpressMajoration] = useState('50');

  const totalBrut = lignes.reduce((s,l)=>{
    const svc = site.services.find(x=>x.id===l.serviceId);
    return s + (svc ? svc.prix*l.qte : 0);
  }, 0);

  const montantRabais = useMemo(() => {
    if(rabaisMode === 'pourcent' && rabais) return Math.round(totalBrut * Number(rabais) / 100);
    if(rabaisMode === 'fixe' && rabais) return Math.min(Number(rabais), totalBrut);
    return 0;
  }, [totalBrut, rabaisMode, rabais]);

  const baseApresRabais = totalBrut - montantRabais;
  const montantExpress = express ? Math.round(baseApresRabais * (Number(expressMajoration)||0) / 100) : 0;
  const total = baseApresRabais + montantExpress;

  async function handleSubmit(){
    let finalClientId = clientId;
    let workingClients = site.clients;
    if(newClientMode){
      if(!newClientNom.trim()) return;
      const newClient = { id: uid('cli_'), nom: capitalizeNom(newClientNom), tel: newClientTel.trim() ? `${newClientIndicatif} ${newClientTel.trim()}` : '', canalPref:'SMS', dateInscription: todayISO() };
      workingClients = [...site.clients, newClient];
      finalClientId = newClient.id;
    }
    if(!finalClientId || lignes.length === 0) return;

    setCreating(true);

    const seq = site.seq;
    const montantAcompte = Number(acompte) || 0;
    const now = new Date();
    const heureActuelle = now.toTimeString().slice(0,8);
    const dateCreationFinale = `${dateDepot || todayISO()}T${heureActuelle}`;
    const cmd = {
      id: uid('cmd_'),
      numero: ticketNumber(site.code, seq),
      clientId: finalClientId,
      caissierEmpId: employeId || null,
      lignes,
      statut: 'Reçu',
      paiement: montantAcompte >= total ? 'paye' : 'impaye',
      acompte: montantAcompte,
      modePaiement: montantAcompte > 0 ? modePaiementDepot : null,
      paiements: montantAcompte > 0 ? [{ id: uid('pmt_'), montant: montantAcompte, mode: modePaiementDepot, date: dateCreationFinale, employeId: employeId || null }] : [],
      rabais: montantRabais,
      totalBrut: totalBrut,
      express: express,
      expressMajoration: express ? Number(expressMajoration)||0 : 0,
      montantExpress: montantExpress,
      dateCreation: dateCreationFinale,
      dateRetraitPrevue: dateRetrait || null,
      dateRdvRecuperation: dateRdv || (express ? todayISO() : null),
      heureRdvRecuperation: heureRdv || null,
      notes: notes.trim(),
    };
    const client = workingClients.find(c=>c.id===finalClientId);

    // Reçu de dépose à envoyer au client
    const lignesDetail = lignes.map(l => {
      const svc = site.services.find(x=>x.id===l.serviceId);
      return svc ? `${l.qte}x ${svc.nom} (${fmtGNF(svc.prix*l.qte)})` : '';
    }).filter(Boolean).join('\n');

    let msgDepose = `🧺 Reçu de dépôt — ${site.nom}${express ? '\n⚡ COMMANDE EXPRESS' : ''}\nCommande : ${cmd.numero}\n\n${lignesDetail}\nTotal articles : ${lignes.reduce((s,l)=>s+l.qte,0)}${montantRabais>0?`\nRabais : -${fmtGNF(montantRabais)}`:''}${montantExpress>0?`\nSupplément Express (${expressMajoration}%) : +${fmtGNF(montantExpress)}`:''}\nTotal : ${fmtGNF(total)}${montantAcompte>0?`\nAcompte versé : ${fmtGNF(montantAcompte)}\nSolde restant : ${fmtGNF(total-montantAcompte)}`:'\nPaiement : À la récupération'}${cmd.dateRdvRecuperation?`\nRDV de récupération : ${fmtDate(cmd.dateRdvRecuperation)}${cmd.heureRdvRecuperation?' à '+cmd.heureRdvRecuperation:''}${express?' (urgence — même jour)':''}`:cmd.dateRetraitPrevue?`\nRDV : ${fmtDate(cmd.dateRetraitPrevue)}`:''}\n\nMerci pour votre confiance !`;

    // Générer le reçu PDF et l'envoyer sur Firebase Storage (avec délai de sécurité de 8s)
    try {
      const pdfBlob = generateReceiptPDFBlob(cmd, site, client, total, montantAcompte, total - montantAcompte);
      const timeout = new Promise((_, reject) => setTimeout(()=>reject(new Error('timeout')), 8000));
      const url = await Promise.race([uploadReceiptPDF(site.id, cmd, pdfBlob), timeout]);
      msgDepose += `\n\n📄 Reçu PDF : ${url}`;
      cmd.receiptPdfUrl = url;
    } catch(e) {
      console.error('Erreur génération/envoi du reçu PDF', e);
    }

    const notif = { id: uid('notif_'), clientId: finalClientId, message: msgDepose, canal: client.canalPref || 'SMS', date: new Date().toISOString() };

    updateSite({
      ...site,
      seq: seq+1,
      clients: workingClients,
      commandes: [cmd, ...site.commandes],
      notifications: [notif, ...site.notifications].slice(0,300),
    });

    // Ouvrir WhatsApp automatiquement si le client a un numéro
    if(client.tel){
      const tel = client.tel.replace(/\D/g,'');
      setTimeout(() => window.open(`https://wa.me/${tel}?text=${encodeURIComponent(msgDepose)}`, '_blank'), 300);
    }

    setCreating(false);
    onClose();
  }

  return (
    <ModalShell title="Nouvelle commande" onClose={onClose} width={620}>
      <div style={{display:'grid', gap:18}}>
        <div>
          <label>Client</label>
          {!newClientMode ? (
            <>
              <input type="text" placeholder="Rechercher un client…" value={clientSearch} onChange={e=>{setClientSearch(e.target.value); setClientId('');}} />
              <div style={{marginTop:6, display:'flex', flexWrap:'wrap', gap:6}}>
                {clientMatches.map(c => (
                  <button key={c.id} className="btn btn-sm" onClick={()=>{setClientId(c.id); setClientSearch(c.nom);}}
                    style={{background: clientId===c.id?'var(--pine-light)':'transparent', borderColor: clientId===c.id?'var(--pine)':'var(--line-strong)'}}>
                    {c.nom}
                  </button>
                ))}
              </div>
              <button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={()=>setNewClientMode(true)}>+ Créer un nouveau client</button>
            </>
          ) : (
            <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
              <input type="text" placeholder="Nom complet" value={newClientNom} onChange={e=>setNewClientNom(e.target.value)} />
              <div style={{display:'flex', gap:8, alignItems:'center'}}>
                <CountryCodeSelect value={newClientIndicatif} onChange={setNewClientIndicatif} />
                <input type="tel" placeholder="6XX XX XX XX" value={newClientTel} onChange={e=>setNewClientTel(e.target.value)} style={{flex:1}} />
              </div>
              <button className="btn btn-ghost btn-sm" style={{gridColumn:'1/-1', justifySelf:'start'}} onClick={()=>setNewClientMode(false)}>← Choisir un client existant</button>
            </div>
          )}
        </div>

        <div>
          <label>Date de dépôt</label>
          <input type="date" value={dateDepot} onChange={e=>setDateDepot(e.target.value)} max={todayISO()} style={{maxWidth:200}} />
          {dateDepot !== todayISO() && (
            <p style={{fontSize:11.5, color:'var(--warn)', margin:'4px 0 0'}}>⚠️ Date antérieure à aujourd'hui — utile pour rattraper une commande papier prise avant le lancement de l'app.</p>
          )}
        </div>

        <div>
          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
            <label style={{margin:0}}>Articles</label>
            <button className="btn btn-ghost btn-sm" style={{fontSize:12, color:'var(--pine)'}}
              onClick={()=>setShowAddService(!showAddService)}>
              {showAddService ? '← Masquer' : '+ Nouvel article / Modifier prix'}
            </button>
          </div>

          {/* Formulaire ajout/édition rapide d'un article */}
          {showAddService && (
            <div style={{background:'var(--paper-2)', borderRadius:8, padding:'12px', marginBottom:12}}>
              <div style={{display:'grid', gridTemplateColumns:'1.5fr 0.8fr 1fr auto', gap:8, alignItems:'end'}}>
                <div>
                  <label>Nom de l'article</label>
                  <input type="text" placeholder="Ex: Chemise, Pantalon…" value={newServiceNom} onChange={e=>setNewServiceNom(e.target.value)} />
                </div>
                <div>
                  <label>Prix (GNF)</label>
                  <input type="number" placeholder="0" value={newServicePrix} onChange={e=>setNewServicePrix(e.target.value)} />
                </div>
                <div>
                  <label>Type de service</label>
                  <select value={newServiceCat} onChange={e=>setNewServiceCat(e.target.value)}>
                    <option>Nettoyage complet</option>
                    <option>Repassage</option>
                    <option>Nettoyage + Repassage</option>
                    <option>Retouche</option>
                    <option>Maison</option>
                    <option>Autres</option>
                  </select>
                </div>
                <button className="btn btn-rust btn-sm" style={{alignSelf:'end'}}
                  disabled={!newServiceNom.trim()||!newServicePrix}
                  onClick={()=>{
                    if(editServiceId){
                      updateSite({ ...site, services: site.services.map(s => s.id===editServiceId ? {...s, nom:newServiceNom.trim(), prix:Number(newServicePrix), categorie:newServiceCat} : s) });
                      setEditServiceId(null);
                    } else {
                      updateSite({ ...site, services: [...site.services, { id: uid('svc_'), nom: newServiceNom.trim(), prix: Number(newServicePrix), categorie: newServiceCat }] });
                    }
                    setNewServiceNom(''); setNewServicePrix(''); setNewServiceCat('Nettoyage');
                  }}>
                  {editServiceId ? 'Modifier' : 'Ajouter'}
                </button>
              </div>
              {editServiceId && (
                <button className="btn btn-ghost btn-sm" style={{marginTop:8}} onClick={()=>{ setEditServiceId(null); setNewServiceNom(''); setNewServicePrix(''); }}>
                  Annuler la modification
                </button>
              )}

              {/* Liste des articles existants pour édition rapide */}
              <div style={{marginTop:12, maxHeight:160, overflowY:'auto'}}>
                <div style={{fontSize:12, color:'var(--steam)', marginBottom:6, fontWeight:600, textTransform:'uppercase', letterSpacing:'0.03em'}}>Cliquez sur un article pour modifier son prix</div>
                {site.services.map(s => (
                  <div key={s.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'5px 0', borderBottom:'1px solid var(--line)', fontSize:13}}>
                    <span>{s.nom} <span style={{color:'var(--steam)', fontSize:11}}>· {s.categorie}</span></span>
                    <div style={{display:'flex', gap:8, alignItems:'center'}}>
                      <span className="mono">{fmtGNF(s.prix)}</span>
                      <button className="btn btn-ghost btn-sm" style={{padding:'3px 7px'}} onClick={()=>{
                        setEditServiceId(s.id);
                        setNewServiceNom(s.nom);
                        setNewServicePrix(String(s.prix));
                        setNewServiceCat(s.categorie);
                      }}><Icon name="edit" size={12}/></button>
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Articles groupés par catégorie */}
          {['Nettoyage','Nettoyage + Repassage','Repassage','Retouche','Autres'].map(cat => {
            const items = site.services.filter(s => s.categorie === cat);
            if(items.length === 0) return null;
            return (
              <div key={cat} style={{marginBottom:10}}>
                <div style={{fontSize:11.5, fontWeight:700, color:'var(--pine)', textTransform:'uppercase', letterSpacing:'0.04em', marginBottom:6, paddingBottom:4, borderBottom:'1px solid var(--line)'}}>{cat}</div>
                <div style={{display:'grid', gridTemplateColumns:'repeat(2, 1fr)', gap:6}}>
                  {items.map(s => (
                    <button key={s.id} className="btn btn-sm" style={{justifyContent:'space-between', display:'flex', background: lignes.find(l=>l.serviceId===s.id) ? 'var(--pine-light)' : 'transparent', borderColor: lignes.find(l=>l.serviceId===s.id) ? 'var(--pine)' : 'var(--line-strong)'}} onClick={()=>addLigne(s.id)}>
                      <span>{s.nom}</span><span className="mono" style={{color:'var(--steam)'}}>{fmtGNF(s.prix)}</span>
                    </button>
                  ))}
                </div>
              </div>
            );
          })}
        </div>

        {lignes.length > 0 && (
          <div>
            <label>Panier</label>
            {lignes.map(l => {
              const svc = site.services.find(s=>s.id===l.serviceId);
              return (
                <div key={l.serviceId} style={{display:'flex', alignItems:'center', justifyContent:'space-between', padding:'6px 0', borderBottom:'1px solid var(--line)'}}>
                  <span style={{fontSize:13.5}}>{svc.nom}</span>
                  <div style={{display:'flex', alignItems:'center', gap:6}}>
                    <button className="btn btn-sm" style={{padding:'2px 9px'}} onClick={()=>setQte(l.serviceId, l.qte-1)}>−</button>
                    <input
                      type="number"
                      value={l.qte}
                      min={1}
                      onChange={e=>{
                        const v = parseInt(e.target.value);
                        if(!isNaN(v) && v > 0) setQte(l.serviceId, v);
                      }}
                      style={{width:48, textAlign:'center', padding:'3px 4px', fontFamily:'monospace', fontSize:13}}
                    />
                    <button className="btn btn-sm" style={{padding:'2px 9px'}} onClick={()=>setQte(l.serviceId, l.qte+1)}>+</button>
                    <span className="mono" style={{minWidth:90, textAlign:'right'}}>{fmtGNF(svc.prix*l.qte)}</span>
                  </div>
                </div>
              );
            })}
            <div style={{display:'flex', justifyContent:'space-between', paddingTop:10, borderTop:'1px solid var(--line)'}}>
              <span style={{color:'var(--steam)'}}>Sous-total</span><span className="mono" style={{color:'var(--steam)'}}>{fmtGNF(totalBrut)}</span>
            </div>

            {/* BLOC RABAIS */}
            <div style={{paddingTop:8}}>
              <div style={{display:'flex', gap:8, marginBottom:8, flexWrap:'wrap'}}>
                {[{label:'Pas de rabais', val:'none'}, {label:'Rabais %', val:'pourcent'}, {label:'Montant fixe', val:'fixe'}].map(opt => (
                  <button key={opt.val} className="btn btn-sm" onClick={()=>{ setRabaisMode(opt.val); setRabais(''); }}
                    style={{background: rabaisMode===opt.val ? 'var(--rust)' : 'transparent', color: rabaisMode===opt.val ? 'var(--white)' : 'var(--ink)', borderColor: rabaisMode===opt.val ? 'var(--rust)' : 'var(--line-strong)', fontSize:12}}>
                    🏷️ {opt.label}
                  </button>
                ))}
              </div>
              {rabaisMode === 'pourcent' && (
                <div style={{display:'flex', gap:8, flexWrap:'wrap', marginBottom:6}}>
                  {[5, 10, 15, 20, 25].map(p => (
                    <button key={p} className="btn btn-sm" onClick={()=>setRabais(String(p))}
                      style={{background: rabais===String(p) ? 'var(--rust)' : 'transparent', color: rabais===String(p) ? 'var(--white)' : 'var(--ink)', borderColor: rabais===String(p) ? 'var(--rust)' : 'var(--line-strong)'}}>
                      {p}%
                    </button>
                  ))}
                  <input type="number" placeholder="Autre %" value={rabais} onChange={e=>setRabais(e.target.value)} style={{width:80, padding:'5px 8px'}} max={100} min={0}/>
                </div>
              )}
              {rabaisMode === 'fixe' && (
                <input type="number" placeholder="Montant du rabais (GNF)" value={rabais} onChange={e=>setRabais(e.target.value)} max={totalBrut} min={0}/>
              )}
              {montantRabais > 0 && (
                <div style={{display:'flex', justifyContent:'space-between', fontSize:13, color:'var(--rust)', marginTop:4}}>
                  <span>Rabais {rabaisMode==='pourcent' ? `(${rabais}%)` : 'fixe'}</span>
                  <span className="mono">− {fmtGNF(montantRabais)}</span>
                </div>
              )}
            </div>

            {/* BLOC EXPRESS */}
            <div style={{paddingTop:8, borderTop:'1px solid var(--line)'}}>
              <button className="btn btn-sm" onClick={()=>setExpress(!express)}
                style={{background: express ? 'var(--rust)' : 'transparent', color: express ? 'var(--white)' : 'var(--ink)', borderColor: express ? 'var(--rust)' : 'var(--line-strong)'}}>
                ⚡ {express ? 'Commande Express activée' : 'Activer Express (urgence — généralement en une journée)'}
              </button>
              {express && (
                <div style={{marginTop:10, padding:'10px 12px', background:'var(--rust-light)', borderRadius:8}}>
                  <div style={{display:'flex', gap:8, alignItems:'center', flexWrap:'wrap'}}>
                    <span style={{fontSize:13}}>Majoration express :</span>
                    <input type="number" value={expressMajoration} onChange={e=>setExpressMajoration(e.target.value)} style={{width:70, padding:'5px 8px'}} min={0}/>
                    <span style={{fontSize:13}}>%</span>
                    <span className="mono" style={{color:'var(--rust)', fontWeight:700, marginLeft:'auto'}}>+ {fmtGNF(montantExpress)}</span>
                  </div>
                  <p style={{fontSize:11.5, color:'#8C4322', margin:'6px 0 0', lineHeight:1.4}}>
                    Le client souhaite récupérer ses articles en urgence. Le rendez-vous de récupération sera fixé à aujourd'hui si aucune date n'est choisie ci-dessous.
                  </p>
                </div>
              )}
            </div>

            <div style={{display:'flex', justifyContent:'space-between', paddingTop:8, fontWeight:700, fontSize:16, borderTop:'2px solid var(--line-strong)'}}>
              <span>Total à payer</span><span className="mono" style={{color:'var(--pine)'}}>{fmtGNF(total)}</span>
            </div>
          </div>
        )}

        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:10}}>
          <div>
            <label>RDV de récupération</label>
            <input type="date" value={dateRdv||''} onChange={e=>setDateRdv(e.target.value)} min={todayISO()} />
          </div>
          <div>
            <label>Heure du RDV</label>
            <input type="time" value={heureRdv||''} onChange={e=>setHeureRdv(e.target.value)} />
          </div>
          <div>
            <label>Notes</label>
            <input type="text" placeholder="Tache, bouton manquant…" value={notes} onChange={e=>setNotes(e.target.value)} />
          </div>
        </div>

        {/* PAIEMENT PARTIEL */}
        {total > 0 && (
          <div>
            <label>Paiement à la dépose</label>
            <div style={{display:'flex', gap:8, marginBottom:10, flexWrap:'wrap'}}>
              {[{label:'Pas de paiement', val:'none'}, {label:'Acompte %', val:'pourcent'}, {label:'Montant libre', val:'libre'}].map(opt => (
                <button key={opt.val} className="btn btn-sm" onClick={()=>{ setAcompteMode(opt.val); setAcompte(''); }}
                  style={{background: acompteMode===opt.val ? 'var(--pine)' : 'transparent', color: acompteMode===opt.val ? 'var(--white)' : 'var(--ink)', borderColor: acompteMode===opt.val ? 'var(--pine)' : 'var(--line-strong)'}}>
                  {opt.label}
                </button>
              ))}
            </div>
            {acompteMode === 'pourcent' && (
              <div style={{display:'flex', gap:8, flexWrap:'wrap'}}>
                {[25, 50, 75].map(p => {
                  const montant = Math.round(total * p / 100);
                  return (
                    <button key={p} className="btn btn-sm" onClick={()=>setAcompte(String(montant))}
                      style={{background: acompte===String(montant) ? 'var(--rust)' : 'transparent', color: acompte===String(montant) ? 'var(--white)' : 'var(--ink)', borderColor: acompte===String(montant) ? 'var(--rust)' : 'var(--line-strong)'}}>
                      {p}% — {fmtGNF(montant)}
                    </button>
                  );
                })}
              </div>
            )}
            {acompteMode === 'libre' && (
              <input type="number" placeholder="Montant payé maintenant (GNF)" value={acompte} onChange={e=>setAcompte(e.target.value)} max={total} />
            )}
            {acompte && Number(acompte) > 0 && (
              <div style={{marginTop:8, padding:'8px 12px', background:'var(--warn-light)', borderRadius:8, fontSize:13}}>
                <div style={{display:'flex', justifyContent:'space-between'}}>
                  <span>Acompte reçu :</span><span className="mono" style={{fontWeight:700}}>{fmtGNF(Number(acompte))}</span>
                </div>
                <div style={{display:'flex', justifyContent:'space-between', color:'var(--danger)'}}>
                  <span>Solde restant dû :</span><span className="mono" style={{fontWeight:700}}>{fmtGNF(total - Number(acompte))}</span>
                </div>
              </div>
            )}
            {acompte && Number(acompte) > 0 && (
              <div style={{marginTop:10}}>
                <label>Mode de paiement de l'acompte</label>
                <select value={modePaiementDepot} onChange={e=>setModePaiementDepot(e.target.value)}>
                  <option>Espèces</option>
                  <option>Orange Money</option>
                </select>
              </div>
            )}
          </div>
        )}

        <div style={{display:'flex', justifyContent:'flex-end', gap:10}}>
          <button className="btn" onClick={onClose}>Annuler</button>
          <button className="btn btn-rust" disabled={(!clientId && !newClientMode) || lignes.length===0 || creating} onClick={handleSubmit}>
            {creating ? 'Génération du reçu…' : 'Créer le ticket'}
          </button>
        </div>
      </div>
    </ModalShell>
  );
}

/* ===================== CONFIRMATION SUPPRESSION AVEC MOT DE PASSE ===================== */

function ConfirmDelete({ message, onConfirm, onCancel, db }){
  const [pass, setPass] = useState('');
  const [error, setError] = useState('');

  function handleConfirm(){
    if(pass === getPassGerant(db)){
      onConfirm();
    } else {
      setError('Mot de passe incorrect.');
      setPass('');
    }
  }

  return (
    <div style={{
      position:'fixed', inset:0, background:'rgba(27,31,28,0.55)',
      display:'flex', alignItems:'center', justifyContent:'center', zIndex:100, padding:20
    }}>
      <div className="card" style={{width:380, maxWidth:'92vw', padding:'1.5rem'}}>
        <div style={{display:'flex', alignItems:'center', gap:10, marginBottom:14, color:'var(--danger)'}}>
          <Icon name="alert" size={22} />
          <h2 style={{margin:0, fontSize:18, color:'var(--danger)'}}>Confirmer la suppression</h2>
        </div>
        <p style={{fontSize:14, color:'var(--ink)', marginBottom:16, lineHeight:1.5}}>{message}</p>
        <div style={{marginBottom:14}}>
          <label>Mot de passe gérant pour confirmer</label>
          <input
            type="password"
            placeholder="Entrez votre mot de passe…"
            value={pass}
            onChange={e=>{ setPass(e.target.value); setError(''); }}
            onKeyDown={e=>{ if(e.key==='Enter') handleConfirm(); }}
            autoFocus
          />
          {error && <p style={{color:'var(--danger)', fontSize:13, margin:'6px 0 0'}}>{error}</p>}
        </div>
        <div style={{display:'flex', gap:10, justifyContent:'flex-end'}}>
          <button className="btn" onClick={onCancel}>Annuler</button>
          <button className="btn" style={{background:'var(--danger)', borderColor:'var(--danger)', color:'var(--white)'}} onClick={handleConfirm}>
            Supprimer
          </button>
        </div>
      </div>
    </div>
  );
}

function EditCommandeModal({ cmd, site, updateSite, onClose }){
  const [notes, setNotes] = useState(cmd.notes || '');
  const [dateRetrait, setDateRetrait] = useState(cmd.dateRetraitPrevue || '');
  const [dateRdv, setDateRdv] = useState(cmd.dateRdvRecuperation || '');
  const [heureRdv, setHeureRdv] = useState(cmd.heureRdvRecuperation || '');

  function save(){
    updateSite({
      ...site,
      commandes: site.commandes.map(c => c.id===cmd.id ? {
        ...c, notes: notes.trim(),
        dateRetraitPrevue: dateRetrait || null,
        dateRdvRecuperation: dateRdv || null,
        heureRdvRecuperation: heureRdv || null,
      } : c)
    });
    onClose();
  }

  return (
    <ModalShell title={`Modifier commande ${cmd.numero}`} onClose={onClose} width={440}>
      <div style={{display:'grid', gap:14}}>
        <div><label>RDV de récupération</label>
          <input type="date" value={dateRetrait} onChange={e=>setDateRetrait(e.target.value)} min={todayISO()} />
        </div>
        <div>
          <label>Rendez-vous de récupération</label>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:10}}>
            <input type="date" value={dateRdv} onChange={e=>setDateRdv(e.target.value)} min={todayISO()} />
            <input type="time" value={heureRdv} onChange={e=>setHeureRdv(e.target.value)} />
          </div>
        </div>
        <div><label>Notes</label>
          <input type="text" value={notes} onChange={e=>setNotes(e.target.value)} placeholder="Tache, bouton manquant…" />
        </div>
        <div style={{display:'flex', justifyContent:'flex-end', gap:10}}>
          <button className="btn" onClick={onClose}>Annuler</button>
          <button className="btn btn-rust" onClick={save}>Enregistrer</button>
        </div>
      </div>
    </ModalShell>
  );
}

/* ===================== RECU PDF (pour WhatsApp) ===================== */

function setPdfColor(doc, hex){
  const r = parseInt(hex.slice(1,3),16), g = parseInt(hex.slice(3,5),16), b = parseInt(hex.slice(5,7),16);
  doc.setTextColor(r,g,b);
}

function fmtGNFPdf(n){
  return fmtGNF(n).replace(/[\u202F\u00A0]/g, ' ');
}

function generateReceiptPDFBlob(cmd, site, client, total, acompte, solde){
  const { jsPDF } = window.jspdf;
  const lignesConnues = cmd.lignes.map(l => {
    const svc = site.services.find(s=>s.id===l.serviceId);
    return svc ? { nom: svc.nom, qte: l.qte, prix: svc.prix } : null;
  }).filter(Boolean);

  const extraLines = (cmd.rabais > 0 ? 1 : 0) + (cmd.montantExpress > 0 ? 1 : 0) + (acompte > 0 ? 2 : 0) + ((cmd.dateRdvRecuperation || cmd.dateRetraitPrevue) ? 1 : 0) + (cmd.notes ? 2 : 0);
  const totalLines = 12 + (lignesConnues.length * 2) + extraLines + 8;
  const heightMM = Math.max(130, totalLines * 5.2 + 20);

  const doc = new jsPDF({ unit:'mm', format:[80, heightMM + 14] });
  const W = 80;
  const mx = 5;
  let y = 8;

  // Logo simplifié (badge + repère "chemise" + traits vapeur), en vectoriel natif jsPDF
  const logoCx = W/2, logoCy = y + 7, logoR = 7;
  doc.setFillColor(27,58,54);
  doc.circle(logoCx, logoCy, logoR, 'F');
  doc.setDrawColor(199,107,63);
  doc.setLineWidth(0.4);
  doc.circle(logoCx, logoCy, logoR, 'S');
  doc.setFillColor(246,242,232);
  const sLogo = 0.148; // échelle pour adapter la forme (120x120) au badge de 14mm
  doc.lines(
    [ [-14,10], [-11,13], [10,8], [0,37], [34,0], [0,-37], [10,-8] ],
    logoCx, logoCy - 34*sLogo,
    [sLogo, sLogo], 'F', true
  );
  doc.setDrawColor(199,107,63);
  doc.setLineWidth(0.7);
  doc.line(logoCx-4, logoCy+6.3, logoCx+4, logoCy+6.3);
  y = logoCy + logoR + 6;

  doc.setFont('helvetica','bold'); doc.setFontSize(13);
  doc.text(site.nom, W/2, y, {align:'center'}); y += 5;
  doc.setFont('helvetica','normal'); doc.setFontSize(8.5);
  if(site.adresse){ doc.text(site.adresse, W/2, y, {align:'center'}); y += 4; }
  if(site.tel){ doc.text(site.tel, W/2, y, {align:'center'}); y += 4; }

  doc.setLineDashPattern([1,1],0);
  doc.line(mx, y, W-mx, y); y += 5;

  doc.setFont('helvetica','bold'); doc.setFontSize(12);
  doc.text(cmd.numero + (cmd.express ? '  [EXPRESS]' : ''), W/2, y, {align:'center'}); y += 4.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(8);
  doc.text(new Date(cmd.dateCreation).toLocaleString('fr-FR'), W/2, y, {align:'center'}); y += 5;

  doc.setFontSize(9.5);
  doc.text(client ? client.nom + (client.tel ? ' — ' + client.tel : '') : 'Client', mx, y); y += 5;

  doc.line(mx, y, W-mx, y); y += 5;

  doc.setFontSize(9);
  lignesConnues.forEach(l => {
    const label = `${l.qte}x ${l.nom}`;
    const priceStr = fmtGNFPdf(l.prix*l.qte);
    const labelLines = doc.splitTextToSize(label, W - mx*2 - 22);
    doc.text(labelLines, mx, y);
    doc.text(priceStr, W-mx, y, {align:'right'});
    y += 4.8 * labelLines.length;
  });

  setPdfColor(doc, '#7FA89E');
  doc.setFontSize(8);
  doc.text('Total articles', mx, y);
  doc.text(String(cmd.lignes.reduce((s,l)=>s+l.qte,0)), W-mx, y, {align:'right'});
  setPdfColor(doc, '#1A1F1C');
  doc.setFontSize(9);
  y += 4.8;

  if(cmd.rabais > 0 || cmd.montantExpress > 0){
    setPdfColor(doc, '#666666');
    doc.text('Sous-total', mx, y);
    doc.text(fmtGNFPdf(cmd.totalBrut || total), W-mx, y, {align:'right'});
    setPdfColor(doc, '#1A1F1C');
    y += 4.8;
  }

  if(cmd.rabais > 0){
    setPdfColor(doc, '#C76B3F');
    doc.text('Rabais', mx, y);
    doc.text('- ' + fmtGNFPdf(cmd.rabais), W-mx, y, {align:'right'});
    setPdfColor(doc, '#1A1F1C');
    y += 4.8;
  }
  if(cmd.montantExpress > 0){
    setPdfColor(doc, '#C76B3F');
    doc.text(`Supplément Express (${cmd.expressMajoration}%)`, mx, y);
    doc.text('+ ' + fmtGNFPdf(cmd.montantExpress), W-mx, y, {align:'right'});
    setPdfColor(doc, '#1A1F1C');
    y += 4.8;
  }

  doc.line(mx, y, W-mx, y); y += 5;
  doc.setFont('helvetica','bold'); doc.setFontSize(11);
  doc.text('Total à payer', mx, y);
  doc.text(fmtGNFPdf(total), W-mx, y, {align:'right'});
  y += 5.5;
  doc.setFont('helvetica','normal'); doc.setFontSize(9);

  if(acompte > 0){
    setPdfColor(doc, '#3B7D4F');
    doc.text('Acompte versé', mx, y);
    doc.text(fmtGNFPdf(acompte), W-mx, y, {align:'right'});
    y += 4.8;
    setPdfColor(doc, solde > 0 ? '#B23B3B' : '#3B7D4F');
    doc.setFont('helvetica','bold');
    doc.text(solde > 0 ? 'Solde restant' : 'Entièrement payé', mx, y);
    if(solde > 0) doc.text(fmtGNFPdf(solde), W-mx, y, {align:'right'});
    y += 5;
    doc.setFont('helvetica','normal');
    setPdfColor(doc, '#1A1F1C');
  }

  if(cmd.dateRdvRecuperation || cmd.dateRetraitPrevue){
    doc.setFontSize(8.5);
    const rdvTxt = cmd.dateRdvRecuperation
      ? `RDV : ${fmtDate(cmd.dateRdvRecuperation)}${cmd.heureRdvRecuperation ? ' à '+cmd.heureRdvRecuperation : ''}`
      : `RDV : ${fmtDate(cmd.dateRetraitPrevue)}`;
    doc.text(rdvTxt, mx, y);
    y += 4.5;
  }

  if(cmd.notes){
    doc.setFontSize(8.5);
    const noteLines = doc.splitTextToSize('Notes : ' + cmd.notes, W - mx*2);
    doc.text(noteLines, mx, y);
    y += noteLines.length * 4 + 1;
  }

  y += 2;
  doc.line(mx, y, W-mx, y); y += 5;

  doc.setFontSize(7.5);
  setPdfColor(doc, '#92400E');
  const disclaimerLines = doc.splitTextToSize("Avis important : Maci Pressing ne sera pas responsable des articles non récupérés après 45 jours de dépôt. Passé ce délai, les articles seront considérés comme abandonnés.", W - mx*2);
  doc.text(disclaimerLines, mx, y);

  return doc.output('blob');
}

async function uploadReceiptPDF(siteId, cmd, pdfBlob){
  const path = `receipts/${siteId}/${cmd.id}.pdf`;
  const ref = firebaseStorage.ref().child(path);
  await ref.put(pdfBlob, { contentType: 'application/pdf' });
  return await ref.getDownloadURL();
}

        {Number(cmd.montantExpress) > 0 && (
          <div style={{display:'flex', justifyContent:'space-between', fontSize:13, color:'var(--rust)', paddingTop:2}}>
            <span>⚡ Supplément Express ({cmd.expressMajoration}%)</span><span className="mono">+ {fmtGNF(Number(cmd.montantExpress))}</span>
          </div>
        )}
        <div style={{borderTop:'1px dashed var(--line-strong)', marginTop:6, paddingTop:8, display:'flex', justifyContent:'space-between', fontWeight:700}}>
          <span>Total à payer</span><span className="mono">{fmtGNF(total)}</span>
        </div>
        {acompte > 0 && (
          <>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:13, color:'var(--ok)', paddingTop:4}}>
              <span>Acompte versé</span><span className="mono">{fmtGNF(acompte)}</span>
            </div>
            <div style={{display:'flex', justifyContent:'space-between', fontSize:13.5, fontWeight:700, color: solde > 0 ? 'var(--danger)' : 'var(--ok)', paddingTop:4, borderTop:'1px dashed var(--line)'}}>
              <span>{solde > 0 ? 'Solde restant dû' : 'Entièrement payé ✓'}</span>
              <span className="mono">{solde > 0 ? fmtGNF(solde) : ''}</span>
            </div>
          </>
        )}
        <div style={{marginTop:10, display:'flex', justifyContent:'space-between', fontSize:12.5}}>
          <span className={`tag ${STATUT_TAG_CLASS[cmd.statut]}`}>{cmd.statut}</span>
          <span className={`tag ${cmd.paiement==='paye'?'tag-paye':'tag-impaye'}`}>{cmd.paiement==='paye'?'Payé':'Impayé'}</span>
        </div>
        {cmd.modePaiement && <div style={{fontSize:12, color:'var(--steam)', marginTop:4, textAlign:'right'}}>Mode : {cmd.modePaiement}</div>}
        {cmd.dateRetraitPrevue && <div style={{fontSize:12, color:'var(--steam)', marginTop:8}}>📅 RDV : {fmtDate(cmd.dateRetraitPrevue)}</div>}
        {cmd.dateRdvRecuperation && <div style={{fontSize:12, color:'var(--pine)', marginTop:4, fontWeight:600}}>🕐 RDV récupération : {fmtDate(cmd.dateRdvRecuperation)}{cmd.heureRdvRecuperation ? ` à ${cmd.heureRdvRecuperation}` : ''}</div>}
        {cmd.notes && <div style={{fontSize:12, color:'var(--steam)', marginTop:4}}>📝 {cmd.notes}</div>}
        <div style={{borderTop:'1px dashed var(--line-strong)', marginTop:10, paddingTop:8, fontSize:11.5, color:'var(--steam)', display:'flex', justifyContent:'space-between'}}>
          <span>Enregistré par : <strong style={{color:'var(--ink)'}}>{caissier ? caissier.nom : 'Caissier'}</strong></span>
          <span className="mono">{new Date(cmd.dateCreation).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</span>
        </div>
        <div style={{marginTop:10, padding:'8px 10px', background:'#FEF3C7', borderRadius:6, fontSize:10.5, color:'#92400E', lineHeight:1.5}}>
          ⚠️ <strong>Avis important :</strong> Maci Pressing ne sera pas responsable des articles non récupérés après <strong>45 jours</strong> de dépôt. Passé ce délai, les articles seront considérés comme abandonnés.
        </div>
      </div>
      <div className="no-print" style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginTop:16}}>
        <button className="btn btn-sm" style={{background:'#25D366', color:'white', borderColor:'#25D366'}}
          onClick={ouvrirWhatsApp} disabled={!client || !client.tel}>
          📱 WhatsApp
        </button>
        <div style={{display:'flex', gap:8}}>
          <button className="btn btn-sm" onClick={()=>imprimerTicket(cmd, site, client, total, acompte, solde, caissier)}>
            <Icon name="print" size={14}/> Imprimer / PDF
          </button>
          <button className="btn btn-rust btn-sm" onClick={onClose}>Fermer</button>
        </div>
      </div>
    </ModalShell>
  );
}
