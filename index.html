function RemunerationGerantView({ site }){
  const [filterMois, setFilterMois] = useState(todayISO().slice(0,7));
  const [onglet, setOnglet] = useState('repasseurs'); // 'repasseurs' | 'caissiers' | 'tout'
  const remunerations = site.remunerations || [];
  const commandes = site.commandes || [];
  const employes = site.employes || [];
  const today = todayISO();

  const moisDisponibles = useMemo(() => {
    const mois = new Set(remunerations.map(r=>r.date.slice(0,7)));
    mois.add(today.slice(0,7));
    return [...mois].sort().reverse();
  }, [remunerations]);

  // Bilan repasseurs — par employé
  const bilanRepasseurs = useMemo(() => {
    const filtered = remunerations.filter(r => r.date.slice(0,7) === filterMois && r.type === 'repassage');
    const parEmploye = {};
    filtered.forEach(r => {
      const empId = r.employeId || 'inconnu';
      if(!parEmploye[empId]) parEmploye[empId] = { montant: 0, articles: {}, entrees: [] };
      parEmploye[empId].montant += Number(r.montant);
      parEmploye[empId].entrees.push(r);
      if(r.detail) r.detail.split(', ').forEach(part => {
        const match = part.match(/(\d+)x (.+?) \(/);
        if(match){ const nom=match[2]; const qte=Number(match[1]); parEmploye[empId].articles[nom]=(parEmploye[empId].articles[nom]||0)+qte; }
      });
    });
    return parEmploye;
  }, [remunerations, filterMois]);

  // Bilan caissiers — par employé
  const bilanCaissiers = useMemo(() => {
    const filtered = commandes.filter(c => c.dateCreation.slice(0,7) === filterMois);
    const parEmploye = {};
    filtered.forEach(c => {
      const empId = c.caissierEmpId || 'inconnu';
      if(!parEmploye[empId]) parEmploye[empId] = { commandes: [], ca: 0, acomptes: 0 };
      const total = c.lignes.reduce((s,l) => {
        const svc = site.services.find(x=>x.id===l.serviceId);
        return s + (svc ? svc.prix*l.qte : 0);
      }, 0) - (Number(c.rabais)||0);
      parEmploye[empId].commandes.push(c);
      parEmploye[empId].ca += total;
      parEmploye[empId].acomptes += Number(c.acompte)||0;
    });
    return parEmploye;
  }, [commandes, filterMois, site.services]);

  function getEmpNom(empId){
    if(empId === 'inconnu') return 'Non identifié';
    const emp = employes.find(e=>e.id===empId);
    return emp ? emp.nom : `Employé inconnu`;
  }

  const totalRem = Object.values(bilanRepasseurs).reduce((s,b)=>s+b.montant,0);

  return (
    <div>
      <PageHeader title="Rémunérations & Traçabilité" subtitle={formatMoisAnnee(filterMois)} />

      {/* Filtres */}
      <div style={{display:'flex', gap:10, marginBottom:18, flexWrap:'wrap', alignItems:'center'}}>
        <select value={filterMois} onChange={e=>setFilterMois(e.target.value)} style={{width:'auto', minWidth:160}}>
          {moisDisponibles.map(m => (
            <option key={m} value={m}>{new Date(m + '-15T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</option>
          ))}
        </select>
        {['repasseurs','caissiers','tout'].map(o => (
          <button key={o} className="btn btn-sm" onClick={()=>setOnglet(o)}
            style={{background:onglet===o?'var(--pine)':'transparent', color:onglet===o?'var(--white)':'var(--ink)', borderColor:onglet===o?'var(--pine)':'var(--line-strong)'}}>
            {o === 'repasseurs' ? '👔 Repasseurs' : o === 'caissiers' ? '🧾 Caissiers' : '📋 Tout'}
          </button>
        ))}
      </div>

      {/* BILAN REPASSEURS */}
      {(onglet === 'repasseurs' || onglet === 'tout') && (
        <div style={{marginBottom:24}}>
          <h2 style={{fontSize:16, color:'var(--pine)', marginBottom:12}}>👔 Bilan par repasseur</h2>
          {Object.keys(bilanRepasseurs).length === 0 ? (
            <div className="card" style={{padding:'1.25rem', color:'var(--steam)', fontSize:13}}>Aucun repassage enregistré ce mois.</div>
          ) : (
            <div style={{display:'grid', gap:14}}>
              {Object.entries(bilanRepasseurs).map(([empId, bilan]) => (
                <div key={empId} className="card" style={{padding:'1.25rem 1.5rem'}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:12}}>
                    <div>
                      <div style={{fontWeight:700, fontSize:15}}>{getEmpNom(empId)}</div>
                      <div style={{fontSize:12.5, color:'var(--steam)'}}>{bilan.entrees.length} prestation(s)</div>
                    </div>
                    <div style={{textAlign:'right'}}>
                      <div className="mono" style={{fontSize:18, fontWeight:700, color:'var(--ok)'}}>{fmtGNF(bilan.montant)}</div>
                      <div style={{fontSize:11.5, color:'var(--steam)'}}>à payer ce mois</div>
                    </div>
                  </div>
                  {/* Articles repassés */}
                  <div style={{display:'flex', flexWrap:'wrap', gap:8, marginBottom:10}}>
                    {Object.entries(bilan.articles).map(([nom, qte]) => (
                      <span key={nom} style={{background:'var(--pine-light)', color:'var(--pine)', fontSize:12, padding:'3px 10px', borderRadius:100, fontWeight:600}}>
                        {qte}x {nom}
                      </span>
                    ))}
                  </div>
                  {/* Bilan journalier */}
                  <div style={{marginTop:8}}>
                    <div style={{fontSize:11.5, color:'var(--steam)', fontWeight:600, textTransform:'uppercase', marginBottom:6}}>Détail journalier</div>
                    {(() => {
                      const parJour = {};
                      bilan.entrees.forEach(r => {
                        if(!parJour[r.date]) parJour[r.date] = { montant:0, articles:{} };
                        parJour[r.date].montant += Number(r.montant);
                        if(r.detail) r.detail.split(', ').forEach(part => {
                          const match = part.match(/(\d+)x (.+?) \(/);
                          if(match){ parJour[r.date].articles[match[2]]=(parJour[r.date].articles[match[2]]||0)+Number(match[1]); }
                        });
                      });
                      return Object.entries(parJour).sort((a,b)=>b[0].localeCompare(a[0])).map(([date, data]) => (
                        <div key={date} style={{display:'flex', justifyContent:'space-between', padding:'5px 0', borderBottom:'1px solid var(--line)', fontSize:13}}>
                          <div>
                            <span style={{fontWeight:600}}>{fmtDate(date)}</span>
                            <span style={{color:'var(--steam)', marginLeft:8, fontSize:12}}>
                              {Object.entries(data.articles).map(([n,q])=>`${q}x ${n}`).join(' · ')}
                            </span>
                          </div>
                          <span className="mono" style={{color:'var(--ok)'}}>{fmtGNF(data.montant)}</span>
                        </div>
                      ));
                    })()}
                  </div>
                </div>
              ))}
              <div className="card" style={{padding:'1rem 1.5rem', background:'var(--pine-light)', borderColor:'var(--pine)'}}>
                <div style={{display:'flex', justifyContent:'space-between', fontWeight:700}}>
                  <span>Total rémunérations repassage ce mois</span>
                  <span className="mono" style={{color:'var(--pine)', fontSize:16}}>{fmtGNF(totalRem)}</span>
                </div>
              </div>
            </div>
          )}
        </div>
      )}

      {/* BILAN CAISSIERS */}
      {(onglet === 'caissiers' || onglet === 'tout') && (
        <div>
          <h2 style={{fontSize:16, color:'var(--pine)', marginBottom:12}}>🧾 Bilan par caissier</h2>
          {Object.keys(bilanCaissiers).length === 0 ? (
            <div className="card" style={{padding:'1.25rem', color:'var(--steam)', fontSize:13}}>Aucune commande ce mois.</div>
          ) : (
            <div style={{display:'grid', gap:14}}>
              {Object.entries(bilanCaissiers).map(([empId, bilan]) => (
                <div key={empId} className="card" style={{padding:'1.25rem 1.5rem'}}>
                  <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', marginBottom:12}}>
                    <div>
                      <div style={{fontWeight:700, fontSize:15}}>{getEmpNom(empId)}</div>
                      <div style={{fontSize:12.5, color:'var(--steam)'}}>{bilan.commandes.length} commande(s) créée(s)</div>
                    </div>
                    <div style={{textAlign:'right', display:'flex', gap:16}}>
                      <div>
                        <div className="mono" style={{fontSize:16, fontWeight:700, color:'var(--pine)'}}>{fmtGNF(bilan.ca)}</div>
                        <div style={{fontSize:11.5, color:'var(--steam)'}}>CA total</div>
                      </div>
                      <div>
                        <div className="mono" style={{fontSize:16, fontWeight:700, color:'var(--ok)'}}>{fmtGNF(bilan.acomptes)}</div>
                        <div style={{fontSize:11.5, color:'var(--steam)'}}>Acomptes reçus</div>
                      </div>
                    </div>
                  </div>
                  {/* 5 dernières commandes */}
                  <div style={{fontSize:11.5, color:'var(--steam)', fontWeight:600, textTransform:'uppercase', marginBottom:6}}>Dernières commandes</div>
                  {bilan.commandes.slice(0,5).map(c => (
                    <div key={c.id} style={{display:'flex', justifyContent:'space-between', padding:'4px 0', borderBottom:'1px solid var(--line)', fontSize:13}}>
                      <div>
                        <span className="mono" style={{fontWeight:600}}>{c.numero}</span>
                        <span style={{color:'var(--steam)', marginLeft:8}}>{fmtDate(c.dateCreation.slice(0,10))}</span>
                      </div>
                      <span className={`tag ${STATUT_TAG_CLASS[c.statut]}`}>{c.statut}</span>
                    </div>
                  ))}
                  {bilan.commandes.length > 5 && <div style={{fontSize:12, color:'var(--steam)', marginTop:6}}>+ {bilan.commandes.length - 5} autre(s)</div>}
                </div>
              ))}
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function ConfigRemunerationEditor({ site, updateSite }){
  const config = site.configRemuneration || { tarifsRepassage: [], zones: [] };
  const [tarifsRepassage, setTarifsRepassage] = useState(config.tarifsRepassage || []);
  const [zones, setZones] = useState(config.zones || []);
  const [newRepNom, setNewRepNom] = useState('');
  const [newRepPrix, setNewRepPrix] = useState('');
  const [editingRepId, setEditingRepId] = useState(null);
  const [newZoneNom, setNewZoneNom] = useState('');
  const [newZoneMontant, setNewZoneMontant] = useState('');
  const [editingZoneId, setEditingZoneId] = useState(null);
  const [flash, setFlash] = useState(false);

  function save(){
    updateSite({ ...site, configRemuneration: { tarifsRepassage, zones } });
    setFlash(true);
    setTimeout(()=>setFlash(false), 1800);
  }
  function addTarifRepassage(){
    if(!newRepNom.trim()||!newRepPrix) return;
    setTarifsRepassage([...tarifsRepassage, { id: uid('rep_'), nom: newRepNom.trim(), prix: Number(newRepPrix) }]);
    setNewRepNom(''); setNewRepPrix('');
  }
  function removeTarifRepassage(id){ setTarifsRepassage(tarifsRepassage.filter(t=>t.id!==id)); }
  function startEditTarif(t){ setNewRepNom(t.nom); setNewRepPrix(String(t.prix)); setEditingRepId(t.id); }
  function saveEditTarif(){
    if(!newRepNom.trim()||!newRepPrix) return;
    setTarifsRepassage(tarifsRepassage.map(t => t.id===editingRepId ? {...t, nom:newRepNom.trim(), prix:Number(newRepPrix)} : t));
    setNewRepNom(''); setNewRepPrix(''); setEditingRepId(null);
  }
  function addZone(){
    if(!newZoneNom.trim()||!newZoneMontant) return;
    setZones([...zones, { id: uid('zone_'), nom: newZoneNom.trim(), montant: Number(newZoneMontant) }]);
    setNewZoneNom(''); setNewZoneMontant('');
  }
  function removeZone(id){ setZones(zones.filter(z=>z.id!==id)); }
  function startEditZone(z){ setNewZoneNom(z.nom); setNewZoneMontant(String(z.montant)); setEditingZoneId(z.id); }
  function saveEditZone(){
    if(!newZoneNom.trim()||!newZoneMontant) return;
    setZones(zones.map(z => z.id===editingZoneId ? {...z, nom:newZoneNom.trim(), montant:Number(newZoneMontant)} : z));
    setNewZoneNom(''); setNewZoneMontant(''); setEditingZoneId(null);
  }

  return (
    <div className="card" style={{padding:'1.5rem', marginTop:18}}>
      <h3 style={{margin:'0 0 14px', fontSize:15, display:'flex', alignItems:'center', gap:8}}>
        💰 Configuration des rémunérations employés
      </h3>

      {/* Tarifs de repassage par article */}
      <div style={{marginBottom:20}}>
        <label>Tarifs de repassage (par article)</label>
        <p style={{fontSize:12.5, color:'var(--steam)', margin:'0 0 10px', lineHeight:1.5}}>
          Ajoutez chaque type d'article avec son prix de repassage. Le repasseur choisira dans cette liste.
        </p>
        <div style={{marginBottom:10, maxHeight:200, overflowY:'auto'}}>
          {tarifsRepassage.map(t => (
            <div key={t.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'7px 0', borderBottom:'1px solid var(--line)', fontSize:13.5}}>
              <span>👔 {t.nom}</span>
              <div style={{display:'flex', gap:6, alignItems:'center'}}>
                <span className="mono">{fmtGNF(t.prix)}</span>
                <button className="btn btn-ghost btn-sm" style={{padding:'3px 7px'}} onClick={()=>startEditTarif(t)}><Icon name="edit" size={13}/></button>
                <button className="btn btn-ghost btn-sm" style={{color:'var(--danger)', padding:'3px 7px'}} onClick={()=>removeTarifRepassage(t.id)}><Icon name="trash" size={13}/></button>
              </div>
            </div>
          ))}
          {tarifsRepassage.length === 0 && <p style={{fontSize:13, color:'var(--steam)'}}>Aucun tarif configuré.</p>}
        </div>
        <div style={{display:'grid', gridTemplateColumns:'2fr 1fr auto auto', gap:8}}>
          <input type="text" placeholder="Article (ex: Chemise, Pantalon, Robe…)" value={newRepNom} onChange={e=>setNewRepNom(e.target.value)} />
          <input type="number" placeholder="Prix GNF" value={newRepPrix} onChange={e=>setNewRepPrix(e.target.value)} />
          {editingRepId ? (
            <>
              <button className="btn btn-sm" style={{background:'var(--pine)', color:'var(--white)', borderColor:'var(--pine)'}} disabled={!newRepNom.trim()||!newRepPrix} onClick={saveEditTarif}><Icon name="check" size={13}/></button>
              <button className="btn btn-ghost btn-sm" onClick={()=>{ setEditingRepId(null); setNewRepNom(''); setNewRepPrix(''); }}><Icon name="x" size={13}/></button>
            </>
          ) : (
            <button className="btn btn-sm" disabled={!newRepNom.trim()||!newRepPrix} onClick={addTarifRepassage} style={{gridColumn:'3/5'}}><Icon name="plus" size={13}/> Ajouter</button>
          )}
        </div>
      </div>

      {/* Zones de livraison */}
      <div>
        <label>Zones de livraison et tarifs</label>
        <div style={{marginBottom:10}}>
          {zones.map(z => (
            <div key={z.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'7px 0', borderBottom:'1px solid var(--line)', fontSize:13.5}}>
              <span>{z.nom}</span>
              <div style={{display:'flex', gap:6, alignItems:'center'}}>
                <span className="mono">{fmtGNF(z.montant)}</span>
                <button className="btn btn-ghost btn-sm" style={{padding:'3px 7px'}} onClick={()=>startEditZone(z)}><Icon name="edit" size={13}/></button>
                <button className="btn btn-ghost btn-sm" style={{color:'var(--danger)', padding:'3px 7px'}} onClick={()=>removeZone(z.id)}><Icon name="trash" size={13}/></button>
              </div>
            </div>
          ))}
          {zones.length === 0 && <p style={{fontSize:13, color:'var(--steam)'}}>Aucune zone configurée.</p>}
        </div>
        <div style={{display:'grid', gridTemplateColumns:'2fr 1fr auto auto', gap:8}}>
          <input type="text" placeholder="Nom de la zone (ex: Zone 1 — Kipé)" value={newZoneNom} onChange={e=>setNewZoneNom(e.target.value)} />
          <input type="number" placeholder="Montant GNF" value={newZoneMontant} onChange={e=>setNewZoneMontant(e.target.value)} />
          {editingZoneId ? (
            <>
              <button className="btn btn-sm" style={{background:'var(--pine)', color:'var(--white)', borderColor:'var(--pine)'}} disabled={!newZoneNom.trim()||!newZoneMontant} onClick={saveEditZone}><Icon name="check" size={13}/></button>
              <button className="btn btn-ghost btn-sm" onClick={()=>{ setEditingZoneId(null); setNewZoneNom(''); setNewZoneMontant(''); }}><Icon name="x" size={13}/></button>
            </>
          ) : (
            <button className="btn btn-sm" disabled={!newZoneNom.trim()||!newZoneMontant} onClick={addZone} style={{gridColumn:'3/5'}}><Icon name="plus" size={13}/> Ajouter</button>
          )}
        </div>
      </div>

      <button className="btn btn-rust" style={{marginTop:16}} onClick={save}>
        {flash ? <><Icon name="check" size={14}/> Enregistré !</> : 'Enregistrer la configuration'}
      </button>
    </div>
  );
}

function RegenererRecusSection({ site }){
  const [progress, setProgress] = useState(null); // {done, total} | null

  const commandesAvecRecu = (site.commandes||[]).filter(c => c.receiptPdfUrl);

  async function regenererTout(){
    const liste = commandesAvecRecu;
    setProgress({ done: 0, total: liste.length });
    for(let i=0; i<liste.length; i++){
      const cmd = liste[i];
      try {
        const client = site.clients.find(c=>c.id===cmd.clientId);
        const total = calcCommandeTotal(cmd, site.services);
        const acompte = Number(cmd.acompte)||0;
        const solde = total - acompte;
        const pdfBlob = generateReceiptPDFBlob(cmd, site, client, total, acompte, solde);
        await uploadReceiptPDF(site.id, cmd, pdfBlob);
      } catch(e) {
        console.error('Erreur régénération reçu', cmd.numero, e);
      }
      setProgress({ done: i+1, total: liste.length });
    }
  }

  if(commandesAvecRecu.length === 0) return null;

  const termine = progress && progress.done === progress.total;

  return (
    <div className="card" style={{padding:'1.5rem', marginTop:18}}>
      <h3 style={{margin:'0 0 6px', fontSize:15}}>🖼️ Ajouter le logo aux reçus déjà envoyés</h3>
      <p style={{fontSize:12.5, color:'var(--steam)', margin:'0 0 14px', lineHeight:1.5}}>
        {commandesAvecRecu.length} reçu(s) PDF de « {site.nom} » ont été générés avant l'ajout du logo. Cet outil les régénère avec le nouveau logo — les liens déjà envoyés par WhatsApp restent valides et afficheront automatiquement la version mise à jour, sans avoir besoin de recontacter les clients.
      </p>
      <button className="btn btn-rust" onClick={regenererTout} disabled={progress && !termine}>
        {progress && !termine ? `Régénération… ${progress.done}/${progress.total}` : `Régénérer les ${commandesAvecRecu.length} reçu(s)`}
      </button>
      {termine && (
        <p style={{color:'var(--ok)', fontSize:13, marginTop:10, display:'flex', alignItems:'center', gap:6}}><Icon name="check" size={14}/> Terminé !</p>
      )}
    </div>
  );
}

function ParametresView({ site, updateSite, db, setDb }){
  const [nom, setNom] = useState(site.nom);
  const [adresse, setAdresse] = useState(site.adresse);
  const [tel, setTel] = useState(site.tel);
  const [code, setCode] = useState(site.code);
  const [showRenameConfirm, setShowRenameConfirm] = useState(false);
  const [renameFlash, setRenameFlash] = useState(false);

  function renommerTousLesTickets(){
    const nouveauCode = code.trim().toUpperCase() || site.code;
    const nextCommandes = site.commandes.map(c => {
      const idx = c.numero.indexOf('-');
      const reste = idx >= 0 ? c.numero.slice(idx) : ('-' + c.numero);
      return { ...c, numero: nouveauCode + reste };
    });
    updateSite({ ...site, code: nouveauCode, commandes: nextCommandes });
    setShowRenameConfirm(false);
    setRenameFlash(true);
    setTimeout(()=>setRenameFlash(false), 2200);
  }
  const [savedFlash, setSavedFlash] = useState(false);
  const [resetScope, setResetScope] = useState(null); // 'jour' | 'mois' | 'tout'

  const [showPlageCmd, setShowPlageCmd] = useState(false);
  const [rangeDebutCmd, setRangeDebutCmd] = useState(todayISO());
  const [rangeFinCmd, setRangeFinCmd] = useState(todayISO());

  function countForScope(scope){
    const today = todayISO();
    if(scope === 'jour') return site.commandes.filter(c => c.dateCreation.slice(0,10) === today).length;
    if(scope === 'mois') return site.commandes.filter(c => c.dateCreation.slice(0,7) === today.slice(0,7)).length;
    if(scope === 'plage') return site.commandes.filter(c => c.dateCreation.slice(0,10) >= rangeDebutCmd && c.dateCreation.slice(0,10) <= rangeFinCmd).length;
    return site.commandes.length;
  }

  function resetCommandes(){
    if(!resetScope) return;
    const today = todayISO();
    let removed, remaining;
    if(resetScope === 'jour'){ removed = site.commandes.filter(c => c.dateCreation.slice(0,10) === today); remaining = site.commandes.filter(c => c.dateCreation.slice(0,10) !== today); }
    else if(resetScope === 'mois'){ removed = site.commandes.filter(c => c.dateCreation.slice(0,7) === today.slice(0,7)); remaining = site.commandes.filter(c => c.dateCreation.slice(0,7) !== today.slice(0,7)); }
    else if(resetScope === 'plage'){ removed = site.commandes.filter(c => c.dateCreation.slice(0,10) >= rangeDebutCmd && c.dateCreation.slice(0,10) <= rangeFinCmd); remaining = site.commandes.filter(c => !(c.dateCreation.slice(0,10) >= rangeDebutCmd && c.dateCreation.slice(0,10) <= rangeFinCmd)); }
    else { removed = site.commandes; remaining = []; }
    const labelPeriode = resetScope==='jour'?"aujourd'hui":resetScope==='mois'?'ce mois-ci':resetScope==='plage'?`du ${fmtDate(rangeDebutCmd)} au ${fmtDate(rangeFinCmd)}`:'toute la période';
    const entry = { id: uid('trash_'), type:'commandes_reset', label: `Réinitialisation (${labelPeriode}) — ${removed.length} commande(s)`, data: removed, dateSuppression: new Date().toISOString() };
    updateSite({ ...site, commandes: remaining, seq: resetScope === 'tout' ? 1 : site.seq, corbeille: [entry, ...(site.corbeille||[])] });
    setResetScope(null);
    setShowPlageCmd(false);
  }

  const [resetScopeDep, setResetScopeDep] = useState(null); // 'jour' | 'mois' | 'tout'

  const [showPlageDep, setShowPlageDep] = useState(false);
  const [rangeDebutDep, setRangeDebutDep] = useState(todayISO());
  const [rangeFinDep, setRangeFinDep] = useState(todayISO());

  function countForScopeDep(scope){
    const today = todayISO();
    const depenses = site.depenses || [];
    if(scope === 'jour') return depenses.filter(d => d.date === today).length;
    if(scope === 'mois') return depenses.filter(d => d.date.slice(0,7) === today.slice(0,7)).length;
    if(scope === 'plage') return depenses.filter(d => d.date >= rangeDebutDep && d.date <= rangeFinDep).length;
    return depenses.length;
  }

  function resetDepenses(){
    if(!resetScopeDep) return;
    const today = todayISO();
    const depenses = site.depenses || [];
    let removed, remaining;
    if(resetScopeDep === 'jour'){ removed = depenses.filter(d => d.date === today); remaining = depenses.filter(d => d.date !== today); }
    else if(resetScopeDep === 'mois'){ removed = depenses.filter(d => d.date.slice(0,7) === today.slice(0,7)); remaining = depenses.filter(d => d.date.slice(0,7) !== today.slice(0,7)); }
    else if(resetScopeDep === 'plage'){ removed = depenses.filter(d => d.date >= rangeDebutDep && d.date <= rangeFinDep); remaining = depenses.filter(d => !(d.date >= rangeDebutDep && d.date <= rangeFinDep)); }
    else { removed = depenses; remaining = []; }
    const labelPeriode = resetScopeDep==='jour'?"aujourd'hui":resetScopeDep==='mois'?'ce mois-ci':resetScopeDep==='plage'?`du ${fmtDate(rangeDebutDep)} au ${fmtDate(rangeFinDep)}`:'toute la période';
    const entry = { id: uid('trash_'), type:'depenses_reset', label: `Réinitialisation dépenses (${labelPeriode}) — ${removed.length} dépense(s)`, data: removed, dateSuppression: new Date().toISOString() };
    updateSite({ ...site, depenses: remaining, corbeille: [entry, ...(site.corbeille||[])] });
    setResetScopeDep(null);
    setShowPlageDep(false);
  }

  const [resetScopeRem, setResetScopeRem] = useState(null); // 'jour' | 'mois' | 'plage' | 'tout'
  const [showPlageRem, setShowPlageRem] = useState(false);
  const [rangeDebutRem, setRangeDebutRem] = useState(todayISO());
  const [rangeFinRem, setRangeFinRem] = useState(todayISO());

  function countForScopeRem(scope){
    const today = todayISO();
    const remunerations = site.remunerations || [];
    if(scope === 'jour') return remunerations.filter(r => (r.date||'').slice(0,10) === today).length;
    if(scope === 'mois') return remunerations.filter(r => (r.date||'').slice(0,7) === today.slice(0,7)).length;
    if(scope === 'plage') return remunerations.filter(r => (r.date||'').slice(0,10) >= rangeDebutRem && (r.date||'').slice(0,10) <= rangeFinRem).length;
    return remunerations.length;
  }

  function resetRemunerations(){
    if(!resetScopeRem) return;
    const today = todayISO();
    const remunerations = site.remunerations || [];
    let removed, remaining;
    if(resetScopeRem === 'jour'){ removed = remunerations.filter(r => (r.date||'').slice(0,10) === today); remaining = remunerations.filter(r => (r.date||'').slice(0,10) !== today); }
    else if(resetScopeRem === 'mois'){ removed = remunerations.filter(r => (r.date||'').slice(0,7) === today.slice(0,7)); remaining = remunerations.filter(r => (r.date||'').slice(0,7) !== today.slice(0,7)); }
    else if(resetScopeRem === 'plage'){ removed = remunerations.filter(r => (r.date||'').slice(0,10) >= rangeDebutRem && (r.date||'').slice(0,10) <= rangeFinRem); remaining = remunerations.filter(r => !((r.date||'').slice(0,10) >= rangeDebutRem && (r.date||'').slice(0,10) <= rangeFinRem)); }
    else { removed = remunerations; remaining = []; }
    const labelPeriode = resetScopeRem==='jour'?"aujourd'hui":resetScopeRem==='mois'?'ce mois-ci':resetScopeRem==='plage'?`du ${fmtDate(rangeDebutRem)} au ${fmtDate(rangeFinRem)}`:'toute la période';
    const entry = { id: uid('trash_'), type:'remunerations_reset', label: `Réinitialisation rémunérations (${labelPeriode}) — ${removed.length} entrée(s)`, data: removed, dateSuppression: new Date().toISOString() };
    updateSite({ ...site, remunerations: remaining, corbeille: [entry, ...(site.corbeille||[])] });
    setResetScopeRem(null);
    setShowPlageRem(false);
  }

  // Changement mot de passe gérant
  const [ancienPass, setAncienPass] = useState('');
  const [nouveauPass, setNouveauPass] = useState('');
  const [confirmPass, setConfirmPass] = useState('');
  const [showPassFields, setShowPassFields] = useState(false);
  const [passError, setPassError] = useState('');
  const [passFlash, setPassFlash] = useState(false);

  function changePassGerant(){
    if(ancienPass !== getPassGerant(db)){ setPassError('Ancien mot de passe incorrect.'); return; }
    if(nouveauPass.length < 6){ setPassError('Le nouveau mot de passe doit contenir au moins 6 caractères.'); return; }
    if(nouveauPass !== confirmPass){ setPassError('Les deux mots de passe ne correspondent pas.'); return; }
    setDb({ ...db, passGerant: nouveauPass });
    setPassError('');
    setAncienPass(''); setNouveauPass(''); setConfirmPass('');
    setPassFlash(true);
    setTimeout(()=>{ setPassFlash(false); setShowPassFields(false); }, 2000);
  }

  // Config SMS — stockée dans le site
  const smsConfig = site.smsConfig || { provider: 'none', apiKey: '', apiSecret: '', senderId: '' };
  const [smsProvider, setSmsProvider] = useState(smsConfig.provider || 'none');
  const [smsApiKey, setSmsApiKey] = useState(smsConfig.apiKey || '');
  const [smsApiSecret, setSmsApiSecret] = useState(smsConfig.apiSecret || '');
  const [smsSenderId, setSmsSenderId] = useState(smsConfig.senderId || '');
  const [smsFlash, setSmsFlash] = useState(false);
  const [smsTest, setSmsTest] = useState('');
  const [smsTestResult, setSmsTestResult] = useState('');

  function save(){
    updateSite({ ...site, nom, adresse, tel, code: code.trim().toUpperCase() || site.code });
    setSavedFlash(true);
    setTimeout(()=>setSavedFlash(false), 1800);
  }

  function saveSMS(){
    updateSite({ ...site, smsConfig: { provider: smsProvider, apiKey: smsApiKey, apiSecret: smsApiSecret, senderId: smsSenderId } });
    setSmsFlash(true);
    setTimeout(()=>setSmsFlash(false), 1800);
  }

  async function testSMS(){
    if(!smsTest.trim()) return;
    setSmsTestResult('Envoi en cours…');
    try {
      if(smsProvider === 'africas_talking'){
        const resp = await fetch('https://api.africastalking.com/version1/messaging', {
          method: 'POST',
          headers: { 'apiKey': smsApiKey, 'Content-Type': 'application/x-www-form-urlencoded', 'Accept': 'application/json' },
          body: new URLSearchParams({ username: smsApiSecret, to: smsTest, message: `Test SMS Maci Pressing - ${site.nom}`, from: smsSenderId || undefined })
        });
        const data = await resp.json();
        setSmsTestResult(data.SMSMessageData?.Message || 'Envoyé !');
      } else if(smsProvider === 'twilio'){
        const creds = btoa(`${smsApiKey}:${smsApiSecret}`);
        const resp = await fetch(`https://api.twilio.com/2010-04-01/Accounts/${smsApiKey}/Messages.json`, {
          method: 'POST',
          headers: { 'Authorization': `Basic ${creds}`, 'Content-Type': 'application/x-www-form-urlencoded' },
          body: new URLSearchParams({ To: smsTest, From: smsSenderId, Body: `Test SMS Maci Pressing - ${site.nom}` })
        });
        const data = await resp.json();
        setSmsTestResult(data.status || data.message || 'Envoyé !');
      } else {
        setSmsTestResult('Aucun fournisseur SMS configuré.');
      }
    } catch(e) {
      setSmsTestResult('Erreur : ' + e.message);
    }
  }

  const providers = [
    { val: 'none', label: 'Désactivé', desc: 'Pas de SMS automatique' },
    { val: 'whatsapp', label: 'WhatsApp', desc: 'Gratuit — déjà actif via les boutons 📱', active: true },
    { val: 'africas_talking', label: "Africa's Talking", desc: 'Spécialisé Afrique — plan test gratuit disponible sur africastalking.com' },
    { val: 'twilio', label: 'Twilio', desc: 'International — ~0.01$/SMS, essai gratuit sur twilio.com' },
    { val: 'orange', label: 'Orange SMS API', desc: 'Orange Guinée — nécessite un contrat professionnel avec Orange Business' },
  ];

  return (
    <div>
      <PageHeader title="Paramètres" subtitle="Informations de l'établissement, services et SMS" />

      <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:18, marginBottom:18}}>
        <div className="card" style={{padding:'1.5rem'}}>
          <h3 style={{margin:'0 0 16px', fontSize:15}}>Établissement</h3>
          <div style={{display:'grid', gap:12}}>
            <div><label>Nom</label><input type="text" value={nom} onChange={e=>setNom(e.target.value)} /></div>
            <div><label>Adresse</label><input type="text" value={adresse} onChange={e=>setAdresse(e.target.value)} /></div>
            <div><label>Téléphone</label><input type="text" value={tel} onChange={e=>setTel(e.target.value)} /></div>
            <div>
              <label>Préfixe des tickets</label>
              <input type="text" value={code} onChange={e=>setCode(e.target.value.toUpperCase())} maxLength={8} placeholder="ex: KIPE" />
              <p style={{fontSize:11.5, color:'var(--steam)', margin:'5px 0 0', lineHeight:1.4}}>
                Apparaît devant chaque numéro de ticket (ex: {code || site.code}-2607-0001). Utile pour distinguer les tickets entre vos pressings.
              </p>
              {site.commandes.length > 0 && (
                <button className="btn btn-ghost btn-sm" style={{marginTop:8, color:'var(--rust)'}} onClick={()=>setShowRenameConfirm(true)}>
                  Renommer les {site.commandes.length} ticket(s) déjà créés avec « {code || site.code} »
                </button>
              )}
              {renameFlash && <p style={{color:'var(--ok)', fontSize:13, marginTop:6, display:'flex', alignItems:'center', gap:6}}><Icon name="check" size={14}/> Tickets renommés !</p>}
            </div>
            <button className="btn btn-rust" onClick={save} style={{justifySelf:'start'}}>
              {savedFlash ? <><Icon name="check" size={14}/> Enregistré</> : 'Enregistrer'}
            </button>
          </div>
        </div>

        <ServicesEditor site={site} updateSite={updateSite} db={db} />
      </div>

      {/* Changement mot de passe gérant */}
      <div className="card" style={{padding:'1.5rem', marginTop:18}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom: showPassFields ? 14 : 0}}>
          <h3 style={{margin:0, fontSize:15, display:'flex', alignItems:'center', gap:8}}>
            🔐 Mot de passe gérant
          </h3>
          <button className="btn btn-sm" onClick={()=>{ setShowPassFields(!showPassFields); setPassError(''); }}>
            {showPassFields ? 'Annuler' : 'Changer le mot de passe'}
          </button>
        </div>
        {passFlash && <p style={{color:'var(--ok)', fontWeight:600, margin:0}}><Icon name="check" size={14}/> Mot de passe modifié avec succès !</p>}
        {showPassFields && (
          <div style={{display:'grid', gap:12}}>
            <div>
              <label>Ancien mot de passe</label>
              <input type="password" value={ancienPass} onChange={e=>setAncienPass(e.target.value)} placeholder="Votre mot de passe actuel" />
            </div>
            <div>
              <label>Nouveau mot de passe</label>
              <input type="password" value={nouveauPass} onChange={e=>setNouveauPass(e.target.value)} placeholder="Au moins 6 caractères" />
            </div>
            <div>
              <label>Confirmer le nouveau mot de passe</label>
              <input type="password" value={confirmPass} onChange={e=>setConfirmPass(e.target.value)} placeholder="Répétez le nouveau mot de passe" />
            </div>
            {passError && <p style={{color:'var(--danger)', fontSize:13, margin:0}}>{passError}</p>}
            <button className="btn btn-rust" style={{justifySelf:'start'}} onClick={changePassGerant} disabled={!ancienPass||!nouveauPass||!confirmPass}>
              Enregistrer le nouveau mot de passe
            </button>
          </div>
        )}
      </div>

      {/* Réinitialiser les commandes (nouveau mois / nouvelle période) */}
      <div className="card" style={{padding:'1.5rem', marginTop:18, borderColor:'var(--danger)'}}>
        <h3 style={{margin:'0 0 6px', fontSize:15, display:'flex', alignItems:'center', gap:8, color:'var(--danger)'}}>
          🗓️ Réinitialiser les commandes de ce site
        </h3>
        <p style={{fontSize:13, color:'var(--steam)', margin:'0 0 14px', lineHeight:1.6}}>
          Choisissez la période à effacer pour « {site.nom} ».

function ServicesEditor({ site, updateSite, db }){
  const [nom, setNom] = useState('');
  const [prix, setPrix] = useState('');
  const [categorie, setCategorie] = useState('Nettoyage');
  const [editingId, setEditingId] = useState(null);
  const [editNom, setEditNom] = useState('');
  const [editPrix, setEditPrix] = useState('');
  const [editCategorie, setEditCategorie] = useState('Nettoyage');
  const [confirmSvc, setConfirmSvc] = useState(null);

  function addService(){
    if(!nom.trim() || !prix) return;
    updateSite({ ...site, services: [...site.services, { id: uid('svc_'), nom: nom.trim(), prix: Number(prix), categorie }] });
    setNom(''); setPrix('');
  }
  function removeService(id){
    const svc = site.services.find(s=>s.id===id);
    const entry = { id: uid('trash_'), type:'service', label: svc ? `Service : ${svc.nom}` : 'Service', data: svc, dateSuppression: new Date().toISOString() };
    updateSite({ ...site, services: site.services.filter(s=>s.id!==id), corbeille: [entry, ...(site.corbeille||[])] });
  }
  function startEdit(s){
    setEditingId(s.id);
    setEditNom(s.nom);
    setEditPrix(String(s.prix));
    setEditCategorie(s.categorie);
  }
  function cancelEdit(){
    setEditingId(null);
  }
  function saveEdit(){
    if(!editNom.trim() || editPrix === '') return;
    updateSite({
      ...site,
      services: site.services.map(s => s.id === editingId ? { ...s, nom: editNom.trim(), prix: Number(editPrix), categorie: editCategorie } : s)
    });
    setEditingId(null);
  }

  return (
    <div className="card" style={{padding:'1.5rem'}}>
      <h3 style={{margin:'0 0 16px', fontSize:15}}>Services & tarifs</h3>
      <div style={{maxHeight:320, overflowY:'auto', marginBottom:14}}>
        {site.services.map(s => (
          editingId === s.id ? (
            <div key={s.id} style={{display:'grid', gridTemplateColumns:'1.3fr 0.9fr 1fr auto auto', gap:6, alignItems:'center', padding:'8px 0', borderBottom:'1px solid var(--line)'}}>
              <input type="text" value={editNom} onChange={e=>setEditNom(e.target.value)} style={{padding:'6px 8px', fontSize:13}} />
              <input type="number" value={editPrix} onChange={e=>setEditPrix(e.target.value)} style={{padding:'6px 8px', fontSize:13}} />
              <select value={editCategorie} onChange={e=>setEditCategorie(e.target.value)} style={{padding:'6px 8px', fontSize:13}}>
                <option>Nettoyage complet</option>
                <option>Repassage</option>
                <option>Nettoyage + Repassage</option>
                <option>Retouche</option>
                <option>Maison</option>
                <option>Autres</option>
              </select>
              <button className="btn btn-sm" style={{padding:'5px 9px'}} onClick={saveEdit}><Icon name="check" size={13}/></button>
              <button className="btn btn-ghost btn-sm" style={{padding:'5px 9px'}} onClick={cancelEdit}><Icon name="x" size={13}/></button>
            </div>
          ) : (
            <div key={s.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'6px 0', borderBottom:'1px solid var(--line)', fontSize:13.5}}>
              <span>{s.nom} <span style={{color:'var(--steam)', fontSize:12}}>· {s.categorie}</span></span>
              <div style={{display:'flex', alignItems:'center', gap:6}}>
                <span className="mono">{fmtGNF(s.prix)}</span>
                <button className="btn btn-ghost btn-sm" style={{padding:'4px 7px'}} onClick={()=>startEdit(s)} aria-label="Modifier"><Icon name="edit" size={13}/></button>
                <button className="btn btn-ghost btn-sm" style={{padding:'4px 7px', color:'var(--danger)'}} onClick={()=>setConfirmSvc(s)} aria-label="Supprimer"><Icon name="trash" size={13}/></button>
              </div>
            </div>
          )
        ))}
      </div>
      <div style={{display:'grid', gridTemplateColumns:'1.4fr 0.8fr 1fr', gap:8}}>
        <input type="text" placeholder="Nom du service" value={nom} onChange={e=>setNom(e.target.value)} />
        <input type="number" placeholder="Prix (GNF)" value={prix} onChange={e=>setPrix(e.target.value)} />
        <select value={categorie} onChange={e=>setCategorie(e.target.value)}>
          <option>Nettoyage complet</option>
          <option>Repassage</option>
          <option>Nettoyage + Repassage</option>
          <option>Retouche</option>
          <option>Maison</option>
          <option>Autres</option>
        </select>
      </div>
      <button className="btn btn-rust btn-sm" style={{marginTop:10}} onClick={addService} disabled={!nom.trim()||!prix}>
        <Icon name="plus" size={13}/> Ajouter
      </button>
      {confirmSvc && <ConfirmDelete db={db}
        message={`Supprimer le service « ${confirmSvc.nom} » (${fmtGNF(confirmSvc.prix)}) ?`}
        onConfirm={()=>{ removeService(confirmSvc.id); setConfirmSvc(null); }}
        onCancel={()=>setConfirmSvc(null)}
      />}
    </div>
  );
}

function PaiementsAValiderView({ site, updateSite, employeId }){
  const remunerations = site.remunerations || [];

  const paiementsAValider = useMemo(() => {
    return remunerations
      .filter(r => r.employeId === employeId && r.type !== 'livraison' && r.statutPaiement === 'paye' && !r.valideParRepasseur)
      .sort((a,b) => new Date(b.date) - new Date(a.date));
  }, [remunerations, employeId]);

  const paiementsConfirmes = useMemo(() => {
    return remunerations
      .filter(r => r.employeId === employeId && r.type !== 'livraison' && r.valideParRepasseur)
      .sort((a,b) => new Date(b.dateValidationRepasseur||b.date) - new Date(a.dateValidationRepasseur||a.date))
      .slice(0, 10);
  }, [remunerations, employeId]);

  function validerReception(rem){
    const nextRemunerations = remunerations.map(r => r.id === rem.id
      ? { ...r, valideParRepasseur: true, dateValidationRepasseur: new Date().toISOString() }
      : r);
    updateSite({ ...site, remunerations: nextRemunerations });
  }

  return (
    <div>
      <PageHeader title="Suivi repassage" subtitle="Confirmez les paiements reçus du caissier" />

      {paiementsAValider.length === 0 ? (
        <div className="card" style={{padding:'1.25rem', textAlign:'center', color:'var(--steam)', fontSize:13, marginBottom:20}}>
          Aucun paiement en attente de confirmation.
        </div>
      ) : (
        <div className="card" style={{padding:'1.25rem', marginBottom:20, borderColor:'var(--warn)'}}>
          <h3 style={{margin:'0 0 4px', fontSize:15}}>💰 Paiements à confirmer</h3>
          <p style={{fontSize:12.5, color:'var(--steam)', margin:'0 0 12px'}}>Le caissier indique vous avoir payé — confirmez que vous avez bien reçu l'argent.</p>
          <div style={{display:'grid', gap:8}}>
            {paiementsAValider.map(r => (
              <div key={r.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, padding:'10px 12px', background:'var(--warn-light)', borderRadius:8, flexWrap:'wrap'}}>
                <div style={{fontSize:13}}>
                  <span style={{fontWeight:600}}>{fmtGNF(r.montant)}</span> — {r.type === 'repassage' ? '👔 Repassage' : '🚗 Livraison'} du {fmtDate(r.date)}
                  <span className="tag" style={{marginLeft:8, background: r.modePaiementRepasseur==='Orange Money' ? '#FFF3E0' : 'var(--pine-light)', color: r.modePaiementRepasseur==='Orange Money' ? '#E65100' : 'var(--pine)'}}>{r.modePaiementRepasseur}</span>
                </div>
                <button className="btn btn-rust btn-sm" onClick={()=>validerReception(r)}>J'ai bien reçu</button>
              </div>
            ))}
          </div>
        </div>
      )}

      {paiementsConfirmes.length > 0 && (
        <div>
          <h3 style={{margin:'0 0 10px', fontSize:14, color:'var(--steam)'}}>Confirmés récemment</h3>
          <div style={{display:'grid', gap:6}}>
            {paiementsConfirmes.map(r => (
              <div key={r.id} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'8px 10px', background:'var(--paper-2)', borderRadius:8, fontSize:12.5}}>
                <span>{fmtGNF(r.montant)} — {r.type === 'repassage' ? '👔 Repassage' : '🚗 Livraison'} du {fmtDate(r.date)} ({r.modePaiementRepasseur})</span>
                <span className="tag" style={{background:'var(--pine-light)', color:'var(--pine)'}}>✓ Confirmé</span>
              </div>
            ))}
          </div>
        </div>
      )}
    </div>
  );
}

function RepassageApercuView({ site, updateSite }){
  const [periode, setPeriode] = useState('jour');
  const [moisChoisi, setMoisChoisi] = useState(todayISO().slice(0,7));
  const [anneeChoisie, setAnneeChoisie] = useState(Number(todayISO().slice(0,4)));
  const [modeChoisi, setModeChoisi] = useState({});
  const today = todayISO();

  const getWeekDates = () => {
    const d = new Date(today + 'T00:00:00');
    const day = d.getDay() || 7;
    const monday = new Date(d); monday.setDate(d.getDate() - day + 1);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    const toISO = (dt) => dt.toISOString().slice(0,10);
    return { start: toISO(monday), end: toISO(sunday) };
  };
  const semaine = getWeekDates();

  const repassages = useMemo(() => (site.remunerations||[]).filter(r => r.type === 'repassage'), [site.remunerations]);

  const anneesDisponibles = useMemo(() => {
    const set = new Set(repassages.map(r => Number(r.date.slice(0,4))));
    set.add(Number(todayISO().slice(0,4)));
    return Array.from(set).sort((a,b)=>b-a);
  }, [repassages]);

  const moisDisponibles = useMemo(() => {
    const mois = new Set(repassages.map(r => r.date.slice(0,7)));
    mois.add(todayISO().slice(0,7));
    return [...mois].sort().reverse();
  }, [repassages]);

  const filtres = useMemo(() => {
    if(periode === 'jour') return repassages.filter(r => (r.date||'').slice(0,10) === today);
    if(periode === 'semaine') return repassages.filter(r => { const d=(r.date||'').slice(0,10); return d >= semaine.start && d <= semaine.end; });
    if(periode === 'mois') return repassages.filter(r => r.date.slice(0,7) === moisChoisi);
    return repassages.filter(r => Number(r.date.slice(0,4)) === anneeChoisie);
  }, [repassages, periode, today, semaine, moisChoisi, anneeChoisie]);

  const parRepasseur = useMemo(() => {
    const acc = {};
    filtres.forEach(r => {
      const empId = r.employeId || '_inconnu';
      const empNom = (site.employes.find(e=>e.id===r.employeId)||{}).nom || 'Employé inconnu';
      if(!acc[empId]) acc[empId] = { nom: empNom, totalMontant:0, totalArticles:0, articles:{}, entrees:[] };
      acc[empId].totalMontant += Number(r.montant);
      acc[empId].entrees.push(r);
      if(r.detail){
        r.detail.split(', ').forEach(part => {
          const match = part.match(/(\d+)x (.+?) \(/);
          if(match){
            const nom = match[2], qte = Number(match[1]);
            acc[empId].articles[nom] = (acc[empId].articles[nom]||0) + qte;
            acc[empId].totalArticles += qte;
          }
        });
      }
    });
    Object.values(acc).forEach(p => {
      p.entrees.sort((a,b) => new Date(b.date) - new Date(a.date));
      p.nonPayees = p.entrees.filter(r => r.statutPaiement !== 'paye');
      p.payees = p.entrees.filter(r => r.statutPaiement === 'paye');
      p.totalNonPaye = p.nonPayees.reduce((s,r)=>s+Number(r.montant),0);
      p.totalPaye = p.payees.reduce((s,r)=>s+Number(r.montant),0);
      p.totalConfirme = p.payees.filter(r=>r.valideParRepasseur).length;
    });
    return acc;
  }, [filtres, site.employes]);

  function marquerPayeGroupe(empId, mode){
    const p = parRepasseur[empId];
    if(!p || p.nonPayees.length === 0) return;
    const idsAPayer = new Set(p.nonPayees.map(r=>r.id));
    const nowISO = new Date().toISOString();
    const nextRemunerations = (site.remunerations||[]).map(r => idsAPayer.has(r.id)
      ? { ...r, statutPaiement: 'paye', modePaiementRepasseur: mode, datePaiement: nowISO }
      : r);
    updateSite({ ...site, remunerations: nextRemunerations });
  }

  const totalGeneral = filtres.reduce((s,r)=>s+Number(r.montant),0);
  const totalArticlesGeneral = Object.values(parRepasseur).reduce((s,p)=>s+p.totalArticles,0);
  const periodeLabel = periode==='jour' ? "Aujourd'hui" : periode==='semaine' ? 'Cette semaine' : periode==='mois' ? 'Ce mois' : 'Cette année';
  const repasseurIds = Object.keys(parRepasseur);

  return (
    <div className="card" style={{padding:'1.5rem', marginBottom:20}}>
      <h3 style={{margin:'0 0 4px', fontSize:15}}>👔 Suivi repassage</h3>
      <p style={{fontSize:12.5, color:'var(--steam)', margin:'0 0 14px'}}>Articles repassés, totaux, et paiement des repasseurs — groupé par période</p>

      <div style={{display:'flex', gap:8, marginBottom:16, flexWrap:'wrap', alignItems:'center'}}>
        {['jour','semaine','mois','annee'].map(v => (
          <button key={v} className="btn btn-sm" onClick={()=>setPeriode(v)}
            style={{background:periode===v?'var(--pine)':'transparent', color:periode===v?'var(--white)':'var(--ink)', borderColor:periode===v?'var(--pine)':'var(--line-strong)'}}>
            {v === 'jour' ? "Aujourd'hui" : v === 'semaine' ? 'Cette semaine' : v === 'mois' ? 'Ce mois' : 'Cette année'}
          </button>
        ))}
        {periode === 'mois' && (
          <select value={moisChoisi} onChange={e=>setMoisChoisi(e.target.value)} style={{width:'auto', minWidth:160}}>
            {moisDisponibles.map(m => <option key={m} value={m}>{formatMoisAnnee(m)}</option>)}
          </select>
        )}
        {periode === 'annee' && (
          <select value={anneeChoisie} onChange={e=>setAnneeChoisie(Number(e.target.value))} style={{width:'auto', minWidth:100}}>
            {anneesDisponibles.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
        )}
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:14, marginBottom:20}}>
        <StatCard label={`Total articles repassés — ${periodeLabel}`} value={totalArticlesGeneral} icon="shirt" />
        <StatCard label={`Total — ${periodeLabel}`} value={fmtGNF(totalGeneral)} icon="euro" />
      </div>

      {repasseurIds.length === 0 ? (
        <div className="card" style={{padding:'1.25rem', textAlign:'center', color:'var(--steam)', fontSize:13}}>
          Aucun repassage enregistré sur cette période.
        </div>
      ) : repasseurIds.map(empId => {
        const p = parRepasseur[empId];
        const articlesList = Object.entries(p.articles);
        const modeSel = modeChoisi[empId] || 'Espèces';
        return (
          <div key={empId} className="card" style={{padding:'1.25rem', marginBottom:14}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:10}}>
              <h3 style={{margin:0, fontSize:15}}>👔 {p.nom}</h3>
              <span className="mono" style={{fontWeight:700, color:'var(--pine)'}}>{fmtGNF(p.totalMontant)}</span>
            </div>
            {articlesList.length > 0 && (
              <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(140px, 1fr))', gap:8, marginBottom:14}}>
                {articlesList.map(([nomArticle, qte]) => (
                  <div key={nomArticle} style={{background:'var(--paper-2)', borderRadius:8, padding:'8px 10px', display:'flex', justifyContent:'space-between'}}>
                    <span style={{fontSize:13}}>{nomArticle}</span>
                    <span className="mono" style={{fontSize:13, fontWeight:600}}>{qte}x</span>
                  </div>
                ))}
              </div>
            )}

            <div style={{fontSize:12, color:'var(--steam)', marginBottom:6, fontWeight:600, textTransform:'uppercase'}}>Paiement — {periodeLabel}</div>

            {p.totalPaye > 0 && (
              <div style={{display:'flex', alignItems:'center', gap:8, marginBottom:8, flexWrap:'wrap'}}>
                <span className="tag" style={{background:'var(--pine-light)', color:'var(--pine)'}}>✓ Déjà payé : {fmtGNF(p.totalPaye)}</span>
                <span style={{fontSize:12, color:'var(--steam)'}}>({p.totalConfirme}/{p.payees.length} confirmé(s) par le repasseur)</span>
              </div>
            )}

            {p.nonPayees.length > 0 ? (
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, padding:'10px 12px', background:'var(--warn-light)', borderRadius:8, flexWrap:'wrap'}}>
                <div style={{fontSize:13}}>
                  <span style={{fontWeight:600}}>{fmtGNF(p.totalNonPaye)}</span> à payer ({p.nonPayees.length} prestation(s) — {periodeLabel.toLowerCase()})
                </div>
                <div style={{display:'flex', alignItems:'center', gap:6}}>
                  <select value={modeSel} onChange={e=>setModeChoisi(prev=>({...prev, [empId]: e.target.value}))} style={{width:'auto', fontSize:12.5, padding:'4px 8px'}}>
                    <option value="Espèces">Espèces</option>
                    <option value="Orange Money">Orange Money</option>
                  </select>
                  <button className="btn btn-rust btn-sm" onClick={()=>marquerPayeGroupe(empId, modeSel)}>Marquer {periodeLabel.toLowerCase()} payé</button>
                </div>
              </div>
            ) : (
              <p style={{fontSize:12.5, color:'var(--steam)', margin:0}}>Tout est payé pour cette période.</p>
            )}
          </div>
        );
      })}
    </div>
  );
}

function PerformanceCaissiersView({ site }){
  const [periode, setPeriode] = useState('jour');
  const [moisChoisi, setMoisChoisi] = useState(todayISO().slice(0,7));
  const [anneeChoisie, setAnneeChoisie] = useState(Number(todayISO().slice(0,4)));

  const today = todayISO();
  const getWeekDates = () => {
    const d = new Date(today + 'T00:00:00');
    const day = d.getDay() || 7;
    const monday = new Date(d); monday.setDate(d.getDate() - day + 1);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    const toISO = (dt) => dt.toISOString().slice(0,10);
    return { start: toISO(monday), end: toISO(sunday) };
  };
  const week = getWeekDates();

  const commandesPeriode = useMemo(() => {
    return (site.commandes||[]).filter(c => {
      const d = (c.dateCreation||'').slice(0,10);
      if(periode === 'jour') return d === today;
      if(periode === 'semaine') return d >= week.start && d <= week.end;
      if(periode === 'mois') return d.slice(0,7) === moisChoisi;
      return d.slice(0,4) === String(anneeChoisie);
    });
  }, [site.commandes, periode, today, week, moisChoisi, anneeChoisie]);

  const anneesDisponibles = useMemo(() => {
    const currentYear = Number(todayISO().slice(0,4));
    const arr = [];
    for(let y = currentYear; y >= ANNEE_DEBUT_APP - 10; y--) arr.push(y);
    return arr;
  }, []);

  const parCaissier = useMemo(() => {
    const acc = {};
    const caissiers = (site.employes||[]).filter(e => e.role !== 'Repasseur');
    caissiers.forEach(e => { acc[e.id] = { nom: e.nom, nbCommandes: 0, totalCA: 0, nbArticles: 0, nbClients: new Set() }; });
    acc['_gerant'] = { nom: 'Gérant', nbCommandes: 0, totalCA: 0, nbArticles: 0, nbClients: new Set() };
    commandesPeriode.forEach(c => {
      const key = c.caissierEmpId && acc[c.caissierEmpId] ? c.caissierEmpId : '_gerant';
      acc[key].nbCommandes += 1;
      acc[key].totalCA += calcCommandeTotal(c, site.services);
      acc[key].nbArticles += c.lignes.reduce((s,l)=>s+l.qte,0);
      if(c.clientId) acc[key].nbClients.add(c.clientId);
    });
    return Object.entries(acc)
      .map(([id, v]) => ({ id, ...v, nbClients: v.nbClients.size }))
      .filter(v => v.nbCommandes > 0)
      .sort((a,b) => b.totalCA - a.totalCA);
  }, [commandesPeriode, site.employes, site.services]);

  const totalCommandes = commandesPeriode.length;
  const totalCA = commandesPeriode.reduce((s,c)=>s+calcCommandeTotal(c, site.services),0);
  const periodeLabel = periode==='jour' ? "Aujourd'hui" : periode==='semaine' ? 'Cette semaine' : periode==='mois' ? 'Ce mois' : 'Cette année';

  return (
    <div>
      <PageHeader title="Performance caissiers" subtitle="Commandes générées par chaque caissier" />

      <div style={{display:'flex', gap:8, marginBottom:16, flexWrap:'wrap', alignItems:'center'}}>
        {['jour','semaine','mois','annee'].map(v => (
          <button key={v} className="btn btn-sm" onClick={()=>setPeriode(v)}
            style={{background:periode===v?'var(--pine)':'transparent', color:periode===v?'var(--white)':'var(--ink)', borderColor:periode===v?'var(--pine)':'var(--line-strong)'}}>
            {v === 'jour' ? "Aujourd'hui" : v === 'semaine' ? 'Cette semaine' : v === 'mois' ? 'Ce mois' : 'Cette année'}
          </button>
        ))}
        {periode === 'mois' && (
          <input type="month" value={moisChoisi} onChange={e=>setMoisChoisi(e.target.value)} style={{width:'auto'}} />
        )}
        {periode === 'annee' && (
          <select value={anneeChoisie} onChange={e=>setAnneeChoisie(Number(e.target.value))} style={{width:'auto', minWidth:100}}>
            {anneesDisponibles.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
        )}
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:14, marginBottom:20}}>
        <StatCard label={`Commandes générées — ${periodeLabel}`} value={totalCommandes} icon="ticket" />
        <StatCard label={`Chiffre d'affaires généré — ${periodeLabel}`} value={fmtGNF(totalCA)} icon="euro" />
      </div>

      {parCaissier.length === 0 ? (
        <div className="card" style={{padding:'1.25rem', textAlign:'center', color:'var(--steam)', fontSize:13}}>
          Aucune commande créée sur cette période.
        </div>
      ) : (
        <div className="card" style={{overflow:'hidden'}}>
          <table style={{width:'100%', borderCollapse:'collapse', fontSize:13.5}}>
            <thead>
              <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
                <th style={th}>Caissier</th>
                <th style={th}>Commandes créées</th>
                <th style={th}>Articles traités</th>
                <th style={th}>Clients servis</th>
                <th style={th}>Chiffre d'affaires généré</th>
                <th style={th}>Panier moyen</th>
              </tr>
            </thead>
            <tbody>
              {parCaissier.map(c => (
                <tr key={c.id} style={{borderTop:'1px solid var(--line)'}}>
                  <td style={{...td, fontWeight:600}}>{c.nom}</td>
                  <td style={td} className="mono">{c.nbCommandes}</td>
                  <td style={td} className="mono">{c.nbArticles}</td>
                  <td style={td} className="mono">{c.nbClients}</td>
                  <td style={{...td, fontWeight:700, color:'var(--pine)'}} className="mono">{fmtGNF(c.totalCA)}</td>
                  <td style={td} className="mono">{fmtGNF(c.nbCommandes>0 ? c.totalCA/c.nbCommandes : 0)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function EncaissementsGerantView({ site }){
  const [periode, setPeriode] = useState('jour');
  const [moisChoisi, setMoisChoisi] = useState(todayISO().slice(0,7));
  const [anneeChoisie, setAnneeChoisie] = useState(Number(todayISO().slice(0,4)));

  const today = todayISO();
  const getWeekDates = () => {
    const d = new Date(today + 'T00:00:00');
    const day = d.getDay() || 7;
    const monday = new Date(d); monday.setDate(d.getDate() - day + 1);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    const toISO = (dt) => dt.toISOString().slice(0,10);
    return { start: toISO(monday), end: toISO(sunday) };
  };
  const week = getWeekDates();

  // Tous les paiements réellement encaissés, avec l'employé attribué
  const tousPaiements = useMemo(() => {
    const liste = [];
    (site.commandes||[]).forEach(c => {
      getPaiementsCommande(c).forEach(pmt => {
        if(!pmt.date) return;
        const employeAttribue = pmt.employeId != null ? pmt.employeId : (c.caissierEmpId || null);
        liste.push({
          id: pmt.id || `${c.id}_${pmt.date}`,
          date: pmt.date,
          jour: pmt.date.slice(0,10),
          mois: pmt.date.slice(0,7),
          annee: Number(pmt.date.slice(0,4)),
          ticket: c.numero,
          employeId: employeAttribue,
          mode: pmt.mode || 'Espèces',
          montant: Number(pmt.montant)
        });
      });
    });
    return liste;
  }, [site]);

  const anneesDisponibles = useMemo(() => {
    const set = new Set(tousPaiements.map(p => p.annee));
    const currentYear = Number(todayISO().slice(0,4));
    for(let y = currentYear; y >= ANNEE_DEBUT_APP - 3; y--) set.add(y);
    return Array.from(set).sort((a,b)=>b-a);
  }, [tousPaiements]);

  function estAvantSeuil(annee, mois){
    return annee < 2026 || (annee === 2026 && mois < 9);
  }

  // Montant manuel Espèces/Orange Money pour UN employé sur UN mois donné (si mois avant seuil)
  function montantManuelEmploye(employeId, anneeNum, moisNum){
    if(!estAvantSeuil(anneeNum, moisNum)) return { especes: 0, orangeMoney: 0 };
    const moisStr = String(moisNum);
    const parEmploye = normaliserMoisManuel(((site.detailMensuelManuel||{})[anneeNum]||{})[moisStr]) || {};
    const v = parEmploye[employeId] || {};
    return { especes: Number(v.montantRecuEspeces)||0, orangeMoney: Number(v.montantRecuOrangeMoney)||0 };
  }

  // Pour un employé + une période (jour/semaine/mois), total réel + manuel combiné
  function totauxEmployePeriode(employeId){
    let filtres;
    if(periode === 'jour') filtres = tousPaiements.filter(p => p.employeId === employeId && p.jour === today);
    else if(periode === 'semaine') filtres = tousPaiements.filter(p => p.employeId === employeId && p.jour >= week.start && p.jour <= week.end);
    else filtres = tousPaiements.filter(p => p.employeId === employeId && p.mois === moisChoisi);
    let especes = filtres.filter(p=>p.mode==='Espèces').reduce((s,p)=>s+p.montant,0);
    let orangeMoney = filtres.filter(p=>p.mode==='Orange Money').reduce((s,p)=>s+p.montant,0);
    if(periode === 'mois'){
      const [a,m] = moisChoisi.split('-').map(Number);
      const manuel = montantManuelEmploye(employeId, a, m);
      especes += manuel.especes; orangeMoney += manuel.orangeMoney;
    }
    return { especes, orangeMoney, total: especes + orangeMoney };
  }

  // Pour un employé + une année, détail des 12 mois (réel + manuel combiné)
  function detailAnneeEmploye(employeId){
    return Array.from({length:12}, (_,i) => {
      const moisNum = i+1;
      const moisStr = `${anneeChoisie}-${String(moisNum).padStart(2,'0')}`;
      const reels = tousPaiements.filter(p => p.employeId === employeId && p.mois === moisStr);
      let especes = reels.filter(p=>p.mode==='Espèces').reduce((s,p)=>s+p.montant,0);
      let orangeMoney = reels.filter(p=>p.mode==='Orange Money').reduce((s,p)=>s+p.montant,0);
      const manuel = montantManuelEmploye(employeId, anneeChoisie, moisNum);
      especes += manuel.especes; orangeMoney += manuel.orangeMoney;
      const label = new Date(anneeChoisie, i, 15).toLocaleDateString('fr-FR', {month:'long'});
      return { mois: moisNum, label, especes, orangeMoney, total: especes + orangeMoney };
    });
  }

  const employesListe = (site.employes || []).filter(e => e.role !== 'Repasseur');
  const periodeLabel = periode==='jour' ? "Aujourd'hui" : periode==='semaine' ? 'Cette semaine' : periode==='mois' ? 'Ce mois' : 'Cette année';

  const totalGeneralPeriode = periode === 'annee'
    ? employesListe.reduce((s,e) => s + detailAnneeEmploye(e.id).reduce((s2,m)=>s2+m.total,0), 0)
    : employesListe.reduce((s,e) => s + totauxEmployePeriode(e.id).total, 0);

  return (
    <div>
      <PageHeader title="Encaissements" subtitle="Argent reçu par employé, par mode de paiement" />

      <div style={{display:'flex', gap:8, marginBottom:16, flexWrap:'wrap', alignItems:'center'}}>
        {['jour','semaine','mois','annee'].map(v => (
          <button key={v} className="btn btn-sm" onClick={()=>setPeriode(v)}
            style={{background:periode===v?'var(--pine)':'transparent', color:periode===v?'var(--white)':'var(--ink)', borderColor:periode===v?'var(--pine)':'var(--line-strong)', textTransform:'capitalize'}}>
            {v === 'jour' ? "Aujourd'hui" : v === 'semaine' ? 'Cette semaine' : v === 'mois' ? 'Ce mois' : 'Cette année'}
          </button>
        ))}
        {periode === 'mois' && (
          <input type="month" value={moisChoisi} onChange={e=>setMoisChoisi(e.target.value)} style={{width:'auto'}} />
        )}
        {periode === 'annee' && (
          <select value={anneeChoisie} onChange={e=>setAnneeChoisie(Number(e.target.value))} style={{width:'auto', minWidth:100}}>
            {anneesDisponibles.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
        )}
      </div>

      <div style={{marginBottom:20}}>
        <StatCard label={`Total tous employés — ${periodeLabel}`} value={fmtGNF(totalGeneralPeriode)} icon="chart" />
      </div>

      {employesListe.length === 0 ? (
        <div className="card" style={{padding:'1.25rem', textAlign:'center', color:'var(--steam)', fontSize:13}}>
          Aucun employé enregistré.
        </div>
      ) : periode !== 'annee' ? (
        employesListe.map(emp => {
          const t = totauxEmployePeriode(emp.id);
          return (
            <div key={emp.id} className="card" style={{padding:'1.1rem 1.25rem', marginBottom:12}}>
              <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:8}}>
                <h3 style={{margin:0, fontSize:15}}>{emp.nom}</h3>
                <span className="mono" style={{fontWeight:700, color:'var(--pine)'}}>{fmtGNF(t.total)}</span>
              </div>
              <div style={{display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:8}}>
                <div style={{background:'var(--paper-2)', borderRadius:8, padding:'8px 10px', display:'flex', justifyContent:'space-between'}}>
                  <span style={{fontSize:12.5, color:'var(--steam)'}}>Espèces</span>
                  <span className="mono" style={{fontSize:13, fontWeight:600}}>{fmtGNF(t.especes)}</span>
                </div>
                <div style={{background:'var(--paper-2)', borderRadius:8, padding:'8px 10px', display:'flex', justifyContent:'space-between'}}>
                  <span style={{fontSize:12.5, color:'var(--steam)'}}>Orange Money</span>
                  <span className="mono" style={{fontSize:13, fontWeight:600}}>{fmtGNF(t.orangeMoney)}</span>
                </div>
              </div>
            </div>
          );
        })

function MesEncaissementsView({ site, employeId }){
  const [periode, setPeriode] = useState('jour');
  const [moisChoisi, setMoisChoisi] = useState(todayISO().slice(0,7));
  const [anneeChoisie, setAnneeChoisie] = useState(Number(todayISO().slice(0,4)));

  const today = todayISO();
  const getWeekDates = () => {
    const d = new Date(today + 'T00:00:00');
    const day = d.getDay() || 7;
    const monday = new Date(d); monday.setDate(d.getDate() - day + 1);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    const toISO = (dt) => dt.toISOString().slice(0,10);
    return { start: toISO(monday), end: toISO(sunday) };
  };
  const week = getWeekDates();

  // Tous les paiements réellement encaissés par ce caissier, avec date/mode/montant
  const mesPaiements = useMemo(() => {
    const liste = [];
    (site.commandes||[]).forEach(c => {
      const client = (site.clients||[]).find(cl => cl.id === c.clientId);
      getPaiementsCommande(c).forEach(pmt => {
        if(!pmt.date) return;
        const employeAttribue = pmt.employeId != null ? pmt.employeId : (c.caissierEmpId || null);
        if(employeAttribue !== employeId) return;
        liste.push({
          id: pmt.id || `${c.id}_${pmt.date}`,
          date: pmt.date,
          jour: pmt.date.slice(0,10),
          mois: pmt.date.slice(0,7),
          annee: Number(pmt.date.slice(0,4)),
          ticket: c.numero,
          client: client ? client.nom : 'Client inconnu',
          mode: pmt.mode || 'Espèces',
          montant: Number(pmt.montant)
        });
      });
    });
    return liste.sort((a,b) => new Date(b.date) - new Date(a.date));
  }, [site, employeId]);

  const anneesDisponibles = useMemo(() => {
    const set = new Set(mesPaiements.map(p => p.annee));
    const currentYear = Number(todayISO().slice(0,4));
    for(let y = currentYear; y >= ANNEE_DEBUT_APP - 3; y--) set.add(y);
    return Array.from(set).sort((a,b)=>b-a);
  }, [mesPaiements]);

  // Montants Espèces/Orange Money saisis manuellement (mois avant le seuil de septembre 2026),
  // à ajouter aux vrais paiements numériques pour ne rien sous-estimer sur les périodes anciennes
  function montantManuel(mois){
    const [anneeStr, moisStr] = mois.split('-');
    const anneeNum = Number(anneeStr), moisNum = Number(moisStr);
    const avantSeuil = anneeNum < 2026 || (anneeNum === 2026 && moisNum < 9);
    if(!avantSeuil) return { especes: 0, orangeMoney: 0 };
    const parEmploye = normaliserMoisManuel(((site.detailMensuelManuel||{})[anneeNum]||{})[String(moisNum)]) || {};
    const v = parEmploye[employeId] || {};
    return { especes: Number(v.montantRecuEspeces)||0, orangeMoney: Number(v.montantRecuOrangeMoney)||0 };
  }
  const moisDeLAnnee = (annee) => Array.from({length:12}, (_,i) => `${annee}-${String(i+1).padStart(2,'0')}`);
  const totalManuelPeriode = useMemo(() => {
    if(periode === 'mois') return montantManuel(moisChoisi);
    if(periode === 'annee') {
      return moisDeLAnnee(anneeChoisie).reduce((acc,m) => {
        const v = montantManuel(m);
        return { especes: acc.especes + v.especes, orangeMoney: acc.orangeMoney + v.orangeMoney };
      }, { especes: 0, orangeMoney: 0 });
    }
    return { especes: 0, orangeMoney: 0 };
  }, [periode, moisChoisi, anneeChoisie, site.detailMensuelManuel, employeId]);

  const paiementsPeriode = useMemo(() => {
    if(periode === 'jour') return mesPaiements.filter(p => p.jour === today);
    if(periode === 'semaine') return mesPaiements.filter(p => p.jour >= week.start && p.jour <= week.end);
    if(periode === 'mois') return mesPaiements.filter(p => p.mois === moisChoisi);
    return mesPaiements.filter(p => p.annee === anneeChoisie);
  }, [mesPaiements, periode, today, week, moisChoisi, anneeChoisie]);

  const totalEspeces = paiementsPeriode.filter(p=>p.mode==='Espèces').reduce((s,p)=>s+p.montant,0) + totalManuelPeriode.especes;
  const totalOrangeMoney = paiementsPeriode.filter(p=>p.mode==='Orange Money').reduce((s,p)=>s+p.montant,0) + totalManuelPeriode.orangeMoney;
  const totalGeneral = totalEspeces + totalOrangeMoney;

  const periodeLabel = periode==='jour' ? "Aujourd'hui" : periode==='semaine' ? 'Cette semaine' : periode==='mois' ? 'Ce mois' : 'Cette année';

  const detailAnneeMois = useMemo(() => {
    if(periode !== 'annee') return [];
    return Array.from({length:12}, (_,i) => {
      const moisNum = i+1;
      const moisStr = `${anneeChoisie}-${String(moisNum).padStart(2,'0')}`;
      const reels = mesPaiements.filter(p => p.mois === moisStr);
      let especes = reels.filter(p=>p.mode==='Espèces').reduce((s,p)=>s+p.montant,0);
      let orangeMoney = reels.filter(p=>p.mode==='Orange Money').reduce((s,p)=>s+p.montant,0);
      const manuel = montantManuel(moisStr);
      especes += manuel.especes; orangeMoney += manuel.orangeMoney;
      const label = new Date(anneeChoisie, i, 15).toLocaleDateString('fr-FR', {month:'long'});
      return { mois: moisNum, label, especes, orangeMoney, total: especes + orangeMoney };
    });
  }, [periode, anneeChoisie, mesPaiements, site.detailMensuelManuel, employeId]);

  return (
    <div>
      <PageHeader title="Mes encaissements" subtitle="Argent que vous avez personnellement reçu, par mode de paiement" />

      <div style={{display:'flex', gap:8, marginBottom:16, flexWrap:'wrap', alignItems:'center'}}>
        {['jour','semaine','mois','annee'].map(v => (
          <button key={v} className="btn btn-sm" onClick={()=>setPeriode(v)}
            style={{background:periode===v?'var(--pine)':'transparent', color:periode===v?'var(--white)':'var(--ink)', borderColor:periode===v?'var(--pine)':'var(--line-strong)', textTransform:'capitalize'}}>
            {v === 'jour' ? "Aujourd'hui" : v === 'semaine' ? 'Cette semaine' : v === 'mois' ? 'Ce mois' : 'Cette année'}
          </button>
        ))}
        {periode === 'mois' && (
          <input type="month" value={moisChoisi} onChange={e=>setMoisChoisi(e.target.value)} style={{width:'auto'}} />
        )}
        {periode === 'annee' && (
          <select value={anneeChoisie} onChange={e=>setAnneeChoisie(Number(e.target.value))} style={{width:'auto', minWidth:100}}>
            {anneesDisponibles.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
        )}
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, marginBottom:8}}>
        <StatCard label="Espèces" value={fmtGNF(totalEspeces)} icon="euro" />
        <StatCard label="Orange Money" value={fmtGNF(totalOrangeMoney)} icon="euro" />
        <StatCard label={`Total — ${periodeLabel}`} value={fmtGNF(totalGeneral)} icon="chart" />
      </div>
      {(totalManuelPeriode.especes > 0 || totalManuelPeriode.orangeMoney > 0) && (
        <p style={{fontSize:11.5, color:'var(--steam)', margin:'0 0 12px'}}>Inclut {fmtGNF(totalManuelPeriode.especes + totalManuelPeriode.orangeMoney)} saisis manuellement dans Détail mensuel pour cette période.</p>
      )}

      {periode === 'annee' && (
        <div className="card" style={{overflow:'hidden', marginBottom:20}}>
          <table style={{width:'100%', borderCollapse:'collapse', fontSize:13}}>
            <thead>
              <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
                <th style={th}>Mois</th>
                <th style={th}>Espèces</th>
                <th style={th}>Orange Money</th>
                <th style={th}>Total</th>
              </tr>
            </thead>
            <tbody>
              {detailAnneeMois.map(m => (
                <tr key={m.mois} style={{borderTop:'1px solid var(--line)'}}>
                  <td style={{...td, textTransform:'capitalize'}}>{m.label}</td>
                  <td style={td} className="mono">{fmtGNF(m.especes)}</td>
                  <td style={td} className="mono">{fmtGNF(m.orangeMoney)}</td>
                  <td style={{...td, fontWeight:600}} className="mono">{fmtGNF(m.total)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}

      <h3 style={{fontSize:14.5, color:'var(--pine)', marginBottom:6}}>Détail des paiements reçus — {periodeLabel}</h3>
      {paiementsPeriode.length === 0 ? (
        <div className="card" style={{padding:'1.25rem', textAlign:'center', color:'var(--steam)', fontSize:13}}>
          Aucun paiement reçu sur cette période.
        </div>
      ) : (
        <div className="card" style={{overflow:'hidden'}}>
          <table style={{width:'100%', borderCollapse:'collapse', fontSize:13}}>
            <thead>
              <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
                <th style={th}>Date</th>
                <th style={th}>Ticket</th>
                <th style={th}>Client</th>
                <th style={th}>Mode</th>
                <th style={th}>Montant</th>
              </tr>
            </thead>
            <tbody>
              {paiementsPeriode.map(p => (
                <tr key={p.id} style={{borderTop:'1px solid var(--line)'}}>
                  <td style={td}>{fmtDateTime(p.date)}</td>
                  <td style={{...td}} className="mono">{p.ticket}</td>
                  <td style={td}>{p.client}</td>
                  <td style={td}>
                    <span className="tag" style={{background: p.mode==='Orange Money' ? '#FFF3E0' : 'var(--paper-2)', color: p.mode==='Orange Money' ? '#E65100' : 'var(--ink)'}}>{p.mode}</span>
                  </td>
                  <td style={{...td, fontWeight:600}} className="mono">{fmtGNF(p.montant)}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

function RemunerationView({ site, updateSite, db, siteId, employeId }){

  const config = site.configRemuneration || { tarifsRepassage: [], zones: [] };
  const tarifsRepassage = config.tarifsRepassage || [];

    return [...(site.commandes||[])]
      .sort((a,b) => new Date(b.dateCreation) - new Date(a.dateCreation))
