      .map(c => ({ id: c.id, numero: c.numero, clientNom: (site.clients.find(cl=>cl.id===c.clientId)||{}).nom || 'Client inconnu' }));
  }, [site.commandes, site.clients]);

  // Nom de l'employé connecté
  const monProfil = employeId ? site.employes.find(e=>e.id===employeId) : null;

  const today = todayISO();

  const getWeekDates = () => {
    const d = new Date(today + 'T00:00:00');
    const day = d.getDay() || 7;
    const monday = new Date(d); monday.setDate(d.getDate() - day + 1);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    const toISO = (dt) => dt.toISOString().slice(0,10);
    return { start: toISO(monday), end: toISO(sunday) };
  };
  const week = getWeekDates();
  const [periodeStats, setPeriodeStats] = useState('jour');
  const [anneeStats, setAnneeStats] = useState(Number(todayISO().slice(0,4)));

  // Filtrer uniquement les repassages DE CET EMPLOYÉ
  const repassageOnly = remunerations.filter(r => r.type === 'repassage' && r.employeId === employeId);

  // Bilan journalier
  const bilanJour = useMemo(() => {
    const rems = repassageOnly.filter(r => (r.date||'').slice(0,10) === today);
    const totalMontant = rems.reduce((s,r)=>s+Number(r.montant),0);
    // Agréger les articles
    const articlesCount = {};
    rems.forEach(r => {
      if(r.detail){
        // Parser le détail : "2x Chemise (15 000 GNF), 1x Pantalon (20 000 GNF)"
        r.detail.split(', ').forEach(part => {
          const match = part.match(/(\d+)x (.+?) \(/);
          if(match) {
            const nom = match[2];
            const qte = Number(match[1]);
            articlesCount[nom] = (articlesCount[nom]||0) + qte;
          }
        });
      }
    });
    return { rems, totalMontant, articlesCount };
  }, [repassageOnly, today]);

  // Bilan hebdomadaire
  const bilanSemaine = useMemo(() => {
    const rems = repassageOnly.filter(r => r.date >= week.start && r.date <= week.end);
    const totalMontant = rems.reduce((s,r)=>s+Number(r.montant),0);
    // Par jour de la semaine
    const parJour = {};
    rems.forEach(r => {
      if(!parJour[r.date]) parJour[r.date] = { montant:0, articles:{} };
      parJour[r.date].montant += Number(r.montant);
      if(r.detail){
        r.detail.split(', ').forEach(part => {
          const match = part.match(/(\d+)x (.+?) \(/);
          if(match){
            const nom = match[2]; const qte = Number(match[1]);
            parJour[r.date].articles[nom] = (parJour[r.date].articles[nom]||0) + qte;
          }
        });
      }
    });
    const totalArticles = {};
    rems.forEach(r => {
      if(r.detail) r.detail.split(', ').forEach(part => {
        const match = part.match(/(\d+)x (.+?) \(/);
        if(match){ const nom=match[2]; const qte=Number(match[1]); totalArticles[nom]=(totalArticles[nom]||0)+qte; }
      });
    });
    return { rems, totalMontant, parJour, totalArticles };
  }, [repassageOnly, week]);

  // Bilan mensuel
  const bilanMois = useMemo(() => {
    const rems = repassageOnly.filter(r => r.date.slice(0,7) === filterMois);
    const totalMontant = rems.reduce((s,r)=>s+Number(r.montant),0);
    const totalArticles = {};
    rems.forEach(r => {
      if(r.detail) r.detail.split(', ').forEach(part => {
        const match = part.match(/(\d+)x (.+?) \(/);
        if(match){ const nom=match[2]; const qte=Number(match[1]); totalArticles[nom]=(totalArticles[nom]||0)+qte; }

  const totalMois = filtered.reduce((s,r) => s + Number(r.montant), 0);
  const totalRepassage = filtered.filter(r=>r.type==='repassage').reduce((s,r)=>s+Number(r.montant),0);
  const totalLivraison = filtered.filter(r=>r.type==='livraison').reduce((s,r)=>s+Number(r.montant),0);

  const moisDisponibles = useMemo(() => {

    mois.add(todayISO().slice(0,7));
    return [...mois].sort().reverse();
  }, [remunerations, employeId]);

  function addArticle(tarifId){
    setSelectedArticles(prev => {
      const exist = prev.find(a=>a.tarifId===tarifId);
      if(exist) return prev.map(a=>a.tarifId===tarifId ? {...a, qte:a.qte+1} : a);
      return [...prev, {tarifId, qte:1}];
    });
  }
  function setArticleQte(tarifId, qte){
    setSelectedArticles(prev => prev.map(a=>a.tarifId===tarifId ? {...a, qte:Math.max(0,qte)} : a).filter(a=>a.qte>0));
  }

  const montantRepassage = selectedArticles.reduce((s,a) => {
    const tarif = tarifsRepassage.find(t=>t.id===a.tarifId);
    return s + (tarif ? tarif.prix * a.qte : 0);
  }, 0);

  function calculerMontant(){
    if(type === 'repassage') return montantRepassage;
    const zone = config.zones?.find(z=>z.id===zoneId);

    function enregistrer(){

      modePaiement: type === 'livraison' ? modePaiementLivraison : 'Espèces',
      autoPrestationId: rem.id,
      saisiPar: employeId || null,
    };
    updateSite({ ...site, remunerations: [rem, ...remunerations], depenses: [dep, ...(site.depenses||[])] });

  return (
    <div>
      <PageHeader title={`Ma rémunération${monProfil ? ` — ${monProfil.nom}` : ''}`} subtitle={`Total ${formatMoisAnnee(filterMois)} : ${fmtGNF(totalMois)}`} />

      <div style={{display:'flex', gap:8, marginBottom:14, flexWrap:'wrap', alignItems:'center'}}>

            style={{background:periodeStats===v?'var(--pine)':'transparent', color:periodeStats===v?'var(--white)':'var(--ink)', borderColor:periodeStats===v?'var(--pine)':'var(--line-strong)'}}>
            {v === 'jour' ? "Aujourd'hui" : v === 'semaine' ? 'Cette semaine' : v === 'mois' ? 'Ce mois' : 'Cette année'}
          </button>

          </select>
        )}
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, marginBottom:20}}>
        <StatCard label={`Total repassé — ${periodeStatsLabel}`} value={fmtGNF(totalRepasseStats)} icon="shirt" />
        <StatCard label={`Total payé — ${periodeStatsLabel}`} value={fmtGNF(totalPayeStats)} icon="euro" />
        <StatCard label={`Impayé par l'entreprise — ${periodeStatsLabel}`} value={fmtGNF(totalImpayeStats)} icon="euro" tone={totalImpayeStats>0?'danger':'default'} />
      </div>

      <div className="card" style={{padding:'1.5rem', marginBottom:20}}>
        <h3 style={{margin:'0 0 14px', fontSize:15}}>Enregistrer une prestation</h3>

        <div style={{display:'flex', gap:10, marginBottom:14}}>
          <button className="btn btn-sm" onClick={()=>{ setType('repassage'); setSelectedArticles([]); }}
            style={{background: type==='repassage'?'var(--pine)':'transparent', color: type==='repassage'?'var(--white)':'var(--ink)', borderColor: type==='repassage'?'var(--pine)':'var(--line-strong)'}}>
            👔 Repassage (par article)
          </button>
          <button className="btn btn-sm" onClick={()=>setType('livraison')}
            style={{background: type==='livraison'?'var(--pine)':'transparent', color: type==='livraison'?'var(--white)':'var(--ink)', borderColor: type==='livraison'?'var(--pine)':'var(--line-strong)'}}>
            🚗 Livraison (par zone)
          </button>
        </div>

        <div style={{display:'grid', gridTemplateColumns:'1fr 2fr 1fr', gap:12, alignItems:'start'}}>
          <div>
            <label>Date</label>
            <input type="date" value={date} onChange={e=>setDate(e.target.value)} max={todayISO()} />
          </div>

          {type === 'repassage' && (
            <div style={{gridColumn:'1/-1'}}>
              <label>Commande / Client <span style={{color:'var(--danger)'}}>*</span></label>
              <select value={commandeId} onChange={e=>setCommandeId(e.target.value)}>
                <option value="">Choisir la commande concernée…</option>
                {commandesDisponibles.map(c => (
                  <option key={c.id} value={c.id}>{c.numero} — {c.clientNom}</option>
                ))}
              </select>
              {!commandeId && <p style={{fontSize:11.5, color:'var(--warn)', margin:'4px 0 0'}}>Obligatoire — sélectionne le ticket du client concerné.</p>}
            </div>
          )}

          {type === 'repassage' ? (
            <div>
              <label>Articles repassés</label>
              {tarifsRepassage.length > 0 ? (
                <>
                  <div style={{display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:6, marginBottom:8}}>
                    {tarifsRepassage.map(t => (
                      <button key={t.id} className="btn btn-sm"
                        style={{justifyContent:'space-between', display:'flex', background: selectedArticles.find(a=>a.tarifId===t.id) ? 'var(--pine-light)' : 'transparent', borderColor: selectedArticles.find(a=>a.tarifId===t.id) ? 'var(--pine)' : 'var(--line-strong)'}}
                        onClick={()=>addArticle(t.id)}>
                        <span>{t.nom}</span><span className="mono" style={{color:'var(--steam)'}}>{fmtGNF(t.prix)}</span>
                      </button>
                    ))}
                  </div>
                  {selectedArticles.length > 0 && (
                    <div style={{background:'var(--paper-2)', borderRadius:8, padding:'10px 12px'}}>
                      {selectedArticles.map(a => {
                        const t = tarifsRepassage.find(x=>x.id===a.tarifId);
                        if(!t) return null;
                        return (
                          <div key={a.tarifId} style={{display:'flex', justifyContent:'space-between', alignItems:'center', padding:'4px 0'}}>
                            <span style={{fontSize:13}}>{t.nom}</span>
                            <div style={{display:'flex', alignItems:'center', gap:6}}>
                              <button className="btn btn-sm" style={{padding:'1px 7px'}} onClick={()=>setArticleQte(a.tarifId, a.qte-1)}>−</button>
                              <span className="mono" style={{fontSize:13}}>{a.qte}</span>
                              <button className="btn btn-sm" style={{padding:'1px 7px'}} onClick={()=>setArticleQte(a.tarifId, a.qte+1)}>+</button>
                              <span className="mono" style={{fontSize:12, color:'var(--pine)', minWidth:70, textAlign:'right'}}>{fmtGNF(t.prix*a.qte)}</span>
                            </div>
                          </div>
                        );

                    </div>
                  )}
                </>
              ) : (
                <div style={{padding:'9px 12px', background:'var(--warn-light)', borderRadius:8, fontSize:13, color:'var(--warn)'}}>

            <div>
              <label>Zone de livraison</label>
              {config.zones?.length > 0 ? (

                  {config.zones.map(z => (
                    <option key={z.id} value={z.id}>{z.nom} — {fmtGNF(z.montant)}</option>
                  ))}
                </select>
              ) : (

                </div>

              <div style={{marginTop:12}}>
                <label>Payé par</label>
                <div style={{display:'flex', gap:8}}>
                  <button type="button" className="btn btn-sm" onClick={()=>setModePaiementLivraison('Espèces')}
                    style={{background: modePaiementLivraison==='Espèces'?'var(--pine)':'transparent', color: modePaiementLivraison==='Espèces'?'var(--white)':'var(--ink)', borderColor: modePaiementLivraison==='Espèces'?'var(--pine)':'var(--line-strong)'}}>

                  </button>
                  <button type="button" className="btn btn-sm" onClick={()=>setModePaiementLivraison('Orange Money')}

                    Orange Money

                </div>
              </div>
            </div>
          )}

            {montantPreview > 0 && (
              <div style={{marginBottom:8, fontSize:13, color:'var(--pine)', fontWeight:600}}>
                💰 Total : {fmtGNF(montantPreview)}
              </div>

            <button className="btn btn-rust" style={{width:'100%'}}
              disabled={montantPreview <= 0 || (type === 'repassage' && !commandeId)}
              onClick={enregistrer}>

            </button>
          </div>
        </div>
      </div>

      {/* BILAN REPASSAGE */}
      <div className="card" style={{padding:'1.5rem', marginBottom:20}}>
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:14}}>

          <div style={{display:'flex', gap:8}}>
            {['jour','semaine','mois'].map(v => (
              <button key={v} className="btn btn-sm" onClick={()=>setBilanView(v)}
                style={{background:bilanView===v?'var(--pine)':'transparent', color:bilanView===v?'var(--white)':'var(--ink)', borderColor:bilanView===v?'var(--pine)':'var(--line-strong)', textTransform:'capitalize'}}>
                {v === 'jour' ? "Aujourd'hui" : v === 'semaine' ? 'Cette semaine' : 'Ce mois'}

        </div>

        {bilanView === 'jour' && (

              <div style={{background:'var(--paper-2)', borderRadius:8, padding:'10px 16px', flex:1}}>
                <div style={{fontSize:11.5, color:'var(--steam)', textTransform:'uppercase', fontWeight:600}}>Articles repassés</div>
                <div style={{fontSize:22, fontWeight:700, color:'var(--pine)'}}>
                  {Object.values(bilanJour.articlesCount).reduce((s,v)=>s+v,0)}

              </div>
              <div style={{background:'var(--paper-2)', borderRadius:8, padding:'10px 16px', flex:1}}>
                <div style={{fontSize:11.5, color:'var(--steam)', textTransform:'uppercase', fontWeight:600}}>Montant gagné</div>

                <div style={{fontSize:12, color:'var(--steam)', fontWeight:600, textTransform:'uppercase', marginBottom:6}}>Détail par article</div>

                  <div key={nom} style={{display:'flex', justifyContent:'space-between', padding:'5px 0', borderBottom:'1px solid var(--line)', fontSize:13.5}}>
                    <span>👔 {nom}</span><span className="mono" style={{fontWeight:600}}>{qte} pièce(s)</span>
                  </div>
                ))}
              </div>
            ) : (
              <p style={{fontSize:13, color:'var(--steam)', margin:0}}>Aucun repassage enregistré aujourd'hui.</p>
            )}

        )}

        {bilanView === 'semaine' && (
          <div>
            <div style={{display:'flex', gap:14, marginBottom:12}}>
              <div style={{background:'var(--paper-2)', borderRadius:8, padding:'10px 16px', flex:1}}>
                <div style={{fontSize:11.5, color:'var(--steam)', textTransform:'uppercase', fontWeight:600}}>Total articles</div>
                <div style={{fontSize:22, fontWeight:700, color:'var(--pine)'}}>
                  {Object.values(bilanSemaine.totalArticles).reduce((s,v)=>s+v,0)}
                </div>
              </div>
              <div style={{background:'var(--paper-2)', borderRadius:8, padding:'10px 16px', flex:1}}>
                <div style={{fontSize:11.5, color:'var(--steam)', textTransform:'uppercase', fontWeight:600}}>Montant semaine</div>
                <div style={{fontSize:22, fontWeight:700, color:'var(--ok)'}}>{fmtGNF(bilanSemaine.totalMontant)}</div>
              </div>
            </div>
            {/* Par jour */}
            {Object.keys(bilanSemaine.parJour).length > 0 ? (
              <div>
                <div style={{fontSize:12, color:'var(--steam)', fontWeight:600, textTransform:'uppercase', marginBottom:6}}>Par jour</div>
                {Object.entries(bilanSemaine.parJour).sort((a,b)=>b[0].localeCompare(a[0])).map(([dateKey, data]) => (
                  <div key={dateKey} style={{padding:'8px 0', borderBottom:'1px solid var(--line)'}}>
                    <div style={{display:'flex', justifyContent:'space-between', fontSize:13.5, fontWeight:600}}>
                      <span>{fmtDate(dateKey)}</span>
                      <span className="mono" style={{color:'var(--ok)'}}>{fmtGNF(data.montant)}</span>
                    </div>
                    <div style={{fontSize:12, color:'var(--steam)', marginTop:3}}>
                      {Object.entries(data.articles).map(([nom,qte])=>`${qte}x ${nom}`).join(' · ')}
                    </div>
                  </div>
                ))}
                <div style={{fontSize:12, color:'var(--steam)', fontWeight:600, textTransform:'uppercase', marginTop:10, marginBottom:6}}>Total par article</div>
                {Object.entries(bilanSemaine.totalArticles).map(([nom, qte]) => (
                  <div key={nom} style={{display:'flex', justifyContent:'space-between', padding:'4px 0', fontSize:13}}>
                    <span>👔 {nom}</span><span className="mono">{qte} pièce(s)</span>
                  </div>
                ))}
              </div>
            ) : (
              <p style={{fontSize:13, color:'var(--steam)', margin:0}}>Aucun repassage cette semaine.</p>
            )}
          </div>
        )}

        {bilanView === 'mois' && (
          <div>
            <div style={{display:'flex', gap:10, marginBottom:14, alignItems:'center'}}>
              <select value={filterMois} onChange={e=>setFilterMois(e.target.value)} style={{width:'auto', minWidth:160}}>
                {moisDisponibles.map(m => (
                  <option key={m} value={m}>{new Date(m + '-15T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</option>
                ))}
              </select>
            </div>
            <div style={{display:'flex', gap:14, marginBottom:12}}>
              <div style={{background:'var(--paper-2)', borderRadius:8, padding:'10px 16px', flex:1}}>
                <div style={{fontSize:11.5, color:'var(--steam)', textTransform:'uppercase', fontWeight:600}}>Total articles</div>
                <div style={{fontSize:22, fontWeight:700, color:'var(--pine)'}}>
                  {Object.values(bilanMois.totalArticles).reduce((s,v)=>s+v,0)}

                <div style={{fontSize:11.5, color:'var(--steam)', textTransform:'uppercase', fontWeight:600}}>Montant du mois</div>
                <div style={{fontSize:22, fontWeight:700, color:'var(--ok)'}}>{fmtGNF(bilanMois.totalMontant)}</div>
              </div>
            </div>
            {Object.keys(bilanMois.totalArticles).length > 0 ? (
              <div>
                <div style={{fontSize:12, color:'var(--steam)', fontWeight:600, textTransform:'uppercase', marginBottom:6}}>Total par article ce mois</div>
                {Object.entries(bilanMois.totalArticles).sort((a,b)=>b[1]-a[1]).map(([nom, qte]) => (
                  <div key={nom} style={{display:'flex', justifyContent:'space-between', padding:'6px 0', borderBottom:'1px solid var(--line)', fontSize:13.5}}>

              <p style={{fontSize:13, color:'var(--steam)', margin:0}}>Aucun repassage ce mois.</p>
            )}

      <div style={{display:'flex', gap:10, marginBottom:14, alignItems:'center'}}>
        <label style={{margin:0}}>Mois :</label>
        <select value={filterMois} onChange={e=>setFilterMois(e.target.value)} style={{width:'auto', minWidth:160}}>
          {moisDisponibles.map(m => (
            <option key={m} value={m}>{new Date(m + '-15T12:00:00').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</option>
          ))}
        </select>
      </div>

      <div className="card" style={{overflow:'hidden'}}>
        <table style={{width:'100%', borderCollapse:'collapse', fontSize:13.5}}>
          <thead>
            <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
              <th style={th}>Date</th>
              <th style={th}>Type</th>
              <th style={th}>Détail</th>
              <th style={th}>Montant</th>
            </tr>
          </thead>
          <tbody>
            {filtered.length === 0 && (
              <tr><td colSpan={4} style={{...td, textAlign:'center', color:'var(--steam)', padding:'2rem'}}>Aucune prestation enregistrée pour ce mois.</td></tr>

            {filtered.map(r => (
              <tr key={r.id} style={{borderTop:'1px solid var(--line)'}}>
                <td style={td}>{fmtDate(r.date)}</td>
                <td style={td}><span className="tag tag-recu">{r.type === 'repassage' ? '👔 Repassage' : '🚗 Livraison'}</span></td>
                <td style={td}>{r.detail}</td>
                <td style={{...td, fontWeight:700, color:'var(--ok)'}} className="mono">{fmtGNF(r.montant)}</td>
              </tr>
            ))}
            {filtered.length > 0 && (
              <tr style={{borderTop:'2px solid var(--line-strong)', background:'var(--paper-2)'}}>
                <td colSpan={3} style={{...td, fontWeight:700}}>Total {formatMoisAnnee(filterMois)}</td>
                <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(totalMois)}</td>
              </tr>
            )}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ===================== VUE REPASSEUR (limitée) ===================== */

function RepasseurView({ site, updateSite, employeId }){
  const [confirmPret, setConfirmPret] = useState(null);
  const [search, setSearch] = useState('');

  // Seulement les commandes En cours ou Reçu
  const commandes = (site.commandes||[])
    .filter(c => c.statut === 'Reçu' || c.statut === 'En cours')
    .sort((a,b) => new Date(a.dateCreation) - new Date(b.dateCreation));

  const filteredCommandes = useMemo(() => {
    if(!search.trim()) return commandes;
    const q = search.trim().toLowerCase();
    return commandes.filter(cmd => {
      const client = site.clients.find(c => c.id === cmd.clientId);
      const last4 = cmd.numero.slice(-4);
      return (client && client.nom.toLowerCase().includes(q)) || cmd.numero.toLowerCase().includes(q) || last4 === q;
    });
  }, [commandes, search, site.clients]);

  function marquerPret(cmd){
    const config = site.configRemuneration || {};
    const tarifsRepassage = config.tarifsRepassage || [];
    const nextSite = { ...site, commandes: site.commandes.map(c => c.id===cmd.id ? {...c, statut:'Prêt'} : c) };

    // Calcul automatique rémunération
    if(tarifsRepassage.length > 0){
      const articlesRepasses = [];
      cmd.lignes.forEach(l => {
        const svc = site.services.find(s=>s.id===l.serviceId);
        if(!svc) return;
        const tarif = tarifsRepassage.find(t =>
          svc.nom.toLowerCase().includes(t.nom.toLowerCase()) ||
          t.nom.toLowerCase().includes(svc.nom.toLowerCase())
        );
        if(tarif) articlesRepasses.push({ nom: tarif.nom, prix: tarif.prix, qte: l.qte });
      });
      if(articlesRepasses.length > 0){
        const montant = articlesRepasses.reduce((s,a)=>s+(a.prix*a.qte),0);
        const detail = articlesRepasses.map(a=>`${a.qte}x ${a.nom} (${fmtGNF(a.prix)})`).join(', ');
        const client = site.clients.find(c => c.id === cmd.clientId);
        const clientNomRem = client ? client.nom : 'Client inconnu';
        const ticketSuffixRem = cmd.numero.slice(-4);
        const rem = { id: uid('rem_'), date: todayISO(), type:'repassage', montant, detail, commandeId: cmd.id, commandeNumero: cmd.numero, clientNom: clientNomRem, ticketSuffix: ticketSuffixRem, employeId, auto: true };
        const empNomRem = (site.employes.find(e=>e.id===employeId)||{}).nom || 'Employé';
        const depRem = {
          id: uid('dep_'),
          date: rem.date,
          description: `Prestation repassage — ${clientNomRem} (#${ticketSuffixRem}) — ${empNomRem}`,
          montant,
          categorie: 'Paiement repasseur',
          modePaiement: 'Espèces',
          autoPrestationId: rem.id,
          saisiPar: employeId || null,
        };
        nextSite.remunerations = [rem, ...(nextSite.remunerations||[])];
        nextSite.depenses = [depRem, ...(nextSite.depenses||[])];
      }
    }
    updateSite(nextSite);
    setConfirmPret(null);
  }

  return (
    <div>
      <PageHeader title="Commandes à repasser" subtitle={`${commandes.length} commande(s) en attente`} />

      {commandes.length > 0 && (
        <div style={{position:'relative', maxWidth:340, marginBottom:18}}>
          <input type="text" placeholder="Nom du client ou 4 derniers chiffres du reçu…" value={search} onChange={e=>setSearch(e.target.value)} style={{paddingLeft:34}}/>
          <Icon name="search" size={15} style={{position:'absolute', left:11, top:11, color:'var(--steam)'}}/>
        </div>
      )}

      {commandes.length === 0 ? (
        <div className="card" style={{padding:'2rem', textAlign:'center', color:'var(--steam)'}}>
          <div style={{fontSize:32, marginBottom:8}}>✅</div>
          <div style={{fontSize:15, fontWeight:600}}>Toutes les commandes sont repassées !</div>
        </div>
      ) : filteredCommandes.length === 0 ? (
        <div className="card" style={{padding:'2rem', textAlign:'center', color:'var(--steam)'}}>
          Aucune commande ne correspond à votre recherche.
        </div>
      ) : (
        <div style={{display:'grid', gap:12}}>
          {filteredCommandes.map(cmd => {
            const client = site.clients.find(c => c.id === cmd.clientId);
            return (
            <div key={cmd.id} className="card" style={{padding:'1.1rem 1.25rem', display:'flex', justifyContent:'space-between', alignItems:'center'}}>
              <div>
                <div style={{display:'flex', alignItems:'baseline', gap:8}}>
                  <span className="mono" style={{fontWeight:700, fontSize:15}}>{cmd.numero}</span>
                  <span style={{fontWeight:600, fontSize:14, color:'var(--pine)'}}>{client ? client.nom : 'Client inconnu'}</span>
                </div>
                <div style={{fontSize:13, color:'var(--steam)', marginTop:3}}>
                  {cmd.lignes.reduce((s,l)=>s+l.qte,0)} article(s) · {fmtDate(cmd.dateCreation.slice(0,10))}
                </div>
                <div style={{display:'flex', gap:6, marginTop:6, flexWrap:'wrap'}}>
                  {cmd.lignes.map(l => {
                    const svc = site.services.find(s=>s.id===l.serviceId);
                    return svc ? (
                      <span key={l.serviceId} style={{fontSize:12, background:'var(--paper-2)', padding:'2px 8px', borderRadius:6}}>
                        {l.qte}x {svc.nom}
                      </span>
                    ) : null;
                  })}
                </div>
                {cmd.notes && <div style={{fontSize:12, color:'var(--steam)', marginTop:4}}>📝 {cmd.notes}</div>}
              </div>
              <div style={{display:'flex', flexDirection:'column', gap:8, alignItems:'flex-end'}}>
                <span className={`tag ${STATUT_TAG_CLASS[cmd.statut]}`}>{cmd.statut}</span>
                <button className="btn btn-rust" onClick={()=>setConfirmPret(cmd)}>
                  ✅ Marquer Prêt
                </button>
              </div>
            </div>
            );
          })}
        </div>
      )}

      {confirmPret && (
        <ModalShell title="Confirmer" onClose={()=>setConfirmPret(null)} width={360}>
          <p style={{fontSize:14}}>Marquer la commande <strong>{confirmPret.numero}</strong> comme <strong>Prête</strong> ?</p>
          <p style={{fontSize:13, color:'var(--steam)'}}>Cela enregistrera automatiquement votre rémunération pour cette commande.</p>
          <div style={{display:'flex', gap:10, justifyContent:'flex-end', marginTop:16}}>
            <button className="btn" onClick={()=>setConfirmPret(null)}>Annuler</button>
            <button className="btn btn-rust" onClick={()=>marquerPret(confirmPret)}>Confirmer</button>
          </div>
        </ModalShell>
      )}
    </div>
  );
}

/* ===================== DETAIL MENSUEL (espace caissier — vue par site) ===================== */

function MoisRowCaissier({ valeurs, avantSeuil, employeId, monNom, onSave, montantRecu }){
  const mesValeurs = (valeurs.parEmploye && valeurs.parEmploye[employeId]) || { recetteBrute: 0, depenses: 0, impayes: 0, depensesPropres: 0, depensesPropresDescription: '', montantRecuEspeces: 0, montantRecuOrangeMoney: 0 };
  const [recetteBrute, setRecetteBrute] = useState(String(mesValeurs.recetteBrute || ''));
  const [depenses, setDepenses] = useState(String(mesValeurs.depenses || ''));
  const [depensesPropres, setDepensesPropres] = useState(String(mesValeurs.depensesPropres || ''));
  const [depensesPropresDescription, setDepensesPropresDescription] = useState(mesValeurs.depensesPropresDescription || '');
  const [montantRecuEspeces, setMontantRecuEspeces] = useState(String(mesValeurs.montantRecuEspeces || ''));
  const [montantRecuOrangeMoney, setMontantRecuOrangeMoney] = useState(String(mesValeurs.montantRecuOrangeMoney || ''));
  const [ouvert, setOuvert] = useState(false);
  const [flash, setFlash] = useState(false);

  useEffect(() => {
    const mv = (valeurs.parEmploye && valeurs.parEmploye[employeId]) || { recetteBrute: 0, depenses: 0, impayes: 0, depensesPropres: 0, depensesPropresDescription: '', montantRecuEspeces: 0, montantRecuOrangeMoney: 0 };
    setRecetteBrute(mv.recetteBrute ? String(mv.recetteBrute) : '');
    setDepenses(mv.depenses ? String(mv.depenses) : '');
    setDepensesPropres(mv.depensesPropres ? String(mv.depensesPropres) : '');
    setDepensesPropresDescription(mv.depensesPropresDescription || '');
    setMontantRecuEspeces(mv.montantRecuEspeces ? String(mv.montantRecuEspeces) : '');
    setMontantRecuOrangeMoney(mv.montantRecuOrangeMoney ? String(mv.montantRecuOrangeMoney) : '');
  }, [valeurs.mois, employeId]);

  // Impayés = ce qui reste de la recette brute une fois les deux nets (Espèces + Orange Money) déduits
  const impayesCalcule = Math.max(0, (Number(recetteBrute)||0) - ((Number(montantRecuEspeces)||0) + (Number(montantRecuOrangeMoney)||0)));

  function save(){
    onSave(valeurs.mois, {
      recetteBrute: Number(recetteBrute)||0,
      impayes: impayesCalcule,
      depenses: Number(depenses)||0,
      depensesPropres: Number(depensesPropres)||0,
      depensesPropresDescription: depensesPropresDescription.trim(),
      montantRecuEspeces: Number(montantRecuEspeces)||0,
      montantRecuOrangeMoney: Number(montantRecuOrangeMoney)||0,
    });
    setFlash(true);
    setTimeout(()=>setFlash(false), 1200);
  }

  return (
    <React.Fragment>
      <tr style={{borderTop:'1px solid var(--line)'}}>
        <td style={{...td, textTransform:'capitalize', fontWeight:600, whiteSpace:'nowrap'}}>
          {valeurs.label}
          {valeurs.manuel && <span className="tag" style={{fontSize:9, marginLeft:6, background:'var(--warn-light)', color:'var(--warn)'}}>Manuel</span>}
        </td>
        <td style={td} className="mono">{fmtGNF(valeurs.recetteBrute)}</td>
        <td style={{...td, color: valeurs.impayesReel>0?'var(--danger)':'var(--steam)'}} className="mono">{valeurs.impayesReel>0?fmtGNF(valeurs.impayesReel):'—'}</td>
        <td style={{...td, color: valeurs.depenses>0?'var(--danger)':'var(--steam)'}} className="mono">{fmtGNF(valeurs.depenses)}</td>
        <td style={{...td, color: valeurs.depensesPropres>0?'var(--rust)':'var(--steam)'}} className="mono">{valeurs.depensesPropres>0?fmtGNF(valeurs.depensesPropres):'—'}</td>
        <td style={{...td, color:'var(--pine)'}} className="mono">{fmtGNF(valeurs.montantRecuEspeces||0)}</td>
        <td style={{...td, color:'var(--pine)'}} className="mono">{fmtGNF(valeurs.montantRecuOrangeMoney||0)}</td>
        <td style={{...td, fontWeight:700, color: valeurs.netPercu<0?'var(--danger)':'var(--ink)'}} className="mono">{fmtGNF(valeurs.netPercu)}</td>
        <td style={{...td, textAlign:'right'}}>
          <button className="btn btn-ghost btn-sm" onClick={()=>setOuvert(!ouvert)}>{ouvert ? 'Fermer' : 'Mes données'}</button>
        </td>
      </tr>
      {ouvert && (
        <tr style={{background:'var(--paper-2)'}}>
          <td colSpan={9} style={{padding:'10px 14px'}}>
            <div style={{fontSize:12, color:'var(--steam)', marginBottom:8}}>Vos chiffres pour ce mois ({monNom}) — n'affectent que votre propre saisie, cumulée avec celle des autres caissiers.</div>
            <div style={{display:'flex', gap:10, alignItems:'flex-end', flexWrap:'wrap'}}>
              {avantSeuil && (
                <>
                  <div><label>Ma recette brute</label><input type="number" value={recetteBrute} onChange={e=>setRecetteBrute(e.target.value)} style={{width:140}}/></div>
                  <div><label>Dépenses entreprise (moi)</label><input type="number" value={depenses} onChange={e=>setDepenses(e.target.value)} style={{width:140}}/></div>
                </>
              )}
              <div><label>Mes dépenses propres</label><input type="number" value={depensesPropres} onChange={e=>setDepensesPropres(e.target.value)} style={{width:140}}/></div>
              <div><label>Description (pour situer)</label><input type="text" placeholder="Ex: avance sur salaire" value={depensesPropresDescription} onChange={e=>setDepensesPropresDescription(e.target.value)} style={{width:180}}/></div>
              {avantSeuil ? (
                <>
                  <div><label>Montant net reçu (Espèces)</label><input type="number" value={montantRecuEspeces} onChange={e=>setMontantRecuEspeces(e.target.value)} style={{width:140}}/></div>
                  <div><label>Montant net reçu (Orange Money)</label><input type="number" value={montantRecuOrangeMoney} onChange={e=>setMontantRecuOrangeMoney(e.target.value)} style={{width:140}}/></div>
                  <div>
                    <label>Mes impayés (calculé)</label>
                    <div className="mono" style={{padding:'8px 10px', background:'var(--paper-2)', borderRadius:8, fontSize:13, fontWeight:600, minWidth:140, color: impayesCalcule>0?'var(--danger)':'var(--ink)'}}>{fmtGNF(impayesCalcule)}</div>
                  </div>
                </>
              ) : (
                <>
                  <div>
                    <label>Montant net reçu (Espèces)</label>
                    <div className="mono" style={{padding:'8px 10px', background:'var(--paper-2)', borderRadius:8, fontSize:13, fontWeight:600, minWidth:140}}>{fmtGNF(montantRecu ? montantRecu.especes : 0)}</div>
                  </div>
                  <div>
                    <label>Montant net reçu (Orange Money)</label>
                    <div className="mono" style={{padding:'8px 10px', background:'var(--paper-2)', borderRadius:8, fontSize:13, fontWeight:600, minWidth:140}}>{fmtGNF(montantRecu ? montantRecu.orangeMoney : 0)}</div>
                  </div>
                </>
              )}
              <button className="btn btn-sm" onClick={save}>{flash ? <><Icon name="check" size={13}/> Enregistré</> : 'Enreg.'}</button>
            </div>
            <p style={{fontSize:11, color:'var(--steam)', margin:'8px 0 0', lineHeight:1.4}}>
              « Dépenses entreprise » = dépenses du pressing (fournitures, factures...). « Dépenses propres » = vos dépenses personnelles, toujours modifiables peu importe le mois. « Mes impayés » = Recette brute − (Net Espèces + Net Orange Money), calculé automatiquement.
            </p>
          </td>
        </tr>
      )}
    </React.Fragment>
  );
}

function normaliserMoisManuel(overrideMois){
  if(!overrideMois) return null;
  // ancien format (avant la saisie par caissier) : { recetteBrute, depenses } à plat
  if(overrideMois.recetteBrute !== undefined || overrideMois.depenses !== undefined){
    return { _legacy: { recetteBrute: Number(overrideMois.recetteBrute)||0, depenses: Number(overrideMois.depenses)||0, impayes: 0, depensesPropres: 0 } };
  }
  return overrideMois; // déjà au format { [employeId]: {recetteBrute, depenses, impayes, depensesPropres} }
}

function calculerDonneesMensuellesSite(site, annee){
  const auto = Array.from({length:12}, (_,i) => ({
    mois: i+1,
    label: new Date(annee, i, 1).toLocaleDateString('fr-FR', {month:'long'}),
    recetteBrute: 0,
    recetteEncaissee: 0,
    depenses: 0,
    especes: 0,
    orangeMoney: 0,
  }));
  (site.commandes||[]).forEach(c => {
    if(c.dateCreation && c.dateCreation.slice(0,4) === String(annee)){
      const m = Number(c.dateCreation.slice(5,7)) - 1;
      const totalCmd = calcCommandeTotal(c, site.services);
      auto[m].recetteBrute += totalCmd;
      auto[m].recetteEncaissee += c.paiement === 'paye' ? totalCmd : (Number(c.acompte)||0);
    }
    getPaiementsCommande(c).forEach(pmt => {
      if(!pmt.date || pmt.date.slice(0,4) !== String(annee)) return;
      const m = Number(pmt.date.slice(5,7)) - 1;
      if(pmt.mode === 'Orange Money') auto[m].orangeMoney += Number(pmt.montant)||0;
      else auto[m].especes += Number(pmt.montant)||0;
    });
  });
  (site.depenses||[]).forEach(d => {
    if(d.date && d.date.slice(0,4) === String(annee)){
      const m = Number(d.date.slice(5,7)) - 1;
      auto[m].depenses += Number(d.montant)||0;
    }
  });
  const manuel = (site.detailMensuelManuel||{})[annee] || {};
  return auto.map(a => {
    const avantSeuil = annee < 2026 || (annee === 2026 && a.mois < 9);
    const parEmploye = normaliserMoisManuel(manuel[a.mois]) || {};
    const aDesSaisiesManuelles = Object.keys(parEmploye).length > 0;
    const depensesPropres = Object.values(parEmploye).reduce((s,v)=>s+(Number(v.depensesPropres)||0),0);
    const montantRecuEspeces = aDesSaisiesManuelles
      ? Object.values(parEmploye).reduce((s,v)=>s+(Number(v.montantRecuEspeces)||0),0)
      : a.especes;
    const montantRecuOrangeMoney = aDesSaisiesManuelles
      ? Object.values(parEmploye).reduce((s,v)=>s+(Number(v.montantRecuOrangeMoney)||0),0)
      : a.orangeMoney;
    if(aDesSaisiesManuelles){
      const rb = Object.values(parEmploye).reduce((s,v)=>s+(Number(v.recetteBrute)||0),0);
      const dep = Object.values(parEmploye).reduce((s,v)=>s+(Number(v.depenses)||0),0);
      const imp = Object.values(parEmploye).reduce((s,v)=>s+(Number(v.impayes)||0),0);
      const impayesReel = Math.max(0, rb - (montantRecuEspeces + montantRecuOrangeMoney));
      const netPercu = (montantRecuEspeces + montantRecuOrangeMoney) - dep;
      return { mois:a.mois, label:a.label, avantSeuil, recetteBrute: rb, impayes: imp, depenses: dep, depensesPropres, manuel: true, parEmploye, net: rb - imp - dep, montantRecuEspeces, montantRecuOrangeMoney, impayesReel, netPercu };
    }
    const impayesReel = Math.max(0, a.recetteBrute - (montantRecuEspeces + montantRecuOrangeMoney));
    const imp = impayesReel;
    const netPercu = (montantRecuEspeces + montantRecuOrangeMoney) - a.depenses;
    return { mois:a.mois, label:a.label, avantSeuil, recetteBrute: a.recetteBrute, impayes: imp, depenses: a.depenses, depensesPropres, manuel: false, parEmploye, net: a.recetteBrute - imp - a.depenses, montantRecuEspeces, montantRecuOrangeMoney, impayesReel, netPercu };
  });
}

// Comme calculerDonneesMensuellesSite, mais ne montre QUE la contribution d'UN employé précis
// (sa propre saisie manuelle, ou ses propres commandes/paiements réels quand il n'a rien saisi)
function calculerDonneesMensuellesEmploye(site, annee, employeId){
  const auto = Array.from({length:12}, (_,i) => ({
    mois: i+1,
    label: new Date(annee, i, 1).toLocaleDateString('fr-FR', {month:'long'}),
    recetteBrute: 0,
    recetteEncaissee: 0,
    depenses: 0,
    especes: 0,
    orangeMoney: 0,
  }));
  (site.commandes||[]).forEach(c => {
    if(c.dateCreation && c.dateCreation.slice(0,4) === String(annee) && c.caissierEmpId === employeId){
      const m = Number(c.dateCreation.slice(5,7)) - 1;
      const totalCmd = calcCommandeTotal(c, site.services);
      auto[m].recetteBrute += totalCmd;
      auto[m].recetteEncaissee += c.paiement === 'paye' ? totalCmd : (Number(c.acompte)||0);
    }
    getPaiementsCommande(c).forEach(pmt => {
      if(!pmt.date || pmt.date.slice(0,4) !== String(annee)) return;
      const attribue = pmt.employeId != null ? pmt.employeId : (c.caissierEmpId || null);
      if(attribue !== employeId) return;
      const m = Number(pmt.date.slice(5,7)) - 1;
      if(pmt.mode === 'Orange Money') auto[m].orangeMoney += Number(pmt.montant)||0;
      else auto[m].especes += Number(pmt.montant)||0;
    });
  });
  (site.depenses||[]).forEach(d => {
    if(d.date && d.date.slice(0,4) === String(annee) && d.saisiPar === employeId){
      const m = Number(d.date.slice(5,7)) - 1;
      auto[m].depenses += Number(d.montant)||0;
    }
  });
  const manuel = (site.detailMensuelManuel||{})[annee] || {};
  return auto.map(a => {
    const avantSeuil = annee < 2026 || (annee === 2026 && a.mois < 9);
    const parEmploye = normaliserMoisManuel(manuel[a.mois]) || {};
    const mesValeurs = parEmploye[employeId] || null;
    const depensesPropres = Number(mesValeurs?.depensesPropres)||0;
    const montantRecuEspeces = mesValeurs ? (Number(mesValeurs.montantRecuEspeces)||0) : a.especes;
    const montantRecuOrangeMoney = mesValeurs ? (Number(mesValeurs.montantRecuOrangeMoney)||0) : a.orangeMoney;
    if(mesValeurs){
      const rb = Number(mesValeurs.recetteBrute)||0;
      const dep = Number(mesValeurs.depenses)||0;
      const imp = Number(mesValeurs.impayes)||0;
      const impayesReel = Math.max(0, rb - (montantRecuEspeces + montantRecuOrangeMoney));
      const netPercu = (montantRecuEspeces + montantRecuOrangeMoney) - dep;
      return { mois:a.mois, label:a.label, avantSeuil, recetteBrute: rb, impayes: imp, depenses: dep, depensesPropres, manuel: true, parEmploye, net: rb - imp - dep, montantRecuEspeces, montantRecuOrangeMoney, impayesReel, netPercu };
    }
    const impayesReel = Math.max(0, a.recetteBrute - (montantRecuEspeces + montantRecuOrangeMoney));
    const netPercu = (montantRecuEspeces + montantRecuOrangeMoney) - a.depenses;
    return { mois:a.mois, label:a.label, avantSeuil, recetteBrute: a.recetteBrute, impayes: impayesReel, depenses: a.depenses, depensesPropres, manuel: false, parEmploye, net: a.recetteBrute - impayesReel - a.depenses, montantRecuEspeces, montantRecuOrangeMoney, impayesReel, netPercu };
  });
}

// Même logique que calculerDonneesMensuellesSite, mais agrégée sur plusieurs pressings (tous les sites combinés)
function calculerDonneesMensuellesMultiSites(sites, annee){
  const parSite = sites.map(site => ({ site, donnees: calculerDonneesMensuellesSite(site, annee) }));
  return Array.from({length:12}, (_,i) => {
    const merged = {
      mois: i+1,
      label: parSite[0] ? parSite[0].donnees[i].label : new Date(annee, i, 1).toLocaleDateString('fr-FR', {month:'long'}),
      avantSeuil: parSite[0] ? parSite[0].donnees[i].avantSeuil : true,
      recetteBrute: 0, impayes: 0, depenses: 0, depensesPropres: 0,
      montantRecuEspeces: 0, montantRecuOrangeMoney: 0, impayesReel: 0, netPercu: 0, net: 0,
      manuel: false, parEmployeParSite: [],
    };
    parSite.forEach(({site, donnees}) => {
      const m = donnees[i];
      merged.recetteBrute += m.recetteBrute;
      merged.impayes += m.impayes;
      merged.depenses += m.depenses;
      merged.depensesPropres += m.depensesPropres;
      merged.montantRecuEspeces += m.montantRecuEspeces||0;
      merged.montantRecuOrangeMoney += m.montantRecuOrangeMoney||0;
      merged.impayesReel += m.impayesReel||0;
      merged.netPercu += m.netPercu||0;
      merged.net += m.net||0;
      merged.manuel = merged.manuel || m.manuel;
      if(Object.keys(m.parEmploye||{}).length > 0){
        merged.parEmployeParSite.push({ siteNom: site.nom, parEmploye: m.parEmploye });
      }
    });
    return merged;
  });
}

// Retrouve le nom d'un employé en cherchant dans tous les sites (utile pour le Détail mensuel consolidé)
function getEmpNomMultiSites(sites, empId){
  if(empId === '_legacy') return 'Saisie antérieure (sans détail par caissier)';
  for(const site of sites){
    const e = (site.employes||[]).find(emp=>emp.id===empId);
    if(e) return e.nom;
  }
  return 'Employé supprimé';
}

function DetailMensuelSiteView({ site, updateSite, employeId }){
  const currentYear = Number(todayISO().slice(0,4));
  const anneesDisponibles = useMemo(() => {
    const arr = [];
    for(let y = currentYear; y >= ANNEE_DEBUT_APP - 3; y--) arr.push(y);
    return arr;
  }, [currentYear]);
  const [annee, setAnnee] = useState(currentYear);

  const monProfil = site.employes.find(e=>e.id===employeId);
  const monNom = monProfil ? monProfil.nom : 'Moi';

  const donneesParMois = useMemo(() => calculerDonneesMensuellesEmploye(site, annee, employeId), [site, annee, employeId]);

  // Montant réellement encaissé par CET employé (caissier), par mois, séparé Espèces / Orange Money
  const montantRecuParMois = useMemo(() => {
    const acc = {};
    (site.commandes||[]).forEach(c => {
      getPaiementsCommande(c).forEach(pmt => {
        if(!pmt.date) return;
        const employeAttribue = pmt.employeId != null ? pmt.employeId : (c.caissierEmpId || null);
        if(employeAttribue !== employeId) return;
        const mois = pmt.date.slice(0,7);
        if(Number(mois.slice(0,4)) !== annee) return;
        if(!acc[mois]) acc[mois] = { especes: 0, orangeMoney: 0 };
        if(pmt.mode === 'Orange Money') acc[mois].orangeMoney += Number(pmt.montant);
        else acc[mois].especes += Number(pmt.montant);
      });
    });
    return acc;
  }, [site, employeId, annee]);

  function saveMois(m, valeurs){
    const manuelActuel = site.detailMensuelManuel || {};
    const anneeActuelle = manuelActuel[annee] || {};
    const moisNormalise = normaliserMoisManuel(anneeActuelle[m]) || {};
    const nextMois = { ...moisNormalise, [employeId]: valeurs };
    const nextAnnee = { ...anneeActuelle, [m]: nextMois };
    updateSite({ ...site, detailMensuelManuel: { ...manuelActuel, [annee]: nextAnnee } });
  }

  const totalBrute = donneesParMois.reduce((s,m)=>s+m.recetteBrute,0);
  const totalImpayes = donneesParMois.reduce((s,m)=>s+m.impayes,0);
  const totalDepenses = donneesParMois.reduce((s,m)=>s+m.depenses,0);
  const totalDepensesPropres = donneesParMois.reduce((s,m)=>s+m.depensesPropres,0);
  const totalNet = donneesParMois.reduce((s,m)=>s+m.net,0);
  const totalNetPercu = donneesParMois.reduce((s,m)=>s+m.netPercu,0);
  const totalImpayesReel = donneesParMois.reduce((s,m)=>s+m.impayesReel,0);

  return (
    <div>
      <PageHeader title="Détail mensuel" subtitle={`${site.nom} — chiffre d'affaires et dépenses par mois`}
        right={
          <select value={annee} onChange={e=>setAnnee(Number(e.target.value))} style={{width:'auto', minWidth:120}}>
            {anneesDisponibles.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
        } />

      <p style={{fontSize:12.5, color:'var(--steam)', margin:'0 0 14px', lineHeight:1.5}}>
        Les mois avant <strong>septembre 2026</strong> ont leur recette brute, impayés et dépenses entreprise modifiables. Les <strong>dépenses propres</strong> (personnelles) restent modifiables pour tous les mois. Cliquez « Mes données » pour entrer vos chiffres — votre saisie s'ajoute à celle des autres caissiers, elle ne la remplace jamais. « Net perçu » = Espèces + Orange Money réellement reçus, moins les dépenses entreprise.
      </p>

      <div style={{display:'grid', gridTemplateColumns:'repeat(8, 1fr)', gap:8, marginBottom:24}}>
        {[
          { label: 'Recette brute', value: totalBrute, danger: false },
          { label: 'Impayés', value: totalImpayesReel, danger: totalImpayesReel>0 },
          { label: 'Dép. entreprise', value: totalDepenses, danger: true },
          { label: 'Dép. propres', value: totalDepensesPropres, danger: true },
          { label: 'Espèces', value: donneesParMois.reduce((s,m)=>s+(m.montantRecuEspeces||0),0), danger: false },
          { label: 'Orange Money', value: donneesParMois.reduce((s,m)=>s+(m.montantRecuOrangeMoney||0),0), danger: false },
          { label: 'Total perçu', value: donneesParMois.reduce((s,m)=>s+(m.montantRecuEspeces||0)+(m.montantRecuOrangeMoney||0),0), danger: false },
          { label: 'Net perçu', value: totalNetPercu, danger: totalNetPercu<0 },
        ].map((c,i) => (
          <div key={i} className="card" style={{padding:'0.7rem 0.8rem'}}>
            <div style={{fontSize:10, color:'var(--steam)', textTransform:'uppercase', letterSpacing:'0.02em', fontWeight:600, lineHeight:1.3, marginBottom:4}}>{c.label}</div>
            <div className="mono" style={{fontSize:14.5, fontWeight:700, color: c.danger ? 'var(--danger)' : 'var(--pine)'}}>{fmtGNF(c.value)}</div>
          </div>
        ))}
      </div>
      <p style={{fontSize:11, color:'var(--steam)', margin:'-16px 0 24px'}}>{annee}</p>

      <div className="card" style={{overflow:'hidden'}}>
        <table style={{width:'100%', borderCollapse:'collapse', fontSize:13.5}}>
          <thead>
            <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
              <th style={th}>Mois</th>
              <th style={th}>Recette brute</th>
              <th style={th}>Impayés</th>
              <th style={th}>Dépenses entreprise</th>
              <th style={th}>Dépenses propres</th>
              <th style={th}>Espèces</th>
              <th style={th}>Orange Money</th>
              <th style={th}>Net perçu</th>
              <th style={th}></th>
            </tr>
          </thead>
          <tbody>
            {donneesParMois.map(m => (
              <MoisRowCaissier key={m.mois} valeurs={m} avantSeuil={m.avantSeuil} employeId={employeId} monNom={monNom} onSave={saveMois} montantRecu={montantRecuParMois[m.mois] || {especes:0, orangeMoney:0}} />
            ))}
            <tr style={{borderTop:'2px solid var(--line-strong)', background:'var(--paper-2)'}}>
              <td style={{...td, fontWeight:700}}>Total {annee}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(totalBrute)}</td>
              <td style={{...td, fontWeight:700}} className="mono">{totalImpayesReel>0?fmtGNF(totalImpayesReel):'—'}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(totalDepenses)}</td>
              <td style={{...td, fontWeight:700}} className="mono">{totalDepensesPropres>0?fmtGNF(totalDepensesPropres):'—'}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(donneesParMois.reduce((s,m)=>s+(m.montantRecuEspeces||0),0))}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(donneesParMois.reduce((s,m)=>s+(m.montantRecuOrangeMoney||0),0))}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(totalNetPercu)}</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  );
}

function DetailMensuelGerantView({ site, updateSite }){
  const currentYear = Number(todayISO().slice(0,4));
  const anneesDisponibles = useMemo(() => {
    const arr = [];
    for(let y = currentYear; y >= ANNEE_DEBUT_APP - 3; y--) arr.push(y);
    return arr;
  }, [currentYear]);
  const [annee, setAnnee] = useState(currentYear);
  const [moisOuvert, setMoisOuvert] = useState(null);
  const [empSaisieMois, setEmpSaisieMois] = useState(null); // { mois, employeId } en cours d'édition

  function getEmpNom(id){
    if(id === '_legacy') return 'Saisie antérieure (sans détail par caissier)';
    const e = site.employes.find(emp=>emp.id===id);
    return e ? e.nom : 'Employé supprimé';
  }

  function saveMoisPourEmploye(mois, employeId, valeurs){
    const manuelActuel = site.detailMensuelManuel || {};
    const anneeActuelle = manuelActuel[annee] || {};
    const moisNormalise = normaliserMoisManuel(anneeActuelle[mois]) || {};
    const nextMois = { ...moisNormalise, [employeId]: valeurs };
    const nextAnnee = { ...anneeActuelle, [mois]: nextMois };
    updateSite({ ...site, detailMensuelManuel: { ...manuelActuel, [annee]: nextAnnee } });
    setEmpSaisieMois(null);
  }

  const donneesParMois = useMemo(() => calculerDonneesMensuellesSite(site, annee), [site, annee]);

  const totalBrute = donneesParMois.reduce((s,m)=>s+m.recetteBrute,0);
  const totalImpayes = donneesParMois.reduce((s,m)=>s+m.impayes,0);
  const totalDepenses = donneesParMois.reduce((s,m)=>s+m.depenses,0);
  const totalDepensesPropres = donneesParMois.reduce((s,m)=>s+m.depensesPropres,0);
  const totalNet = donneesParMois.reduce((s,m)=>s+m.net,0);
  const totalNetPercu = donneesParMois.reduce((s,m)=>s+m.netPercu,0);
  const totalImpayesReel = donneesParMois.reduce((s,m)=>s+m.impayesReel,0);

  return (
    <div>
      <PageHeader title="Détail mensuel" subtitle={`${site.nom} — chiffre d'affaires et dépenses par mois, avec détail par caissier`}
        right={
          <select value={annee} onChange={e=>setAnnee(Number(e.target.value))} style={{width:'auto', minWidth:120}}>
            {anneesDisponibles.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
        } />

      <p style={{fontSize:12.5, color:'var(--steam)', margin:'0 0 14px', lineHeight:1.5}}>
        « Dépenses entreprise » = dépenses du pressing (fournitures, factures, salaires...). « Dépenses propres » = dépenses personnelles saisies par chaque caissier — les deux restent toujours distinctes. « Net perçu » = Espèces + Orange Money réellement reçus, moins les dépenses entreprise. « Impayés » = Recette brute non encore encaissée en Espèces ou Orange Money.
      </p>

      <div style={{display:'grid', gridTemplateColumns:'repeat(8, 1fr)', gap:8, marginBottom:24}}>
        {[
          { label: 'Recette brute', value: totalBrute, danger: false },
          { label: 'Impayés', value: totalImpayesReel, danger: totalImpayesReel>0 },
          { label: 'Dép. entreprise', value: totalDepenses, danger: true },
          { label: 'Dép. propres', value: totalDepensesPropres, danger: true },
          { label: 'Espèces', value: donneesParMois.reduce((s,m)=>s+(m.montantRecuEspeces||0),0), danger: false },
          { label: 'Orange Money', value: donneesParMois.reduce((s,m)=>s+(m.montantRecuOrangeMoney||0),0), danger: false },
          { label: 'Total perçu', value: donneesParMois.reduce((s,m)=>s+(m.montantRecuEspeces||0)+(m.montantRecuOrangeMoney||0),0), danger: false },
          { label: 'Net perçu', value: totalNetPercu, danger: totalNetPercu<0 },
        ].map((c,i) => (
          <div key={i} className="card" style={{padding:'0.7rem 0.8rem'}}>
            <div style={{fontSize:10, color:'var(--steam)', textTransform:'uppercase', letterSpacing:'0.02em', fontWeight:600, lineHeight:1.3, marginBottom:4}}>{c.label}</div>
            <div className="mono" style={{fontSize:14.5, fontWeight:700, color: c.danger ? 'var(--danger)' : 'var(--pine)'}}>{fmtGNF(c.value)}</div>
          </div>
        ))}
      </div>
      <p style={{fontSize:11, color:'var(--steam)', margin:'-16px 0 24px'}}>{annee}</p>

      <div className="card" style={{overflow:'hidden'}}>
        <table style={{width:'100%', borderCollapse:'collapse', fontSize:13.5}}>
          <thead>
            <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
              <th style={th}>Mois</th>
              <th style={th}>Recette brute</th>
              <th style={th}>Impayés</th>
              <th style={th}>Dépenses entreprise</th>
              <th style={th}>Dépenses propres</th>
              <th style={th}>Espèces</th>
              <th style={th}>Orange Money</th>
              <th style={th}>Net perçu</th>
              <th style={th}></th>
            </tr>
          </thead>
          <tbody>
            {donneesParMois.map(m => (
              <React.Fragment key={m.mois}>
                <tr style={{borderTop:'1px solid var(--line)'}}>
                  <td style={{...td, textTransform:'capitalize', fontWeight:600}}>
                    {m.label}
                    {m.manuel && <span className="tag" style={{fontSize:9, marginLeft:6, background:'var(--warn-light)', color:'var(--warn)'}}>Manuel</span>}
                  </td>
                  <td style={td} className="mono">{fmtGNF(m.recetteBrute)}</td>
                  <td style={{...td, color: m.impayesReel>0?'var(--danger)':'var(--steam)'}} className="mono">{m.impayesReel>0?fmtGNF(m.impayesReel):'—'}</td>
                  <td style={{...td, color: m.depenses>0?'var(--danger)':'var(--steam)'}} className="mono">{fmtGNF(m.depenses)}</td>
                  <td style={{...td, color: m.depensesPropres>0?'var(--rust)':'var(--steam)'}} className="mono">{m.depensesPropres>0?fmtGNF(m.depensesPropres):'—'}</td>
                  <td style={{...td, color:'var(--pine)'}} className="mono">{fmtGNF(m.montantRecuEspeces||0)}</td>
                  <td style={{...td, color:'var(--pine)'}} className="mono">{fmtGNF(m.montantRecuOrangeMoney||0)}</td>
                  <td style={{...td, fontWeight:700, color: m.netPercu<0?'var(--danger)':'var(--ink)'}} className="mono">{fmtGNF(m.netPercu)}</td>
                  <td style={{...td, textAlign:'right'}}>
                    <div style={{display:'flex', gap:6, justifyContent:'flex-end'}}>
                      {Object.keys(m.parEmploye||{}).length > 0 && (
                        <button className="btn btn-ghost btn-sm" onClick={()=>setMoisOuvert(moisOuvert===m.mois?null:m.mois)}>
                          {moisOuvert===m.mois ? 'Fermer' : 'Détail par caissier'}
                        </button>
                      )}
                      <button className="btn btn-sm" onClick={()=>setEmpSaisieMois({ mois: m.mois, employeId: '' })}>+ Saisir</button>
                    </div>
                  </td>
                </tr>
                {moisOuvert === m.mois && Object.keys(m.parEmploye||{}).length > 0 && (
                  <tr style={{background:'var(--paper-2)'}}>
                    <td colSpan={9} style={{padding:'10px 14px'}}>
                      {Object.entries(m.parEmploye).filter(([empId]) => empId !== '_legacy').map(([empId, v]) => (
                        <div key={empId} style={{padding:'6px 0', borderBottom:'1px solid var(--line)'}}>
                          <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:2}}>
                            <div style={{fontWeight:600, fontSize:13}}>{getEmpNom(empId)}</div>
                            <button className="btn btn-ghost btn-sm" style={{padding:'2px 8px', fontSize:11.5}} onClick={()=>setEmpSaisieMois({ mois: m.mois, employeId: empId })}>Modifier</button>
                          </div>
                          <div className="mono" style={{fontSize:12.5, color:'var(--steam)'}}>
                            Recette : {fmtGNF(v.recetteBrute)} · Impayés : {fmtGNF(v.impayes||0)} · Dép. entreprise : {fmtGNF(v.depenses)} · Dép. propres : {fmtGNF(v.depensesPropres||0)}
                          </div>
                          <div className="mono" style={{fontSize:12.5, color:'var(--pine)', marginTop:2}}>
                            Reçu Espèces : {fmtGNF(v.montantRecuEspeces||0)} · Reçu Orange Money : {fmtGNF(v.montantRecuOrangeMoney||0)}
                          </div>
                        </div>
                      ))}
                    </td>
                  </tr>
                )}
              </React.Fragment>
            ))}
            <tr style={{borderTop:'2px solid var(--line-strong)', background:'var(--paper-2)'}}>
              <td style={{...td, fontWeight:700}}>Total {annee}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(totalBrute)}</td>
              <td style={{...td, fontWeight:700}} className="mono">{totalImpayesReel>0?fmtGNF(totalImpayesReel):'—'}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(totalDepenses)}</td>
              <td style={{...td, fontWeight:700}} className="mono">{totalDepensesPropres>0?fmtGNF(totalDepensesPropres):'—'}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(donneesParMois.reduce((s,m)=>s+(m.montantRecuEspeces||0),0))}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(donneesParMois.reduce((s,m)=>s+(m.montantRecuOrangeMoney||0),0))}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(totalNetPercu)}</td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>

      {empSaisieMois && (
        <SaisieEmployeMoisModal
          site={site}
          mois={empSaisieMois.mois}
          employeIdInitial={empSaisieMois.employeId}
          valeursExistantes={(donneesParMois.find(m=>m.mois===empSaisieMois.mois)||{}).parEmploye || {}}
          onSave={(employeId, valeurs)=>saveMoisPourEmploye(empSaisieMois.mois, employeId, valeurs)}
          onClose={()=>setEmpSaisieMois(null)}
        />
      )}
    </div>
  );
}

function SaisieEmployeMoisModal({ site, mois, employeIdInitial, valeursExistantes, onSave, onClose }){
  const [employeId, setEmployeId] = useState(employeIdInitial);
  const existant = employeId ? (valeursExistantes[employeId] || {}) : {};
  const [recetteBrute, setRecetteBrute] = useState(String(existant.recetteBrute || ''));
  const [depenses, setDepenses] = useState(String(existant.depenses || ''));
  const [depensesPropres, setDepensesPropres] = useState(String(existant.depensesPropres || ''));
  const [depensesPropresDescription, setDepensesPropresDescription] = useState(existant.depensesPropresDescription || '');
  const [montantRecuEspeces, setMontantRecuEspeces] = useState(String(existant.montantRecuEspeces || ''));
  const [montantRecuOrangeMoney, setMontantRecuOrangeMoney] = useState(String(existant.montantRecuOrangeMoney || ''));

  function choisirEmploye(id){
    setEmployeId(id);
    const v = valeursExistantes[id] || {};
    setRecetteBrute(String(v.recetteBrute || ''));
    setDepenses(String(v.depenses || ''));
    setDepensesPropres(String(v.depensesPropres || ''));
    setDepensesPropresDescription(v.depensesPropresDescription || '');
    setMontantRecuEspeces(String(v.montantRecuEspeces || ''));
    setMontantRecuOrangeMoney(String(v.montantRecuOrangeMoney || ''));
  }

  const impayesCalcule = Math.max(0, (Number(recetteBrute)||0) - ((Number(montantRecuEspeces)||0) + (Number(montantRecuOrangeMoney)||0)));

  function submit(){
    if(!employeId) return;
    onSave(employeId, {
      recetteBrute: Number(recetteBrute)||0,
      impayes: impayesCalcule,
      depenses: Number(depenses)||0,
      depensesPropres: Number(depensesPropres)||0,
      depensesPropresDescription: depensesPropresDescription.trim(),
      montantRecuEspeces: Number(montantRecuEspeces)||0,
      montantRecuOrangeMoney: Number(montantRecuOrangeMoney)||0,
    });
  }

  return (
    <ModalShell title={`Saisie — ${formatMoisAnnee(new Date(2026,mois-1,1).toISOString().slice(0,7))}`} onClose={onClose} width={480}>
      <div style={{display:'grid', gap:14}}>
        <div>
          <label>Employé</label>
          <select value={employeId} onChange={e=>choisirEmploye(e.target.value)}>
            <option value="">Choisir un employé…</option>
            {site.employes.map(e => <option key={e.id} value={e.id}>{e.nom}</option>)}
          </select>
        </div>
        <div style={{display:'grid', gridTemplateColumns:'1fr 1fr', gap:12}}>
          <div><label>Recette brute</label><input type="number" value={recetteBrute} onChange={e=>setRecetteBrute(e.target.value)} /></div>
          <div><label>Dépenses entreprise</label><input type="number" value={depenses} onChange={e=>setDepenses(e.target.value)} /></div>
          <div><label>Dépenses propres</label><input type="number" value={depensesPropres} onChange={e=>setDepensesPropres(e.target.value)} /></div>
          <div><label>Description (pour situer)</label><input type="text" placeholder="Ex: avance sur salaire" value={depensesPropresDescription} onChange={e=>setDepensesPropresDescription(e.target.value)} /></div>
          <div>
            <label>Impayés (calculé)</label>
            <div className="mono" style={{padding:'8px 10px', background:'var(--paper-2)', borderRadius:8, fontSize:13, fontWeight:600}}>{fmtGNF(impayesCalcule)}</div>
          </div>
          <div><label>Reçu Espèces</label><input type="number" value={montantRecuEspeces} onChange={e=>setMontantRecuEspeces(e.target.value)} /></div>
          <div><label>Reçu Orange Money</label><input type="number" value={montantRecuOrangeMoney} onChange={e=>setMontantRecuOrangeMoney(e.target.value)} /></div>
        </div>
        <button className="btn btn-rust" style={{width:'100%'}} disabled={!employeId} onClick={submit}>Enregistrer</button>
      </div>
    </ModalShell>
  );
}

function EmployeApp({ db, setDb, siteId, employeId, onLogout }){
  const site = db.sites.find(s => s.id === siteId);
  const monProfil = (site && employeId) ? site.employes.find(e=>e.id===employeId) : null;
  const isRepasseur = monProfil && monProfil.role === 'Repasseur';
  const [page, setPage] = useState(() => {
    const pageParDefaut = isRepasseur ? 'repassage' : 'caisse';
    try {
      const today = todayISO();
      const cle = `maci-agenda-vu-${employeId}`;
      const dernierVu = localStorage.getItem(cle);
      if(dernierVu !== today){
        localStorage.setItem(cle, today);
        return 'agenda';
      }
    } catch(e){ /* localStorage indisponible — on ignore */ }
    return pageParDefaut;
  });

  function updateSite(updatedSite){
    setDb({ ...db, sites: db.sites.map(s => s.id === updatedSite.id ? updatedSite : s) });
  }

  if(!site){
    return (
      <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center'}}>
        <div style={{textAlign:'center'}}>
          <p>Ce pressing n'existe plus.</p>
          <button className="btn" onClick={onLogout}>Retour</button>
        </div>
      </div>
    );
  }

  // Espace repasseur — vue limitée
  if(isRepasseur){
    return (
      <Shell title={site.nom} role={`${monProfil.nom} — Repasseur`} navItems={[
        { key:'repassage', label:'Repassage', icon:'shirt' },
        { key:'agenda', label:'Agenda du jour', icon:'clock' },
        { key:'remuneration', label:'Ma rémunération', icon:'chart' },
        { key:'suiviRepassage', label:'Suivi repassage', icon:'euro' },
      ]} active={page} onNav={setPage} onLogout={onLogout}>
        {page === 'repassage' && <RepasseurView site={site} updateSite={updateSite} employeId={employeId} />}
        {page === 'agenda' && <AgendaView site={site} />}
        {page === 'remuneration' && <RemunerationView site={site} updateSite={updateSite} db={db} siteId={siteId} employeId={employeId} />}
        {page === 'suiviRepassage' && <PaiementsAValiderView site={site} updateSite={updateSite} employeId={employeId} />}
      </Shell>
    );
  }

  // Espace caissier/autre employé — vue complète
  const navItems = [
    { key:'caisse', label:'Caisse', icon:'ticket' },
    { key:'agenda', label:'Agenda du jour', icon:'clock' },
    { key:'clients', label:'Clients', icon:'users' },
    { key:'marketing', label:'Promos & Relances', icon:'bell' },
    { key:'stock', label:'Stock', icon:'box' },
    { key:'depenses', label:'Dépenses', icon:'euro' },
    { key:'detailMensuel', label:'Détail mensuel', icon:'chart' },
    { key:'encaissements', label:'Mes encaissements', icon:'euro' },
    { key:'performanceCaissiers', label:'Performance caissiers', icon:'chart' },
    { key:'suiviRepassage', label:'Suivi repassage', icon:'euro' },
  ];
  return (
    <Shell title={site.nom} role={`${monProfil ? monProfil.nom + ' — ' : ''}${monProfil ? monProfil.role : 'Espace employé'}`} navItems={navItems} active={page} onNav={setPage} onLogout={onLogout}>
      {page === 'caisse' && <CommandesView site={site} updateSite={updateSite} editable={true} employeId={employeId} db={db} />}
      {page === 'agenda' && <AgendaView site={site} />}
      {page === 'marketing' && <MarketingView site={site} updateSite={updateSite} />}
      {page === 'clients' && <ClientsView site={site} updateSite={updateSite} db={db} />}
      {page === 'stock' && <StockView site={site} updateSite={updateSite} db={db} />}
      {page === 'depenses' && <DepensesView site={site} updateSite={updateSite} db={db} employeId={employeId} />}
      {page === 'detailMensuel' && <DetailMensuelSiteView site={site} updateSite={updateSite} employeId={employeId} />}
      {page === 'encaissements' && <MesEncaissementsView site={site} employeId={employeId} />}
      {page === 'performanceCaissiers' && <PerformanceCaissiersView site={site} />}
      {page === 'suiviRepassage' && <RepassageApercuView site={site} updateSite={updateSite} />}
    </Shell>
  );
}

/* ===================== ESPACE CLIENT (lié à un site) ===================== */

function ClientApp({ db, setDb, siteId, clientId, onLogout }){
  const site = db.sites.find(s => s.id === siteId);
  const client = site ? site.clients.find(c => c.id === clientId) : null;

  if(!site || !client){
    return (
      <div style={{minHeight:'100vh', display:'flex', alignItems:'center', justifyContent:'center'}}>
        <div style={{textAlign:'center'}}>
          <p>Fiche client introuvable.</p>
          <button className="btn" onClick={onLogout}>Retour</button>
        </div>
      </div>
    );
  }

  const cmds = site.commandes.filter(c => c.clientId === clientId).sort((a,b)=>new Date(b.dateCreation)-new Date(a.dateCreation));
  const impayes = cmds.filter(c => c.paiement === 'impaye');
  const totalImpaye = impayes.reduce((s,c)=>s+calcCommandeTotal(c, site.services), 0);
  const enCours = cmds.filter(c => c.statut !== 'Récupéré');

  return (
    <div style={{minHeight:'100vh', padding:'2.5rem 2rem', maxWidth:840, margin:'0 auto'}}>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', marginBottom:30}}>
        <div>
          <p className="mono" style={{color:'var(--steam)', fontSize:12, margin:0}}>{site.nom}</p>
          <h1 style={{margin:'2px 0 0', fontSize:26, color:'var(--pine)'}}>Bonjour {client.nom.split(' ')[0]}</h1>
        </div>
        <button className="btn" onClick={onLogout}><Icon name="logout" size={14}/> Changer d'espace</button>
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(3,1fr)', gap:14, marginBottom:26}}>
        <StatCard label="Commandes en cours" value={enCours.length} icon="clock" />
        <StatCard label="Total commandes" value={cmds.length} icon="ticket" />
        <StatCard label="Solde impayé" value={fmtGNF(totalImpaye)} icon="euro" tone={totalImpaye>0?'danger':'default'} />
      </div>

      <h2 style={{fontSize:17, color:'var(--pine)', marginBottom:14}}>Mes commandes</h2>
      <div style={{display:'grid', gap:12}}>
        {cmds.length === 0 && (
          <div className="card" style={{padding:'2rem', textAlign:'center', color:'var(--steam)'}}>
            Vous n'avez pas encore de commande chez nous.
          </div>
        )}
        {cmds.map(c => {
          const total = calcCommandeTotal(c, site.services);
          return (
            <div key={c.id} className="card" style={{padding:'1.1rem 1.3rem', display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10}}>
              <div>
                <div style={{display:'flex', alignItems:'center', gap:10}}>
                  <span className="mono" style={{fontWeight:700}}>{c.numero}</span>
                  <span className={`tag ${STATUT_TAG_CLASS[c.statut]}`}>{c.statut}</span>
                  <span className={`tag ${c.paiement==='paye'?'tag-paye':'tag-impaye'}`}>{c.paiement==='paye'?'Payé':'Impayé'}</span>
                </div>
                <div style={{fontSize:12.5, color:'var(--steam)', marginTop:6}}>
                  {c.lignes.reduce((s,l)=>s+l.qte,0)} article(s) · déposé le {fmtDate(c.dateCreation.slice(0,10))}
                  {c.dateRetraitPrevue && ` · retrait prévu le ${fmtDate(c.dateRetraitPrevue)}`}
                </div>
              </div>
              <div className="mono" style={{fontSize:17, fontWeight:700, color:'var(--pine)'}}>{fmtGNF(total)}</div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

/* ===================== MONTAGE ===================== */

const root = ReactDOM.createRoot(document.getElementById('root'));
try {
  root.render(<App />);
} catch(e) {
  document.getElementById('root').innerHTML = '<div style="padding:2rem;font-family:monospace;color:red;"><h2>Erreur de démarrage</h2><pre>' + e.message + '\n' + e.stack + '</pre></div>';
}
</script>
</body>
</html>
