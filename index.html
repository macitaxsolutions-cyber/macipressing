/* ===================== DISTRIBUTION DES RECETTES ===================== */

const PARTS_DISTRIBUTION = [
  { nom: 'Alpha Mamoudou Bah', pct: 30 },
  { nom: 'Mamadou Sanoussy Bah', pct: 25 },
  { nom: 'Mamadou Alpha Bah', pct: 20 },
  { nom: 'Nene Djiba Bah', pct: 10 },
  { nom: 'Amadou Tidiane Bah', pct: 5 },
  { nom: 'Conservation du Capital Fixe', pct: 10 },
];

// Acteurs concernés par le remboursement d'investissement (80% versé, 20% vers Conservation du Capital Fixe)
const ACTEURS_REMBOURSEMENT_INVESTISSEMENT = ['Mamadou Sanoussy Bah', 'Mamadou Alpha Bah', 'Nene Djiba Bah', 'Amadou Tidiane Bah'];

// Certains employés (caissiers) sont aussi des acteurs de la répartition (ex: "Nene Djiba" = "Nene Djiba Bah").
// On fait correspondre les noms pour remonter automatiquement leurs dépenses propres saisies dans "Détail mensuel".
function nomsCorrespondent(nomEmploye, nomActeur){
  const mots = (nomEmploye||'').toLowerCase().trim().split(/\s+/).filter(Boolean);
  if(mots.length === 0) return false;
  const acteurLower = (nomActeur||'').toLowerCase();
  return mots.every(mot => acteurLower.includes(mot));
}

function calculerDepensesPropresEmployesParActeur(db, annee, periodeRepartition, moisRepartition, cumulRepartition){
  const parts = db.partsDistribution || PARTS_DISTRIBUTION;
  const resultat = {};
  parts.forEach(p => { resultat[p.nom] = 0; });
  db.sites.forEach(site => {
    const manuelAnnee = (site.detailMensuelManuel||{})[annee] || {};
    for(let m=1; m<=12; m++){
      if(periodeRepartition === 'mois'){
        if(cumulRepartition){ if(m > moisRepartition) continue; }
        else { if(m !== moisRepartition) continue; }
      }
      const parEmploye = normaliserMoisManuel(manuelAnnee[m]);
      if(!parEmploye) continue;
      Object.entries(parEmploye).forEach(([empId, valeurs]) => {
        if(empId === '_legacy') return;
        const emp = (site.employes||[]).find(e=>e.id===empId);
        if(!emp) return;
        const depensesPropres = Number(valeurs.depensesPropres)||0;
        if(depensesPropres <= 0) return;
        parts.forEach(p => {
          if(nomsCorrespondent(emp.nom, p.nom)) resultat[p.nom] += depensesPropres;
        });
      });
    }
  });
  return resultat;
}

const ANNEE_DEBUT_APP = 2026; // année de mise en place de l'application

function calculerDonneesAnnee(db, annee){
  if(annee >= ANNEE_DEBUT_APP){
    const parMois = {};
    for(let m=1; m<=12; m++) parMois[m] = { recetteBrute:0, depenses:0, impayes:0 };
    db.sites.forEach(site => {
      const siteManuelAnnee = (site.detailMensuelManuel||{})[annee] || {};
      for(let m=1; m<=12; m++){
        const parEmploye = normaliserMoisManuel(siteManuelAnnee[m]);
        if(parEmploye && Object.keys(parEmploye).length > 0){
          parMois[m].recetteBrute += Object.values(parEmploye).reduce((s,v)=>s+(Number(v.recetteBrute)||0),0);
          parMois[m].depenses += Object.values(parEmploye).reduce((s,v)=>s+(Number(v.depenses)||0),0);
          parMois[m].impayes += Object.values(parEmploye).reduce((s,v)=>s+(Number(v.impayes)||0),0);
        } else {
          let rb=0, encaisse=0, dep=0;
          (site.commandes||[]).forEach(c => {
            if(c.dateCreation && c.dateCreation.slice(0,4) === String(annee) && Number(c.dateCreation.slice(5,7)) === m){
              const totalCmd = calcCommandeTotal(c, site.services);
              rb += totalCmd;
              encaisse += c.paiement === 'paye' ? totalCmd : (Number(c.acompte)||0);
            }
          });
          (site.depenses||[]).forEach(d => {
            if(d.date && d.date.slice(0,4) === String(annee) && Number(d.date.slice(5,7)) === m){
              dep += Number(d.montant)||0;
            }
          });
          parMois[m].recetteBrute += rb;
          parMois[m].depenses += dep;
          parMois[m].impayes += (rb - encaisse);
        }
      }
    });
    const moisManuel = (db.historiqueAnnuel?.[annee]?.mois) || {};
    let recetteBrute = 0, depenses = 0, impayes = 0;
    for(let m=1; m<=12; m++){
      const override = moisManuel[m];
      if(override){
        recetteBrute += Number(override.recetteBrute)||0;
        depenses += Number(override.depenses)||0;
        impayes += Number(override.impayes)||0;
      } else {
        recetteBrute += parMois[m].recetteBrute;
        depenses += parMois[m].depenses;
        impayes += parMois[m].impayes;
      }
    }
    return { recetteBrute, depenses, impayes, recetteNette: recetteBrute - impayes - depenses };
  }
  const d = (db.historiqueAnnuel||{})[annee] || {};
  const recetteBrute = Number(d.recetteBrute)||0;
  const depenses = Number(d.depenses)||0;
  const impayes = Number(d.impayes)||0;
  return { recetteBrute, depenses, impayes, recetteNette: recetteBrute - impayes - depenses };
}

function ComparaisonAnneesView({ db, onOpenAnnee }){
  const currentYear = Number(todayISO().slice(0,4));
  const anneesDisponibles = [];
  for(let y = currentYear; y >= ANNEE_DEBUT_APP - 10; y--) anneesDisponibles.push(y);

  const lignes = anneesDisponibles.map(y => ({ annee: y, ...calculerDonneesAnnee(db, y) }));

  const comparaisonExportRows = lignes.map((l, i) => {
    const precedente = lignes[i+1];
    let evolution = null;
    if(precedente && precedente.recetteNette !== 0){
      evolution = ((l.recetteNette - precedente.recetteNette) / Math.abs(precedente.recetteNette)) * 100;
    }
    return [l.annee, Math.round(l.recetteBrute), Math.round(l.impayes), Math.round(l.depenses), Math.round(l.recetteNette), evolution===null ? '—' : `${evolution>=0?'+':''}${evolution.toFixed(1)}%`];
  });
  const COMPARAISON_HEADERS = ['Année', 'Recette brute', 'Impayés', 'Dépenses entreprise', 'Recette nette', 'Évolution'];

  return (
    <div>
      <PageHeader title="Comparaison annuelle" subtitle="Vue d'ensemble de toutes les années pour comparer et prendre des décisions" />
      <div style={{display:'flex', justifyContent:'flex-end', marginBottom:10}}>
        <ExportButtons
          onCSV={()=>exportTableToCSV('comparaison-annuelle', COMPARAISON_HEADERS, comparaisonExportRows)}
          onPDF={()=>exportTableToPDF({ filename:'comparaison-annuelle', title:'Comparaison annuelle', subtitle:'Maci Pressing', headers:COMPARAISON_HEADERS, rows:comparaisonExportRows })}
        />
      </div>
      <div className="card" style={{overflow:'hidden'}}>
        <table style={{width:'100%', borderCollapse:'collapse', fontSize:13.5}}>
          <thead>
            <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
              <th style={th}>Année</th>
              <th style={th}>Recette brute</th>
              <th style={th}>Impayés</th>
              <th style={th}>Dépenses entreprise</th>
              <th style={th}>Recette nette</th>
              <th style={th}>Évolution</th>
            </tr>
          </thead>
          <tbody>
            {lignes.map((l, i) => {
              const precedente = lignes[i+1];
              let evolution = null;
              if(precedente && precedente.recetteNette !== 0){
                evolution = ((l.recetteNette - precedente.recetteNette) / Math.abs(precedente.recetteNette)) * 100;
              }
              return (
                <tr key={l.annee} style={{borderTop:'1px solid var(--line)', cursor:'pointer'}} onClick={()=>onOpenAnnee(l.annee)}>
                  <td style={{...td, fontWeight:700, color:'var(--pine)'}}>{l.annee} →</td>
                  <td style={td} className="mono">{fmtGNF(l.recetteBrute)}</td>
                  <td style={{...td, color: l.impayes>0?'var(--danger)':'var(--steam)'}} className="mono">{l.impayes>0?fmtGNF(l.impayes):'—'}</td>
                  <td style={{...td, color:'var(--danger)'}} className="mono">{fmtGNF(l.depenses)}</td>
                  <td style={{...td, fontWeight:700, color: l.recetteNette<0?'var(--danger)':'var(--pine)'}} className="mono">{fmtGNF(l.recetteNette)}</td>
                  <td style={td}>
                    {evolution === null ? <span style={{color:'var(--steam)'}}>—</span> : (
                      <span style={{color: evolution>=0 ? 'var(--ok)' : 'var(--danger)', fontWeight:600}}>
                        {evolution>=0 ? '▲' : '▼'} {Math.abs(evolution).toFixed(1)}%
                      </span>
                    )}
                  </td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}

function DistributionView({ db, setDb, anneeInitiale }){
  const currentYear = Number(todayISO().slice(0,4));
  const anneesDisponibles = useMemo(() => {
    const arr = [];
    for(let y = currentYear; y >= ANNEE_DEBUT_APP - 10; y--) arr.push(y);
    return arr;
  }, [currentYear]);

  const [annee, setAnnee] = useState(anneeInitiale || currentYear);
  const parts = db.partsDistribution || PARTS_DISTRIBUTION;
  const [pctEdits, setPctEdits] = useState(() => Object.fromEntries(parts.map(p=>[p.nom, String(p.pct)])));
  const [moisOuvertConsolide, setMoisOuvertConsolide] = useState(null);
  useEffect(() => { setPctEdits(Object.fromEntries(parts.map(p=>[p.nom, String(p.pct)]))); }, [db.partsDistribution]);
  const pctModifie = parts.some(p => String(p.pct) !== (pctEdits[p.nom] ?? String(p.pct)));
  function enregistrerPcts(){
    const nouvellesParts = parts.map(p => ({ nom: p.nom, pct: Number(pctEdits[p.nom]) || 0 }));
    setDb({ ...db, partsDistribution: nouvellesParts });
  }
  const remboursementActif = db.remboursementActif !== false; // activé par défaut
  function toggleRemboursement(){
    setDb({ ...db, remboursementActif: !remboursementActif });
  }
  const estAnneeApp = annee >= ANNEE_DEBUT_APP;

  const moisActuelDefaut = (estAnneeApp && annee === currentYear) ? Number(todayISO().slice(5,7)) : 12;
  const [periodeRepartition, setPeriodeRepartition] = useState('mois'); // 'mois' | 'annee'
  const [moisRepartition, setMoisRepartition] = useState(moisActuelDefaut);
  const [cumulRepartition, setCumulRepartition] = useState(true); // cumul depuis janvier, ou ce mois seulement

  // Calcul automatique à partir des données réelles de l'app (année couverte par l'application)
  // Saisie manuelle pour les années antérieures à l'application
  const historique = db.historiqueAnnuel || {};
  const [editRecette, setEditRecette] = useState('');
  const [editDepenses, setEditDepenses] = useState('');
  const [editImpayes, setEditImpayes] = useState('');
  const [editEspeces, setEditEspeces] = useState('');
  const [editOrangeMoney, setEditOrangeMoney] = useState('');
  const [flash, setFlash] = useState(false);

  // Dépenses propres à chaque acteur (toutes années confondues) — liste détaillée avec description
  const [draftDesc, setDraftDesc] = useState({});
  const [draftMontant, setDraftMontant] = useState({});
  const [draftDate, setDraftDate] = useState({});
  const [depensesPropresPeriode, setDepensesPropresPeriode] = useState('annee');
  const [depensesPropresJour, setDepensesPropresJour] = useState(todayISO());
  const [depensesPropresMois, setDepensesPropresMois] = useState(todayISO().slice(0,7));
  const [acteurAjout, setActeurAjout] = useState('');

  useEffect(() => {
    const d = (db.historiqueAnnuel || {})[annee] || {};
    setEditRecette(d.recetteBrute ? String(d.recetteBrute) : '');
    setEditDepenses(d.depenses ? String(d.depenses) : '');
    setEditImpayes(d.impayes ? String(d.impayes) : '');
    setEditEspeces(d.especes ? String(d.especes) : '');
    setEditOrangeMoney(d.orangeMoney ? String(d.orangeMoney) : '');
  }, [annee]);

  function saveHistorique(){
    const next = {
      ...(db.historiqueAnnuel || {}),
      [annee]: { ...(db.historiqueAnnuel?.[annee]||{}), recetteBrute: Number(editRecette)||0, depenses: Number(editDepenses)||0, impayes: Number(editImpayes)||0, especes: Number(editEspeces)||0, orangeMoney: Number(editOrangeMoney)||0 },
    };
    setDb({ ...db, historiqueAnnuel: next });
    setFlash(true);
    setTimeout(()=>setFlash(false), 1800);
  }

  function ajouterDepenseActeur(nomActeur){
    const desc = (draftDesc['_form']||'').trim();
    const montant = Number(draftMontant['_form'])||0;
    const date = draftDate['_form'] || todayISO();
    if(!desc || montant<=0 || !nomActeur) return;
    const entry = { id: uid('depact_'), description: desc, montant, date };
    const anneeActuelle = (db.historiqueAnnuel||{})[annee] || {};
    const listeActuelle = (anneeActuelle.depensesActeurs||{})[nomActeur] || [];
    const nextDepensesActeurs = { ...(anneeActuelle.depensesActeurs||{}), [nomActeur]: [...listeActuelle, entry] };
    setDb({ ...db, historiqueAnnuel: { ...(db.historiqueAnnuel||{}), [annee]: { ...anneeActuelle, depensesActeurs: nextDepensesActeurs } } });
    setDraftDesc({...draftDesc, _form: ''});
    setDraftMontant({...draftMontant, _form: ''});
    setDraftDate({...draftDate, _form: todayISO()});
    setActeurAjout('');
  }

  function supprimerDepenseActeur(nomActeur, entryId){
    const anneeActuelle = (db.historiqueAnnuel||{})[annee] || {};
    const listeActuelle = (anneeActuelle.depensesActeurs||{})[nomActeur] || [];
    const nextDepensesActeurs = { ...(anneeActuelle.depensesActeurs||{}), [nomActeur]: listeActuelle.filter(e=>e.id!==entryId) };
    setDb({ ...db, historiqueAnnuel: { ...(db.historiqueAnnuel||{}), [annee]: { ...anneeActuelle, depensesActeurs: nextDepensesActeurs } } });
  }

  const dataHisto = historique[annee] || { recetteBrute: 0, depenses: 0, impayes: 0, especes: 0, orangeMoney: 0 };

  // Détail mensuel — données réelles de l'app, avec possibilité de saisie/correction manuelle mois par mois
  const donneesParMois = useMemo(() => {
    if(!estAnneeApp) return null;
    return calculerDonneesMensuellesMultiSites(db.sites, annee);
  }, [db, annee, estAnneeApp]);

  // Pour les années antérieures à la mise en place de l'app : détail mensuel saisi manuellement (12 mois)
  const detailMensuelHistoManuel = ((db.historiqueAnnuel||{})[annee]||{}).detailMensuelParMois || {};
  const donneesParMoisHistorique = useMemo(() => {
    if(estAnneeApp) return null;
    return Array.from({length:12}, (_,i) => {
      const mois = i+1;
      const v = detailMensuelHistoManuel[mois] || {};
      const rb = Number(v.recetteBrute)||0;
      const dep = Number(v.depenses)||0;
      const depP = Number(v.depensesPropres)||0;
      const esp = Number(v.montantRecuEspeces)||0;
      const om = Number(v.montantRecuOrangeMoney)||0;
      const impayesReel = Math.max(0, rb - (esp + om));
      const netPercu = (esp + om) - dep;
      return {
        mois, label: new Date(annee, i, 1).toLocaleDateString('fr-FR', {month:'long'}),
        avantSeuil: true, recetteBrute: rb, impayes: impayesReel, depenses: dep, depensesPropres: depP,
        montantRecuEspeces: esp, montantRecuOrangeMoney: om, impayesReel, netPercu,
        manuel: Object.keys(v).length > 0, parEmployeParSite: [],
      };
    });
  }, [estAnneeApp, detailMensuelHistoManuel, annee]);

  const donneesParMoisAffiche = estAnneeApp ? donneesParMois : donneesParMoisHistorique;

  function saveMoisHistorique(mois, valeurs){
    const anneeActuelle = (db.historiqueAnnuel||{})[annee] || {};
    const detailActuel = anneeActuelle.detailMensuelParMois || {};
    const nextDetail = { ...detailActuel, [mois]: valeurs };
    setDb({ ...db, historiqueAnnuel: { ...(db.historiqueAnnuel||{}), [annee]: { ...anneeActuelle, detailMensuelParMois: nextDetail } } });
  }
  const [moisSaisieHisto, setMoisSaisieHisto] = useState(null);

  const anneeADetailMensuel = !estAnneeApp && Object.keys(detailMensuelHistoManuel).length > 0;
  const recetteBrute = estAnneeApp ? (donneesParMois ? donneesParMois.reduce((s,m)=>s+m.recetteBrute,0) : 0) : (anneeADetailMensuel ? donneesParMoisHistorique.reduce((s,m)=>s+m.recetteBrute,0) : dataHisto.recetteBrute);
  const depensesAnnee = estAnneeApp ? (donneesParMois ? donneesParMois.reduce((s,m)=>s+m.depenses,0) : 0) : (anneeADetailMensuel ? donneesParMoisHistorique.reduce((s,m)=>s+m.depenses,0) : dataHisto.depenses);
  const impayesAnnee = estAnneeApp ? (donneesParMois ? donneesParMois.reduce((s,m)=>s+m.impayes,0) : 0) : (Number(dataHisto.impayes)||0);
  const depensesPropresAnnee = estAnneeApp ? (donneesParMois ? donneesParMois.reduce((s,m)=>s+m.depensesPropres,0) : 0) : (anneeADetailMensuel ? donneesParMoisHistorique.reduce((s,m)=>s+m.depensesPropres,0) : 0);
  const impayesReelAnnee = estAnneeApp ? (donneesParMois ? donneesParMois.reduce((s,m)=>s+(m.impayesReel||0),0) : 0) : (anneeADetailMensuel ? donneesParMoisHistorique.reduce((s,m)=>s+(m.impayesReel||0),0) : Math.max(0, (Number(dataHisto.recetteBrute)||0) - ((Number(dataHisto.especes)||0) + (Number(dataHisto.orangeMoney)||0))));
  const netPercuAnnee = estAnneeApp ? (donneesParMois ? donneesParMois.reduce((s,m)=>s+(m.netPercu||0),0) : 0) : (anneeADetailMensuel ? donneesParMoisHistorique.reduce((s,m)=>s+(m.netPercu||0),0) : ((Number(dataHisto.especes)||0) + (Number(dataHisto.orangeMoney)||0) - (Number(dataHisto.depenses)||0)));
  const recetteEncaissee = recetteBrute - impayesAnnee;
  const recetteNette = recetteEncaissee - depensesAnnee;
  const depensesActeursActuel = dataHisto.depensesActeurs || {}; // { [nom]: [{id, description, montant}] }
  const totalDepensesActeurs = parts.reduce((s,p)=> s + ((depensesActeursActuel[p.nom]||[]).reduce((s2,e)=>s2+(Number(e.montant)||0),0)), 0);

  // ---- Calculs spécifiques à la période choisie pour la répartition (mois / cumul depuis janvier / année entière) ----
  function filtrerDepensesParPeriode(entries){
    if(!entries) return [];
    if(periodeRepartition === 'annee') return entries;
    return entries.filter(e => {
      if(!e.date) return true; // dépenses sans date (saisies avant cette fonctionnalité) : toujours comptées
      const m = Number(e.date.slice(5,7));
      return cumulRepartition ? m <= moisRepartition : m === moisRepartition;
    });
  }

  const nomMoisRepartition = new Date(annee, moisRepartition-1, 1).toLocaleDateString('fr-FR',{month:'long'});
  const periodeLabel = periodeRepartition === 'annee' || !estAnneeApp
    ? `Année ${annee}`
    : (cumulRepartition ? `Janvier à ${nomMoisRepartition} ${annee}` : `${nomMoisRepartition} ${annee}`);

  const periodeDonnees = (periodeRepartition === 'mois' && estAnneeApp && donneesParMois)
    ? (() => {
        const subset = cumulRepartition
          ? donneesParMois.filter(m => m.mois <= moisRepartition)
          : donneesParMois.filter(m => m.mois === moisRepartition);
        const rb = subset.reduce((s,m)=>s+m.recetteBrute,0);
        const dep = subset.reduce((s,m)=>s+m.depenses,0);
        const impR = subset.reduce((s,m)=>s+(m.impayesReel||0),0);
        const netP = subset.reduce((s,m)=>s+(m.netPercu||0),0);
        const especesP = subset.reduce((s,m)=>s+(m.montantRecuEspeces||0),0);
        const orangeMoneyP = subset.reduce((s,m)=>s+(m.montantRecuOrangeMoney||0),0);
        return { recetteBrute: rb, depenses: dep, impayes: impR, recetteNette: netP, especes: especesP, orangeMoney: orangeMoneyP };
      })()
    : { recetteBrute, depenses: depensesAnnee, impayes: impayesReelAnnee, recetteNette: netPercuAnnee,
        especes: donneesParMois ? donneesParMois.reduce((s,m)=>s+(m.montantRecuEspeces||0),0) : (anneeADetailMensuel ? donneesParMoisHistorique.reduce((s,m)=>s+(m.montantRecuEspeces||0),0) : (Number(dataHisto.especes)||0)),
        orangeMoney: donneesParMois ? donneesParMois.reduce((s,m)=>s+(m.montantRecuOrangeMoney||0),0) : (anneeADetailMensuel ? donneesParMoisHistorique.reduce((s,m)=>s+(m.montantRecuOrangeMoney||0),0) : (Number(dataHisto.orangeMoney)||0)) };

  const depensesActeursPeriode = {};
  parts.forEach(p => { depensesActeursPeriode[p.nom] = filtrerDepensesParPeriode(depensesActeursActuel[p.nom]); });
  const depensesPropresEmployes = useMemo(
    () => calculerDepensesPropresEmployesParActeur(db, annee, periodeRepartition, moisRepartition, cumulRepartition),
    [db, annee, periodeRepartition, moisRepartition, cumulRepartition]
  );
  const totalDepensesActeursPeriode = parts.reduce((s,p)=> s + (depensesActeursPeriode[p.nom]||[]).reduce((s2,e)=>s2+(Number(e.montant)||0),0) + (depensesPropresEmployes[p.nom]||0), 0);

  // ---- Totaux encaissés par mode de paiement (Espèces / Orange Money), pour la période choisie ----
  const totauxParMode = useMemo(() => {
    const totaux = {};
    db.sites.forEach(site => {
      (site.commandes||[]).forEach(c => {
        getPaiementsCommande(c).forEach(pmt => {
          if(!pmt.date) return;
          const d = pmt.date.slice(0,10);
          const y = Number(d.slice(0,4)), m = Number(d.slice(5,7));
          if(y !== annee) return;
          if(periodeRepartition === 'mois' && estAnneeApp){
            if(cumulRepartition){ if(m > moisRepartition) return; }
            else { if(m !== moisRepartition) return; }
          }
          const mode = pmt.mode || 'Espèces';
          totaux[mode] = (totaux[mode]||0) + Number(pmt.montant);
        });
      });
    });
    return totaux;
  }, [db, annee, periodeRepartition, moisRepartition, cumulRepartition, estAnneeApp]);

  // ---- Historique détaillé des paiements individuels (Espèces / Orange Money), pour traçabilité ----
  const [historiquePage, setHistoriquePage] = useState(1);
  const [modeHistoriqueSelectionne, setModeHistoriqueSelectionne] = useState(null);
  const historiquePaiements = useMemo(() => {
    const liste = [];
    db.sites.forEach(site => {
      (site.commandes||[]).forEach(c => {
        const client = (site.clients||[]).find(cl => cl.id === c.clientId);
        getPaiementsCommande(c).forEach(pmt => {
          if(!pmt.date) return;
          const d = pmt.date.slice(0,10);
          const y = Number(d.slice(0,4)), m = Number(d.slice(5,7));
          if(y !== annee) return;
          if(periodeRepartition === 'mois' && estAnneeApp){
            if(cumulRepartition){ if(m > moisRepartition) return; }
            else { if(m !== moisRepartition) return; }
          }
          const employeAttribue = pmt.employeId != null ? pmt.employeId : (c.caissierEmpId || null);
          const employe = employeAttribue ? (site.employes||[]).find(e=>e.id===employeAttribue) : null;
          liste.push({
            id: pmt.id || `${c.id}_${pmt.date}`,
            date: pmt.date,
            site: site.nom,
            ticket: c.numero,
            client: client ? client.nom : 'Client inconnu',
            employe: employe ? employe.nom : '—',
            mode: pmt.mode || 'Espèces',
            montant: Number(pmt.montant)
          });
        });
      });
    });
    return liste.sort((a,b) => new Date(b.date) - new Date(a.date));
  }, [db, annee, periodeRepartition, moisRepartition, cumulRepartition, estAnneeApp]);

  useEffect(() => { setHistoriquePage(1); }, [annee, periodeRepartition, moisRepartition, cumulRepartition]);

  // Remboursement d'investissement : 20% du net perçu des 4 acteurs concernés est redirigé vers la Conservation du Capital Fixe
  const totalRedirigeVersCapitalFixe = remboursementActif ? parts.reduce((s,p) => {
    if(!ACTEURS_REMBOURSEMENT_INVESTISSEMENT.includes(p.nom)) return s;
    const montantBrutP = periodeDonnees.recetteNette * p.pct / 100;
    const depensePropreP = (depensesActeursPeriode[p.nom]||[]).reduce((s2,e)=>s2+(Number(e.montant)||0),0) + (depensesPropresEmployes[p.nom]||0);
    const montantNetP = montantBrutP - depensePropreP;
    return s + montantNetP * 0.2;
  }, 0) : 0;

  // ---- Données du tableau "Répartition entre les acteurs", pour export CSV/PDF ----
  const lignesRepartitionExport = useMemo(() => {
    return parts.map(p => {
      const impayesPart = periodeDonnees.impayes * p.pct / 100;
      const montantBrut = periodeDonnees.recetteNette * p.pct / 100;
      const montantBrutAvantImpayes = periodeDonnees.recetteBrute * p.pct / 100;
      const depensePropre = (depensesActeursPeriode[p.nom]||[]).reduce((s,e)=>s+(Number(e.montant)||0),0) + (depensesPropresEmployes[p.nom]||0);
      const montantNet = montantBrut - depensePropre;
      const cumule = impayesPart + montantNet;
      const estConcerne = remboursementActif && ACTEURS_REMBOURSEMENT_INVESTISSEMENT.includes(p.nom);
      const montantAVerser = p.nom === 'Conservation du Capital Fixe'
        ? montantNet + totalRedirigeVersCapitalFixe
        : (estConcerne ? montantNet * 0.8 : montantNet);
      return [p.nom, `${p.pct}%`, Math.round(montantBrutAvantImpayes), Math.round(impayesPart), Math.round(montantBrut), Math.round(depensePropre), Math.round(montantNet), Math.round(montantAVerser)];
    });
  }, [periodeDonnees, depensesActeursPeriode, depensesPropresEmployes, remboursementActif, totalRedirigeVersCapitalFixe]);
  const REPARTITION_HEADERS = ['Bénéficiaire', 'Part', "Montant brut avant impayés", 'Impayés (part)', 'Net perçu (avant dépenses propres)', 'Dépenses propres', 'Net perçu', 'Montant à verser'];

  return (
    <div>
      <PageHeader title="Distribution des recettes" subtitle="Répartition annuelle du bénéfice net entre les acteurs du pressing" />

      <div className="card" style={{padding:'1.1rem 1.5rem', marginBottom:20, display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:12, background: remboursementActif ? 'var(--warn-light)' : 'var(--paper-2)'}}>
        <div>
          <div style={{fontWeight:700, fontSize:14, color: remboursementActif ? '#7a5c00' : 'var(--ink)'}}>💰 Remboursement de l'investissement en cours</div>
          <div style={{fontSize:12.5, color: remboursementActif ? '#7a5c00' : 'var(--steam)', marginTop:2}}>
            Quand actif, {ACTEURS_REMBOURSEMENT_INVESTISSEMENT.join(', ')} reçoivent 80% de leur net perçu — les 20% restants vont à la Conservation du Capital Fixe pour vous rembourser, sans les bloquer.
          </div>
        </div>
        <button className="btn btn-sm" onClick={toggleRemboursement} style={{background: remboursementActif ? 'var(--warn)' : 'transparent', color: remboursementActif ? 'var(--white)' : 'var(--ink)', borderColor: remboursementActif ? 'var(--warn)' : 'var(--line-strong)', flexShrink:0}}>
          {remboursementActif ? 'Désactiver' : 'Activer'}
        </button>
      </div>

      <div style={{display:'flex', gap:14, marginBottom:20, alignItems:'center', flexWrap:'wrap'}}>
        <label style={{margin:0}}>Année :</label>
        <select value={annee} onChange={e=>setAnnee(Number(e.target.value))} style={{width:'auto', minWidth:120}}>
          {anneesDisponibles.map(y => <option key={y} value={y}>{y}</option>)}
        </select>
        {!estAnneeApp && (
          <span className="tag" style={{background:'var(--warn-light)', color:'var(--warn)'}}>Année antérieure à l'application — saisie manuelle</span>
        )}
      </div>

      {!estAnneeApp && (
        <div className="card" style={{padding:'1.5rem', marginBottom:20, background:'var(--warn-light)', border:'1.5px solid var(--warn)'}}>
          <h3 style={{margin:'0 0 6px', fontSize:15}}>Saisie des données de {annee}</h3>
          <p style={{fontSize:12.5, color:'#7a5c00', margin:'0 0 14px', lineHeight:1.5}}>
            Cette année n'est pas couverte par l'application (mise en place en {ANNEE_DEBUT_APP}). Entrez les montants connus pour calculer la répartition de cette période.
          </p>
          <div style={{display:'grid', gridTemplateColumns:'1fr 1fr 1fr', gap:14}}>
            <div>
              <label>Recette brute de l'année (GNF)</label>
              <input type="number" value={editRecette} onChange={e=>setEditRecette(e.target.value)} placeholder="0" />
            </div>
            <div>
              <label>Dépenses de l'entreprise (GNF)</label>
              <input type="number" value={editDepenses} onChange={e=>setEditDepenses(e.target.value)} placeholder="0" />
            </div>
            <div>
              <label>Factures non payées (GNF)</label>
              <input type="number" value={editImpayes} onChange={e=>setEditImpayes(e.target.value)} placeholder="0" />
            </div>
            <div>
              <label>Reçu en Espèces (GNF)</label>
              <input type="number" value={editEspeces} onChange={e=>setEditEspeces(e.target.value)} placeholder="0" />
            </div>
            <div>
              <label>Reçu en Orange Money (GNF)</label>
              <input type="number" value={editOrangeMoney} onChange={e=>setEditOrangeMoney(e.target.value)} placeholder="0" />
            </div>
          </div>
          <p style={{fontSize:11.5, color:'#7a5c00', margin:'10px 0 0', lineHeight:1.4}}>
            Le montant des factures non payées est déduit de la recette brute — il ne sera pas compté dans la recette nette à distribuer, puisqu'il n'a jamais été réellement encaissé.
          </p>
          <button className="btn btn-rust" style={{marginTop:14}} onClick={saveHistorique}>
            {flash ? <><Icon name="check" size={14}/> Enregistré !</> : `Enregistrer les données de ${annee}`}
          </button>
        </div>
      )}

      <div className="card" style={{padding:'1.5rem', marginBottom:20}}>
        <h3 style={{margin:'0 0 6px', fontSize:15}}>💰 Dépenses propres de chaque acteur — {annee}</h3>
        <p style={{fontSize:12.5, color:'var(--steam)', margin:'0 0 16px', lineHeight:1.5}}>
          Dépenses personnelles engagées par chaque acteur sur son propre compte (avances, retraits, achats personnels…). Elles seront déduites de sa part pour refléter son montant net réel — sans affecter la recette nette globale de l'entreprise. Si un acteur est aussi caissier dans un pressing, ses « dépenses propres » saisies dans « Détail mensuel » s'ajoutent automatiquement ici.
        </p>

        {(() => {
          const acteursSansCapitalFixe = parts.filter(p => p.nom !== 'Conservation du Capital Fixe');
          const toutesEntrees = [];
          acteursSansCapitalFixe.forEach(p => {
            (depensesActeursActuel[p.nom]||[]).forEach(e => toutesEntrees.push({ ...e, nomActeur: p.nom }));
          });
          // Ajoute les « dépenses propres » saisies par chaque caissier dans Détail mensuel (par pressing)
          db.sites.forEach(site => {
            const manuelAnnee = (site.detailMensuelManuel||{})[annee] || {};
            for(let m=1; m<=12; m++){
              const parEmploye = normaliserMoisManuel(manuelAnnee[m]) || {};
              Object.entries(parEmploye).forEach(([empId, v]) => {
                const montantDp = Number(v.depensesPropres)||0;
                if(montantDp <= 0 || empId === '_legacy') return;
                const emp = site.employes.find(e => e.id === empId);
                if(!emp) return;
                const acteurCorrespondant = acteursSansCapitalFixe.find(p => nomsCorrespondent(emp.nom, p.nom));
                if(!acteurCorrespondant) return;
                const moisStr = String(m).padStart(2,'0');
                const descriptionSaisie = (v.depensesPropresDescription||'').trim();
                toutesEntrees.push({
                  id: `dm_${site.id}_${m}_${empId}`,
                  date: `${annee}-${moisStr}-01`,
                  description: descriptionSaisie || `Dépenses propres — ${site.nom}`,
                  montant: montantDp,
                  nomActeur: acteurCorrespondant.nom,
                  depuisDetailMensuel: true,
                });
              });
            }
          });
          const entreesFiltrees = toutesEntrees.filter(e => {
            if(!e.date) return depensesPropresPeriode === 'annee';
            if(depensesPropresPeriode === 'jour') return e.date === depensesPropresJour;
            if(depensesPropresPeriode === 'mois') return e.date.slice(0,7) === depensesPropresMois;
            return e.date.slice(0,4) === String(annee);
          }).sort((a,b) => new Date(b.date||0) - new Date(a.date||0));
          const totalFiltre = entreesFiltrees.reduce((s,e)=>s+(Number(e.montant)||0),0);

          // Cumulé toutes années, tous pressings confondus, par acteur
          const cumuleToutesAnneesParActeur = {};
          acteursSansCapitalFixe.forEach(p => { cumuleToutesAnneesParActeur[p.nom] = 0; });
          Object.values(db.historiqueAnnuel||{}).forEach(anneeData => {
            Object.entries(anneeData.depensesActeurs||{}).forEach(([nomActeur, entries]) => {
              if(cumuleToutesAnneesParActeur[nomActeur] === undefined) return;
              cumuleToutesAnneesParActeur[nomActeur] += (entries||[]).reduce((s,e)=>s+(Number(e.montant)||0),0);
            });
          });
          db.sites.forEach(site => {
            Object.values(site.detailMensuelManuel||{}).forEach(anneeManuel => {
              Object.values(anneeManuel).forEach(moisData => {
                const parEmploye = normaliserMoisManuel(moisData) || {};
                Object.entries(parEmploye).forEach(([empId, v]) => {
                  if(empId === '_legacy') return;
                  const emp = site.employes.find(e => e.id === empId);
                  if(!emp) return;
                  const acteurCorrespondant = acteursSansCapitalFixe.find(p => nomsCorrespondent(emp.nom, p.nom));
                  if(!acteurCorrespondant) return;
                  cumuleToutesAnneesParActeur[acteurCorrespondant.nom] += Number(v.depensesPropres)||0;
                });
              });
            });
          });

          return (
            <>
              <div style={{display:'flex', gap:8, marginBottom:14, flexWrap:'wrap', alignItems:'center'}}>
                {['jour','mois','annee'].map(v => (
                  <button key={v} className="btn btn-sm" onClick={()=>setDepensesPropresPeriode(v)}
                    style={{background:depensesPropresPeriode===v?'var(--pine)':'transparent', color:depensesPropresPeriode===v?'var(--white)':'var(--ink)', borderColor:depensesPropresPeriode===v?'var(--pine)':'var(--line-strong)', textTransform:'capitalize'}}>
                    {v === 'jour' ? 'Jour' : v === 'mois' ? 'Mois' : 'Année'}
                  </button>
                ))}
                {depensesPropresPeriode === 'jour' && (
                  <input type="date" value={depensesPropresJour} onChange={e=>setDepensesPropresJour(e.target.value)} style={{width:'auto'}} />
                )}
                {depensesPropresPeriode === 'mois' && (
                  <input type="month" value={depensesPropresMois} onChange={e=>setDepensesPropresMois(e.target.value)} style={{width:'auto'}} />
                )}
              </div>

              <div className="card" style={{overflow:'hidden', marginBottom:16}}>
                <table style={{width:'100%', borderCollapse:'collapse', fontSize:13.5}}>
                  <thead>
                    <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
                      <th style={th}>Mois</th>
                      <th style={th}>Nom</th>
                      <th style={th}>Description</th>
                      <th style={th}>Montant</th>
                      <th style={th}></th>
                    </tr>
                  </thead>
                  <tbody>
                    {entreesFiltrees.length === 0 ? (
                      <tr><td colSpan={5} style={{...td, textAlign:'center', color:'var(--steam)', padding:'1.5rem'}}>Aucune dépense propre sur cette période.</td></tr>
                    ) : entreesFiltrees.map(e => (
                      <tr key={e.id} style={{borderTop:'1px solid var(--line)'}}>
                        <td style={{...td, textTransform: e.depuisDetailMensuel ? 'capitalize' : 'none'}}>{e.date ? (e.depuisDetailMensuel ? formatMoisAnnee(e.date.slice(0,7)) : fmtDate(e.date)) : '—'}</td>
                        <td style={{...td, fontWeight:600}}>{e.nomActeur}</td>
                        <td style={td}>
                          {e.description}
                          {e.depuisDetailMensuel && <span className="tag" style={{marginLeft:6, fontSize:9.5, background:'var(--pine-light)', color:'var(--pine)'}}>Détail mensuel</span>}
                        </td>
                        <td style={{...td, color:'var(--danger)', fontWeight:600}} className="mono">{fmtGNF(e.montant)}</td>
                        <td style={{...td, textAlign:'right'}}>
                          {!e.depuisDetailMensuel && (
                            <button className="btn btn-ghost btn-sm" style={{color:'var(--danger)'}} onClick={()=>supprimerDepenseActeur(e.nomActeur, e.id)}><Icon name="trash" size={13}/></button>
                          )}
                        </td>
                      </tr>
                    ))}
                    {entreesFiltrees.length > 0 && (
                      <tr style={{borderTop:'2px solid var(--line-strong)', background:'var(--paper-2)'}}>
                        <td colSpan={3} style={{...td, fontWeight:700}}>Total</td>
                        <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(totalFiltre)}</td>
                        <td></td>
                      </tr>
                    )}
                  </tbody>
                </table>
              </div>

              <h4 style={{fontSize:13, color:'var(--pine)', margin:'0 0 8px'}}>Cumulé toutes années (tous pressings confondus)</h4>
              <div className="card" style={{overflow:'hidden', marginBottom:16}}>
                <table style={{width:'100%', borderCollapse:'collapse', fontSize:13}}>
                  <tbody>
                    {acteursSansCapitalFixe.map(p => (
                      <tr key={p.nom} style={{borderTop:'1px solid var(--line)'}}>
                        <td style={{...td, fontWeight:600}}>{p.nom}</td>
                        <td style={{...td, textAlign:'right', color:'var(--danger)', fontWeight:600}} className="mono">
                          {cumuleToutesAnneesParActeur[p.nom]>0 ? '− '+fmtGNF(cumuleToutesAnneesParActeur[p.nom]) : '—'}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>

              <div style={{display:'grid', gridTemplateColumns:'1.1fr 1.4fr 0.9fr 0.9fr auto', gap:8}}>
                <select value={acteurAjout} onChange={e=>setActeurAjout(e.target.value)}>
                  <option value="">Acteur…</option>
                  {acteursSansCapitalFixe.map(p => <option key={p.nom} value={p.nom}>{p.nom}</option>)}
                </select>
                <input type="text" placeholder="Description (ex: avance sur salaire)" value={draftDesc['_form']||''} onChange={e=>setDraftDesc({...draftDesc, _form: e.target.value})} />
                <input type="number" placeholder="Montant" value={draftMontant['_form']||''} onChange={e=>setDraftMontant({...draftMontant, _form: e.target.value})} />
                <input type="date" value={draftDate['_form']||todayISO()} onChange={e=>setDraftDate({...draftDate, _form: e.target.value})} />
                <button className="btn btn-sm" disabled={!acteurAjout || !(draftDesc['_form']||'').trim() || !draftMontant['_form']}
                  onClick={()=>{ ajouterDepenseActeur(acteurAjout); }}>
                  <Icon name="plus" size={13}/> Ajouter
                </button>
              </div>
            </>
          );
        })()}
      </div>

      {donneesParMoisAffiche && (
        <>
          <h2 style={{fontSize:16, color:'var(--pine)', marginBottom:6}}>Détail mensuel — {annee} (synthèse de tous les pressings)</h2>
          <p style={{fontSize:12.5, color:'var(--steam)', margin:'0 0 14px', lineHeight:1.5}}>
            « Dépenses entreprise » = dépenses des pressings (fournitures, factures, salaires...). « Dépenses propres » = dépenses personnelles saisies par chaque caissier. « Net perçu » = Espèces + Orange Money réellement reçus, moins les dépenses entreprise, tous pressings confondus. Lecture seule pour les mois calculés automatiquement (année {ANNEE_DEBUT_APP} et après) — corrigez-les dans le Détail mensuel du pressing concerné. Pour les années antérieures, utilisez le bouton « + Saisir » de chaque mois.
          </p>
          <p style={{fontSize:12.5, background:'var(--pine-light)', color:'var(--pine)', padding:'8px 12px', borderRadius:8, margin:'0 0 14px', lineHeight:1.5}}>
            🔎 Vous cherchez le détail saisi par chaque caissier ? Cliquez « Détail par caissier » sur une ligne ci-dessous, ou allez dans <strong>« Mes pressings »</strong>, ouvrez le pressing concerné, puis son onglet <strong>« Détail mensuel »</strong>.
          </p>

          <div style={{display:'grid', gridTemplateColumns:'repeat(8, 1fr)', gap:8, marginBottom:24}}>
            {[
              { label: 'Recette brute', value: recetteBrute, danger: false },
              { label: 'Impayés', value: impayesReelAnnee, danger: impayesReelAnnee>0 },
              { label: 'Dép. entreprise', value: depensesAnnee, danger: true },
              { label: 'Dép. propres', value: depensesPropresAnnee, danger: true },
              { label: 'Espèces', value: donneesParMoisAffiche.reduce((s,m)=>s+(m.montantRecuEspeces||0),0), danger: false },
              { label: 'Orange Money', value: donneesParMoisAffiche.reduce((s,m)=>s+(m.montantRecuOrangeMoney||0),0), danger: false },
              { label: 'Total perçu', value: donneesParMoisAffiche.reduce((s,m)=>s+(m.montantRecuEspeces||0)+(m.montantRecuOrangeMoney||0),0), danger: false },
              { label: 'Net perçu', value: netPercuAnnee, danger: netPercuAnnee<0 },
            ].map((c,i) => (
              <div key={i} className="card" style={{padding:'0.7rem 0.8rem'}}>
                <div style={{fontSize:10, color:'var(--steam)', textTransform:'uppercase', letterSpacing:'0.02em', fontWeight:600, lineHeight:1.3, marginBottom:4}}>{c.label}</div>
                <div className="mono" style={{fontSize:14.5, fontWeight:700, color: c.danger ? 'var(--danger)' : 'var(--pine)'}}>{fmtGNF(c.value)}</div>
              </div>
            ))}
          </div>
          <p style={{fontSize:11, color:'var(--steam)', margin:'-20px 0 24px'}}>{annee}</p>

          <div className="card" style={{overflow:'hidden', marginBottom:24}}>
            <table style={{width:'100%', borderCollapse:'collapse', fontSize:13.5}}>
              <thead>
                <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
                  <th style={th}>Mois</th>
                  <th style={th}>Recette brute</th>
                  <th style={th}>Impayés</th>
                  <th style={th}>Dépenses entreprise</th>
                  <th style={th}>Dépenses propres</th>
                  <th style={th}>Espèces</th>
                  <th style={th}>Orange Money</th>
                  <th style={th}>Net perçu</th>
                  <th style={th}></th>
                </tr>
              </thead>
              <tbody>
                {donneesParMoisAffiche.map(m => (
                  <React.Fragment key={m.mois}>
                    <tr style={{borderTop:'1px solid var(--line)'}}>
                      <td style={{...td, textTransform:'capitalize', fontWeight:600}}>
                        {m.label}
                        {m.manuel && <span className="tag" style={{fontSize:9, marginLeft:6, background:'var(--warn-light)', color:'var(--warn)'}}>Manuel</span>}
                      </td>
                      <td style={td} className="mono">{fmtGNF(m.recetteBrute)}</td>
                      <td style={{...td, color: m.impayesReel>0?'var(--danger)':'var(--steam)'}} className="mono">{m.impayesReel>0?fmtGNF(m.impayesReel):'—'}</td>
                      <td style={{...td, color: m.depenses>0?'var(--danger)':'var(--steam)'}} className="mono">{fmtGNF(m.depenses)}</td>
                      <td style={{...td, color: m.depensesPropres>0?'var(--rust)':'var(--steam)'}} className="mono">{m.depensesPropres>0?fmtGNF(m.depensesPropres):'—'}</td>
                      <td style={{...td, color:'var(--pine)'}} className="mono">{fmtGNF(m.montantRecuEspeces||0)}</td>
                      <td style={{...td, color:'var(--pine)'}} className="mono">{fmtGNF(m.montantRecuOrangeMoney||0)}</td>
                      <td style={{...td, fontWeight:700, color: m.netPercu<0?'var(--danger)':'var(--ink)'}} className="mono">{fmtGNF(m.netPercu)}</td>
                      <td style={{...td, textAlign:'right'}}>
                        <div style={{display:'flex', gap:6, justifyContent:'flex-end'}}>
                          {m.parEmployeParSite.length > 0 && (
                            <button className="btn btn-ghost btn-sm" onClick={()=>setMoisOuvertConsolide(moisOuvertConsolide===m.mois?null:m.mois)}>
                              {moisOuvertConsolide===m.mois ? 'Fermer' : 'Détail par caissier'}
                            </button>
                          )}
                          {!estAnneeApp && (
                            <button className="btn btn-sm" onClick={()=>setMoisSaisieHisto(m.mois)}>+ Saisir</button>
                          )}
                        </div>
                      </td>
                    </tr>
                    {moisOuvertConsolide === m.mois && m.parEmployeParSite.length > 0 && (
                      <tr style={{background:'var(--paper-2)'}}>
                        <td colSpan={9} style={{padding:'10px 14px'}}>
                          {m.parEmployeParSite.map(({siteNom, parEmploye}) => (
                            <div key={siteNom} style={{marginBottom:10}}>
                              <div style={{fontWeight:700, fontSize:13, color:'var(--pine)', marginBottom:4}}>{siteNom}</div>
                              {Object.entries(parEmploye).filter(([empId]) => empId !== '_legacy').map(([empId, v]) => (
                                <div key={empId} style={{padding:'6px 0', borderBottom:'1px solid var(--line)'}}>
                                  <div style={{fontWeight:600, fontSize:13, marginBottom:2}}>{getEmpNomMultiSites(db.sites, empId)}</div>
                                  <div className="mono" style={{fontSize:12.5, color:'var(--steam)'}}>
                                    Recette : {fmtGNF(v.recetteBrute)} · Impayés : {fmtGNF(v.impayes||0)} · Dép. entreprise : {fmtGNF(v.depenses)} · Dép. propres : {fmtGNF(v.depensesPropres||0)}
                                  </div>
                                  <div className="mono" style={{fontSize:12.5, color:'var(--pine)', marginTop:2}}>
                                    Reçu Espèces : {fmtGNF(v.montantRecuEspeces||0)} · Reçu Orange Money : {fmtGNF(v.montantRecuOrangeMoney||0)}
                                  </div>
                                </div>
                              ))}
                            </div>
                          ))}
                        </td>
                      </tr>
                    )}
                  </React.Fragment>
                ))}
                <tr style={{borderTop:'2px solid var(--line-strong)', background:'var(--paper-2)'}}>
                  <td style={{...td, fontWeight:700}}>Total {annee}</td>
                  <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(recetteBrute)}</td>
                  <td style={{...td, fontWeight:700}} className="mono">{impayesReelAnnee>0?fmtGNF(impayesReelAnnee):'—'}</td>
                  <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(depensesAnnee)}</td>
                  <td style={{...td, fontWeight:700}} className="mono">{depensesPropresAnnee>0?fmtGNF(depensesPropresAnnee):'—'}</td>
                  <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(donneesParMoisAffiche.reduce((s,m)=>s+(m.montantRecuEspeces||0),0))}</td>
                  <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(donneesParMoisAffiche.reduce((s,m)=>s+(m.montantRecuOrangeMoney||0),0))}</td>
                  <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(netPercuAnnee)}</td>
                  <td></td>
                </tr>
              </tbody>
            </table>
          </div>
        </>
      )}

      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10, marginBottom:6}}>
        <h2 style={{fontSize:16, color:'var(--pine)', margin:0}}>Répartition entre les acteurs</h2>
        <select value={annee} onChange={e=>setAnnee(Number(e.target.value))} style={{width:'auto', minWidth:100}}>
          {anneesDisponibles.map(y => <option key={y} value={y}>{y}</option>)}
        </select>
      </div>

      {estAnneeApp && (
        <div style={{display:'flex', gap:10, flexWrap:'wrap', alignItems:'center', marginBottom:14}}>
          <button className="btn btn-sm" onClick={()=>setPeriodeRepartition('mois')}
            style={{background: periodeRepartition==='mois'?'var(--pine)':'transparent', color: periodeRepartition==='mois'?'var(--white)':'var(--ink)', borderColor: periodeRepartition==='mois'?'var(--pine)':'var(--line-strong)'}}>
            Mensuelle
          </button>
          <button className="btn btn-sm" onClick={()=>setPeriodeRepartition('annee')}
            style={{background: periodeRepartition==='annee'?'var(--pine)':'transparent', color: periodeRepartition==='annee'?'var(--white)':'var(--ink)', borderColor: periodeRepartition==='annee'?'var(--pine)':'var(--line-strong)'}}>
            Annuelle
          </button>
          {periodeRepartition === 'mois' && (
            <>
              <select value={moisRepartition} onChange={e=>setMoisRepartition(Number(e.target.value))} style={{width:'auto', minWidth:140}}>
                {Array.from({length:12},(_,i)=>i+1).map(m => (
                  <option key={m} value={m}>{new Date(annee, m-1, 1).toLocaleDateString('fr-FR',{month:'long'})}</option>
                ))}
              </select>
              <button className="btn btn-sm" onClick={()=>setCumulRepartition(true)}
                style={{background: cumulRepartition?'var(--gold-light)':'transparent', color: cumulRepartition?'#7a5c00':'var(--ink)', borderColor: cumulRepartition?'var(--warn)':'var(--line-strong)'}}>
                Cumul depuis janvier
              </button>
              <button className="btn btn-sm" onClick={()=>setCumulRepartition(false)}
                style={{background: !cumulRepartition?'var(--gold-light)':'transparent', color: !cumulRepartition?'#7a5c00':'var(--ink)', borderColor: !cumulRepartition?'var(--warn)':'var(--line-strong)'}}>
                Ce mois seulement
              </button>
            </>
          )}
        </div>
      )}

      <div style={{display:'grid', gridTemplateColumns:'repeat(6,1fr)', gap:12, marginBottom:16}}>
        <StatCard label={`Recette brute — ${periodeLabel}`} value={fmtGNF(periodeDonnees.recetteBrute)} icon="euro" />
        <StatCard label={`Impayés — ${periodeLabel}`} value={fmtGNF(periodeDonnees.impayes)} icon="alert" tone={periodeDonnees.impayes>0?'danger':'default'} />
        <StatCard label={`Dépenses — ${periodeLabel}`} value={fmtGNF(periodeDonnees.depenses)} icon="trash" tone="danger" />
        <StatCard label={`Espèces — ${periodeLabel}`} value={fmtGNF(periodeDonnees.especes)} icon="euro" />
        <StatCard label={`Orange Money — ${periodeLabel}`} value={fmtGNF(periodeDonnees.orangeMoney)} icon="euro" />
        <StatCard label={`Net perçu — ${periodeLabel}`} value={fmtGNF(periodeDonnees.recetteNette)} icon="chart" tone={periodeDonnees.recetteNette>=0?'default':'danger'} />
      </div>

      <h2 style={{fontSize:16, color:'var(--pine)', marginBottom:6}}>Total encaissé par mode de paiement</h2>
      <p style={{fontSize:12.5, color:'var(--steam)', margin:'0 0 14px', lineHeight:1.5}}>
        Montants réellement reçus des clients (acomptes, encaissements, et saisies manuelles pour les mois antérieurs) — {periodeLabel}, tous pressings confondus. Cliquez sur une carte pour voir le détail des transactions numériques individuelles (les saisies manuelles groupées par mois n'y apparaissent pas séparément).
      </p>
      <div style={{display:'grid', gridTemplateColumns:'repeat(2,1fr)', gap:14, marginBottom:14}}>
        <div onClick={()=>{ setModeHistoriqueSelectionne(modeHistoriqueSelectionne==='Espèces' ? null : 'Espèces'); setHistoriquePage(1); }}
          style={{cursor:'pointer', borderRadius:12, outline: modeHistoriqueSelectionne==='Espèces' ? '2px solid var(--pine)' : 'none', outlineOffset:2}}>
          <StatCard label="Espèces" value={fmtGNF(periodeDonnees.especes)} icon="euro" />
        </div>
        <div onClick={()=>{ setModeHistoriqueSelectionne(modeHistoriqueSelectionne==='Orange Money' ? null : 'Orange Money'); setHistoriquePage(1); }}
          style={{cursor:'pointer', borderRadius:12, outline: modeHistoriqueSelectionne==='Orange Money' ? '2px solid var(--pine)' : 'none', outlineOffset:2}}>
          <StatCard label="Orange Money" value={fmtGNF(periodeDonnees.orangeMoney)} icon="euro" />
        </div>
      </div>

      {modeHistoriqueSelectionne && (() => {
        const paiementsFiltres = historiquePaiements.filter(p => p.mode === modeHistoriqueSelectionne);
        const parPage = 15;
        const nbPages = Math.ceil(paiementsFiltres.length / parPage) || 1;
        const pageAffichee = Math.min(historiquePage, nbPages) || 1;
        const items = paiementsFiltres.slice((pageAffichee-1)*parPage, pageAffichee*parPage);
        return (
          <div style={{marginBottom:24}}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10, marginBottom:6}}>
              <h3 style={{fontSize:14.5, color:'var(--pine)', margin:0}}>Historique — {modeHistoriqueSelectionne} — {periodeLabel}</h3>
              {paiementsFiltres.length > 0 && (
                <ExportButtons
                  onCSV={()=>exportTableToCSV(`historique-${modeHistoriqueSelectionne}-${annee}`, ['Date','Pressing','Ticket','Client','Employé','Montant'], paiementsFiltres.map(p=>[fmtDateTime(p.date), p.site, p.ticket, p.client, p.employe, Math.round(p.montant)]))}
                  onPDF={()=>exportTableToPDF({ filename:`historique-${modeHistoriqueSelectionne}-${annee}`, title:`Historique — ${modeHistoriqueSelectionne}`, subtitle:`Maci Pressing — ${periodeLabel}`, headers:['Date','Pressing','Ticket','Client','Employé','Montant'], rows:paiementsFiltres.map(p=>[fmtDateTime(p.date), p.site, p.ticket, p.client, p.employe, fmtGNFPdf(p.montant)]) })}
                />
              )}
            </div>
            <p style={{fontSize:12.5, color:'var(--steam)', margin:'0 0 10px', lineHeight:1.5}}>
              {paiementsFiltres.length} paiement(s) en {modeHistoriqueSelectionne} sur cette période.
            </p>
            {paiementsFiltres.length === 0 ? (
              <div className="card" style={{padding:'1.25rem', textAlign:'center', color:'var(--steam)', fontSize:13}}>
                Aucun paiement en {modeHistoriqueSelectionne} sur cette période.
              </div>
            ) : (
              <div className="card" style={{overflow:'hidden'}}>
                <table style={{width:'100%', borderCollapse:'collapse', fontSize:13}}>
                  <thead>
                    <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
                      <th style={th}>Date</th>
                      <th style={th}>Pressing</th>
                      <th style={th}>Ticket</th>
                      <th style={th}>Client</th>
                      <th style={th}>Employé</th>
                      <th style={th}>Montant</th>
                    </tr>
                  </thead>
                  <tbody>
                    {items.map(p => (
                      <tr key={p.id} style={{borderTop:'1px solid var(--line)'}}>
                        <td style={td}>{fmtDateTime(p.date)}</td>
                        <td style={td}>{p.site}</td>
                        <td style={{...td}} className="mono">{p.ticket}</td>
                        <td style={td}>{p.client}</td>
                        <td style={td}>{p.employe}</td>
                        <td style={{...td, fontWeight:600}} className="mono">{fmtGNF(p.montant)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
                {nbPages > 1 && (
                  <div style={{display:'flex', justifyContent:'center', alignItems:'center', gap:10, padding:'10px 0', borderTop:'1px solid var(--line)'}}>
                    <button className="btn btn-sm" disabled={pageAffichee<=1} onClick={()=>setHistoriquePage(pageAffichee-1)}>← Précédent</button>
                    <span style={{fontSize:12.5, color:'var(--steam)'}}>Page {pageAffichee} / {nbPages}</span>
                    <button className="btn btn-sm" disabled={pageAffichee>=nbPages} onClick={()=>setHistoriquePage(pageAffichee+1)}>Suivant →</button>
                  </div>
                )}
              </div>
            )}
          </div>
        );
      })()}

      <p style={{fontSize:12.5, color:'var(--steam)', margin:'0 0 14px', lineHeight:1.5}}>
        « Impayés (part de l'acteur) » indique combien reviendrait à chaque personne si les factures actuellement en attente étaient un jour réglées — à titre d'information seulement. « Montant brut avant impayés (Part de l'acteur) » montre la part projetée de chacun sur la recette brute totale, avant toute déduction. Le montant à distribuer réellement reste celui de la colonne <strong>« Net perçu »</strong>, qui exclut déjà l'argent pas encore encaissé et les dépenses, pour ne jamais distribuer ce que l'entreprise n'a pas.
      </p>
      <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:10, marginBottom:10}}>
        <h2 style={{fontSize:16, color:'var(--ink)', margin:0}}>Répartition entre les acteurs — {periodeLabel}</h2>
        <ExportButtons
          onCSV={()=>exportTableToCSV(`repartition-acteurs-${annee}`, REPARTITION_HEADERS, lignesRepartitionExport)}
          onPDF={()=>exportTableToPDF({ filename:`repartition-acteurs-${annee}`, title:'Répartition entre les acteurs', subtitle:`Maci Pressing — ${periodeLabel}`, headers:REPARTITION_HEADERS, rows:lignesRepartitionExport })}
        />
      </div>

      {pctModifie && (
        <div style={{display:'flex', justifyContent:'space-between', alignItems:'center', gap:10, padding:'10px 14px', background:'var(--warn-light)', borderRadius:8, marginBottom:10}}>
          <span style={{fontSize:13, color:'var(--warn)'}}>⚠️ Parts modifiées, non enregistrées.</span>
          <button className="btn btn-rust btn-sm" onClick={enregistrerPcts}>Enregistrer les parts</button>
        </div>
      )}
      <div className="card" style={{overflow:'hidden'}}>
        <table style={{width:'100%', borderCollapse:'collapse', fontSize:13.5}}>
          <thead>
            <tr style={{background:'var(--paper-2)', textAlign:'left'}}>
              <th style={th}>Bénéficiaire</th>
              <th style={th}>Part</th>
              <th style={th}>Montant brut avant impayés (Part de l'acteur)</th>
              <th style={th}>Impayés (part de l'acteur)</th>
              <th style={th}>Net perçu (avant dépenses propres)</th>
              <th style={th}>Dépenses propres</th>
              <th style={th}>Net perçu</th>
              <th style={th}>Montant à verser</th>
            </tr>
          </thead>
          <tbody>
            {parts.map(p => {
              const impayesPart = periodeDonnees.impayes * p.pct / 100;
              const montantBrut = periodeDonnees.recetteNette * p.pct / 100;
              const montantBrutAvantImpayes = periodeDonnees.recetteBrute * p.pct / 100;
              const depensePropre = (depensesActeursPeriode[p.nom]||[]).reduce((s,e)=>s+(Number(e.montant)||0),0) + (depensesPropresEmployes[p.nom]||0);
              const montantNet = montantBrut - depensePropre;
              const cumule = impayesPart + montantNet;
              const estConcerne = remboursementActif && ACTEURS_REMBOURSEMENT_INVESTISSEMENT.includes(p.nom);
              const montantAVerser = p.nom === 'Conservation du Capital Fixe'
                ? montantNet + totalRedirigeVersCapitalFixe
                : (estConcerne ? montantNet * 0.8 : montantNet);
              return (
                <tr key={p.nom} style={{borderTop:'1px solid var(--line)'}}>
                  <td style={td}>{p.nom}</td>
                  <td style={td}>
                    <input type="number" value={pctEdits[p.nom] ?? p.pct} min="0" max="100"
                      onChange={e=>setPctEdits(prev=>({...prev, [p.nom]: e.target.value}))}
                      style={{width:60, padding:'4px 6px', textAlign:'right', fontSize:13}} />%
                  </td>
                  <td style={{...td, fontWeight:600}} className="mono">{fmtGNF(montantBrutAvantImpayes)}</td>
                  <td style={{...td, color: impayesPart>0 ? 'var(--danger)' : 'var(--steam)'}} className="mono">{impayesPart>0 ? fmtGNF(impayesPart) : '—'}</td>
                  <td style={{...td, fontWeight:700, color: montantBrut<0 ? 'var(--danger)' : 'var(--ink)'}} className="mono">{fmtGNF(montantBrut)}</td>
                  <td style={{...td, color: depensePropre>0 ? 'var(--danger)' : 'var(--steam)'}} className="mono">{depensePropre>0 ? '− '+fmtGNF(depensePropre) : '—'}</td>
                  <td style={{...td, fontWeight:700, color: montantNet<0 ? 'var(--danger)' : 'var(--ink)'}} className="mono">{fmtGNF(montantNet)}</td>
                  <td style={{...td, fontWeight:700, color:'var(--ok)'}} className="mono">
                    {fmtGNF(montantAVerser)}
                    {estConcerne && <div style={{fontSize:10.5, color:'var(--warn)', fontWeight:600}}>80% (20% → Capital Fixe)</div>}
                    {p.nom === 'Conservation du Capital Fixe' && totalRedirigeVersCapitalFixe > 0 && <div style={{fontSize:10.5, color:'var(--warn)', fontWeight:600}}>+ {fmtGNF(totalRedirigeVersCapitalFixe)} reçus</div>}
                  </td>
                </tr>
              );
            })}
            <tr style={{borderTop:'2px solid var(--line-strong)', background:'var(--paper-2)'}}>
              <td style={{...td, fontWeight:700}}>Total</td>
              <td style={{...td, fontWeight:700}}>100%</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(periodeDonnees.recetteBrute)}</td>
              <td style={{...td, fontWeight:700, color: periodeDonnees.impayes>0?'var(--danger)':'var(--steam)'}} className="mono">{periodeDonnees.impayes>0?fmtGNF(periodeDonnees.impayes):'—'}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(periodeDonnees.recetteNette)}</td>
              <td style={{...td, fontWeight:700}} className="mono">{totalDepensesActeursPeriode>0 ? '− '+fmtGNF(totalDepensesActeursPeriode) : '—'}</td>
              <td style={{...td, fontWeight:700}} className="mono">{fmtGNF(periodeDonnees.recetteNette - totalDepensesActeursPeriode)}</td>
              <td style={{...td, fontWeight:700, color:'var(--ok)'}} className="mono">{fmtGNF(periodeDonnees.recetteNette - totalDepensesActeursPeriode)}</td>
            </tr>
          </tbody>
        </table>
      </div>

      {moisSaisieHisto && (
        <SaisieMoisHistoriqueModal
          mois={moisSaisieHisto}
          annee={annee}
          valeursExistantes={detailMensuelHistoManuel[moisSaisieHisto] || {}}
          onSave={(valeurs)=>{ saveMoisHistorique(moisSaisieHisto, valeurs); setMoisSaisieHisto(null); }}
          onClose={()=>setMoisSaisieHisto(null)}
        />
      )}
    </div>
  );
}

          <div><label>Dépenses entreprise</label><input type="number" value={depenses} onChange={e=>setDepenses(e.target.value)} /></div>
          <div><label>Dépenses propres</label><input type="number" value={depensesPropres} onChange={e=>setDepensesPropres(e.target.value)} /></div>
          <div><label>Description (pour situer)</label><input type="text" placeholder="Ex: avance sur salaire" value={depensesPropresDescription} onChange={e=>setDepensesPropresDescription(e.target.value)} /></div>
          <div><label>Reçu Espèces</label><input type="number" value={montantRecuEspeces} onChange={e=>setMontantRecuEspeces(e.target.value)} /></div>
          <div><label>Reçu Orange Money</label><input type="number" value={montantRecuOrangeMoney} onChange={e=>setMontantRecuOrangeMoney(e.target.value)} /></div>

}


function GlobalDashboard({ db, onOpenSite }){
  const today = todayISO();
  const [periodeGlobale, setPeriodeGlobale] = useState('jour');
  const [moisGlobal, setMoisGlobal] = useState(today.slice(0,7));
  const [anneeGlobale, setAnneeGlobale] = useState(Number(today.slice(0,4)));

  const getWeekDates = () => {
    const d = new Date(today + 'T00:00:00');
    const day = d.getDay() || 7;
    const monday = new Date(d); monday.setDate(d.getDate() - day + 1);
    const sunday = new Date(monday); sunday.setDate(monday.getDate() + 6);
    const toISO = (dt) => dt.toISOString().slice(0,10);
    return { start: toISO(monday), end: toISO(sunday) };
  };
  const week = getWeekDates();

  function dansPeriode(dateStr){
    const d = (dateStr||'').slice(0,10);
    if(periodeGlobale === 'jour') return d === today;
    if(periodeGlobale === 'semaine') return d >= week.start && d <= week.end;
    if(periodeGlobale === 'mois') return d.slice(0,7) === moisGlobal;
    if(periodeGlobale === 'annee') return d.slice(0,4) === String(anneeGlobale);
    return true; // 'total' = à ce jour, tout confondu
  }

  function estAvantSeuilMois(anneeNum, moisNum){
    return anneeNum < 2026 || (anneeNum === 2026 && moisNum < 9);
  }
  // Mois avant-seuil (saisie manuelle uniquement) compris dans la période choisie, pour ajouter les montants manuels
  const moisManuelsDansPeriode = useMemo(() => {
    const liste = [];
    if(periodeGlobale === 'mois'){
      const [a,m] = moisGlobal.split('-').map(Number);
      if(estAvantSeuilMois(a,m)) liste.push({ annee:a, mois:m });
    } else if(periodeGlobale === 'annee'){
      for(let m=1; m<=12; m++) if(estAvantSeuilMois(anneeGlobale, m)) liste.push({ annee:anneeGlobale, mois:m });
    } else if(periodeGlobale === 'total'){
      for(let a=ANNEE_DEBUT_APP-3; a<=Number(today.slice(0,4)); a++){
        for(let m=1; m<=12; m++) if(estAvantSeuilMois(a,m)) liste.push({ annee:a, mois:m });
      }
    }
    return liste;
  }, [periodeGlobale, moisGlobal, anneeGlobale, today]);

  const globalEspecesOrangeDepenses = useMemo(() => {
    let especes = 0, orangeMoney = 0, depenses = 0, impayes = 0, revenuFacture = 0;
    db.sites.forEach(site => {
      (site.commandes||[]).forEach(c => {
        getPaiementsCommande(c).forEach(pmt => {
          if(!pmt.date || !dansPeriode(pmt.date)) return;
          if(pmt.mode === 'Orange Money') orangeMoney += Number(pmt.montant);
          else especes += Number(pmt.montant);
        });
        if(c.dateCreation && dansPeriode(c.dateCreation)){
          revenuFacture += calcCommandeTotal(c, site.services);
        }
        if(c.paiement === 'impaye' && c.dateCreation && dansPeriode(c.dateCreation)){
          impayes += calcCommandeTotal(c, site.services) - (Number(c.acompte)||0);
        }
      });
      (site.depenses||[]).forEach(d => {
        if(d.date && dansPeriode(d.date)) depenses += Number(d.montant)||0;
      });
      moisManuelsDansPeriode.forEach(({annee, mois}) => {
        const parEmploye = normaliserMoisManuel(((site.detailMensuelManuel||{})[annee]||{})[String(mois)]) || {};
        Object.values(parEmploye).forEach(v => {
          especes += Number(v.montantRecuEspeces)||0;
          orangeMoney += Number(v.montantRecuOrangeMoney)||0;
          depenses += Number(v.depenses)||0;
          impayes += Number(v.impayes)||0;
          revenuFacture += Number(v.recetteBrute)||0;
        });
      });
    });
    return { especes, orangeMoney, depenses, impayes, revenuFacture };
  }, [db.sites, periodeGlobale, moisGlobal, anneeGlobale, moisManuelsDansPeriode]);

  const anneesGlobalesDisponibles = useMemo(() => {
    const arr = [];
    const currentYear = Number(today.slice(0,4));
    for(let y = currentYear; y >= ANNEE_DEBUT_APP - 3; y--) arr.push(y);
    return arr;
  }, [today]);

  const periodeGlobaleLabel = periodeGlobale==='jour' ? "Aujourd'hui" : periodeGlobale==='semaine' ? 'Cette semaine' : periodeGlobale==='mois' ? 'Ce mois' : periodeGlobale==='annee' ? 'Cette année' : 'À ce jour (tout confondu)';

  const perSite = db.sites.map(site => {
    const cmds = site.commandes;
    const cmdsToday = cmds.filter(c => c.dateCreation.slice(0,10) === today);
    const cmdsMonth = cmds.filter(c => c.dateCreation.slice(0,7) === today.slice(0,7));
    const caJour = cmdsToday.reduce((s,c)=>s+calcCommandeTotal(c, site.services),0);
    const caMois = cmdsMonth.reduce((s,c)=>s+calcCommandeTotal(c, site.services),0);
    const impayes = cmds.filter(c => c.paiement === 'impaye');
    const montantImpaye = impayes.reduce((s,c)=>s+calcCommandeTotal(c, site.services),0);
    const enCours = cmds.filter(c => c.statut === 'En cours' || c.statut === 'Reçu').length;
    const lowStock = site.stock.filter(s => s.quantite <= s.seuil).length;
    const depensesMois = (site.depenses||[]).filter(d=>d.date.slice(0,7)===today.slice(0,7)).reduce((s,d)=>s+Number(d.montant),0);
    const beneficeMois = caMois - depensesMois;
    let especesMois = 0, orangeMoneyMois = 0;
    cmds.forEach(c => {
      getPaiementsCommande(c).forEach(pmt => {
        if(!pmt.date || pmt.date.slice(0,7) !== today.slice(0,7)) return;
        if(pmt.mode === 'Orange Money') orangeMoneyMois += Number(pmt.montant)||0;
        else especesMois += Number(pmt.montant)||0;
      });
    });
    return { site, caJour, caMois, montantImpaye, impayesCount: impayes.length, enCours, lowStock, clientsCount: site.clients.length, depensesMois, beneficeMois, especesMois, orangeMoneyMois };
  });

  const totals = perSite.reduce((acc, p) => ({
    caJour: acc.caJour + p.caJour,
    caMois: acc.caMois + p.caMois,
    montantImpaye: acc.montantImpaye + p.montantImpaye,
    clientsCount: acc.clientsCount + p.clientsCount,
  }), { caJour:0, caMois:0, montantImpaye:0, clientsCount:0 });

  return (
    <div>
      <PageHeader title="Vue globale" subtitle={`${db.sites.length} pressing(s) — ${fmtDate(today)}`} />

      <div style={{display:'flex', gap:8, marginBottom:16, flexWrap:'wrap', alignItems:'center'}}>
        {[{k:'jour',l:"Aujourd'hui"},{k:'semaine',l:'Cette semaine'},{k:'mois',l:'Mois'},{k:'annee',l:'Année'},{k:'total',l:'À ce jour'}].map(opt => (
          <button key={opt.k} className="btn btn-sm" onClick={()=>setPeriodeGlobale(opt.k)}
            style={{background:periodeGlobale===opt.k?'var(--pine)':'transparent', color:periodeGlobale===opt.k?'var(--white)':'var(--ink)', borderColor:periodeGlobale===opt.k?'var(--pine)':'var(--line-strong)'}}>
            {opt.l}
          </button>
        ))}
        {periodeGlobale === 'mois' && (
          <input type="month" value={moisGlobal} onChange={e=>setMoisGlobal(e.target.value)} style={{width:'auto'}} />
        )}
        {periodeGlobale === 'annee' && (
          <select value={anneeGlobale} onChange={e=>setAnneeGlobale(Number(e.target.value))} style={{width:'auto', minWidth:100}}>
            {anneesGlobalesDisponibles.map(y => <option key={y} value={y}>{y}</option>)}
          </select>
        )}
      </div>

      <div style={{display:'grid', gridTemplateColumns:'repeat(8, 1fr)', gap:8, marginBottom:28}}>
        {[
          { label: 'Revenu (factures)', value: globalEspecesOrangeDepenses.revenuFacture, danger: false },
          { label: 'Impayés', value: globalEspecesOrangeDepenses.impayes, danger: globalEspecesOrangeDepenses.impayes>0 },
          { label: 'Espèces', value: globalEspecesOrangeDepenses.especes, danger: false },
          { label: 'Orange Money', value: globalEspecesOrangeDepenses.orangeMoney, danger: false },
          { label: 'Total Esp. + OM', value: globalEspecesOrangeDepenses.especes + globalEspecesOrangeDepenses.orangeMoney, danger: false },
          { label: 'Dépenses', value: globalEspecesOrangeDepenses.depenses, danger: true },
          { label: 'Net perçu', value: globalEspecesOrangeDepenses.especes + globalEspecesOrangeDepenses.orangeMoney - globalEspecesOrangeDepenses.depenses, danger: (globalEspecesOrangeDepenses.especes + globalEspecesOrangeDepenses.orangeMoney - globalEspecesOrangeDepenses.depenses)<0 },
          { label: 'Clients', value: totals.clientsCount, danger: false, notMoney: true },
        ].map((c,i) => (
          <div key={i} className="card" style={{padding:'0.7rem 0.8rem'}}>
            <div style={{fontSize:10, color:'var(--steam)', textTransform:'uppercase', letterSpacing:'0.02em', fontWeight:600, lineHeight:1.3, marginBottom:4}}>{c.label}</div>
            <div className="mono" style={{fontSize:14.5, fontWeight:700, color: c.danger ? 'var(--danger)' : 'var(--pine)'}}>{c.notMoney ? c.value : fmtGNF(c.value)}</div>
          </div>
        ))}
      </div>
      <p style={{fontSize:11, color:'var(--steam)', margin:'-20px 0 24px'}}>Montants pour la période : {periodeGlobaleLabel}</p>

      <h2 style={{fontSize:16, color:'var(--pine)', marginBottom:14}}>Détail par site</h2>
      <div style={{display:'grid', gap:14}}>
        {perSite.map(p => (
          <div key={p.site.id} className="card" style={{padding:'1.25rem 1.5rem', cursor:'pointer'}} onClick={()=>onOpenSite(p.site.id)}>
            <div style={{display:'flex', justifyContent:'space-between', alignItems:'flex-start', flexWrap:'wrap', gap:10}}>
              <div>
                <div style={{display:'flex', alignItems:'center', gap:8}}>
                  <span style={{fontWeight:700, fontSize:16}}>{p.site.nom}</span>
                  <span className="mono" style={{fontSize:11, color:'var(--steam)'}}>{p.site.code}</span>
                </div>
                <div style={{fontSize:12.5, color:'var(--steam)', marginTop:2}}>{p.site.adresse}</div>
              </div>
              <div style={{display:'flex', alignItems:'center', gap:6, color:'var(--pine)', fontSize:13, fontWeight:600}}>
                Voir le détail <Icon name="arrowRight" size={14}/>
              </div>
            </div>
            <div style={{display:'flex', gap:24, marginTop:16, flexWrap:'wrap'}}>
              <MiniMetric label="CA aujourd'hui" value={fmtGNF(p.caJour)} />
              <MiniMetric label="CA ce mois" value={fmtGNF(p.caMois)} />
              <MiniMetric label="Impayés" value={fmtGNF(p.montantImpaye)} danger={p.impayesCount>0} />
              <MiniMetric label="Espèces (mois)" value={fmtGNF(p.especesMois)} />
              <MiniMetric label="Orange Money (mois)" value={fmtGNF(p.orangeMoneyMois)} />
              <MiniMetric label="À traiter" value={p.enCours} />
              <MiniMetric label="Stock bas" value={p.lowStock} danger={p.lowStock>0} />
              <MiniMetric label="Dépenses mois" value={fmtGNF(p.depensesMois)} danger={p.depensesMois>0} />
              <MiniMetric label="Bénéfice net" value={fmtGNF(p.beneficeMois)} danger={p.beneficeMois<0} />
              <MiniMetric label="Total clients" value={p.clientsCount} />
            </div>
          </div>
        ))}
      </div>
    </div>
  );
}

function MiniMetric({ label, value, danger }){
  return (
    <div>
      <div style={{fontSize:11, color:'var(--steam)', textTransform:'uppercase', fontWeight:600, letterSpacing:'0.03em'}}>{label}</div>
      <div className="mono" style={{fontSize:15, fontWeight:700, color: danger ? 'var(--danger)' : 'var(--pine)'}}>{value}</div>
    </div>
  );
}

function SitesManager({ db, addSite, removeSite, onOpenSite, setDb }){
  const [showNew, setShowNew] = useState(false);
  const [confirmSite, setConfirmSite] = useState(null);
  const [showUniformiser, setShowUniformiser] = useState(false);
  const [sourceSiteId, setSourceSiteId] = useState(db.sites[0]?.id || '');
  const [uniformFlash, setUniformFlash] = useState(false);

  function uniformiserPrix(){
    const source = db.sites.find(s => s.id === sourceSiteId);
    if(!source) return;
    const updatedSites = db.sites.map(site => {
      if(site.id === sourceSiteId) return site;
      // Uniformiser les services
      const newServices = source.services.map(srcSvc => {
        const existing = site.services.find(s => s.nom === srcSvc.nom);
        if(existing) return { ...existing, prix: srcSvc.prix, categorie: srcSvc.categorie };
        return { ...srcSvc, id: uid('svc_') };
      });
      // Uniformiser les tarifs de rémunération
      const sourceConfig = source.configRemuneration || { tarifsRepassage: [], zones: [] };
      const newConfigRemuneration = {
        tarifsRepassage: sourceConfig.tarifsRepassage.map(t => ({ ...t, id: uid('rep_') })),
        zones: sourceConfig.zones.map(z => ({ ...z, id: uid('zone_') })),
      };
      return { ...site, services: newServices, configRemuneration: newConfigRemuneration };
    });
    setDb({ ...db, sites: updatedSites });
    setUniformFlash(true);
    setTimeout(()=>setUniformFlash(false), 2000);
  }

  return (
    <div>
      <PageHeader title="Mes pressings" subtitle="Créez, supprimez ou ouvrez un établissement"

          <button className="btn" onClick={()=>setShowUniformiser(!showUniformiser)}>

      {showUniformiser && (
        <div className="card" style={{padding:'1.25rem', marginBottom:18, background:'var(--pine-light)', border:'1.5px solid var(--pine)'}}>

          <p style={{fontSize:13, color:'var(--pine)', margin:'0 0 14px', lineHeight:1.5}}>
            Copie les services et prix d'un pressing vers <strong>tous les autres</strong>. Les prix existants seront mis à jour, les nouveaux services ajoutés.
          </p>
          <div style={{display:'flex', gap:12, alignItems:'flex-end', flexWrap:'wrap'}}>
            <div style={{flex:1, minWidth:200}}>
              <label>Pressing source (modèle)</label>
              <select value={sourceSiteId} onChange={e=>setSourceSiteId(e.target.value)}>
                {db.sites.map(s => <option key={s.id} value={s.id}>{s.nom}</option>)}
              </select>
            </div>
            <button className="btn btn-rust" onClick={uniformiserPrix} style={{minWidth:200}}>
              {uniformFlash ? <><Icon name="check" size={14}/> Prix uniformisés !</> : `Copier vers ${db.sites.length - 1} autre(s) pressing(s)`}
